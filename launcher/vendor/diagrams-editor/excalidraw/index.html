<!doctype html>
<!--
SPDX-License-Identifier: AGPL-3.0-or-later

Self-hosted Excalidraw visual editor. Served by the launcher's local
diagrams-editor HTTP server (commands/diagrams_local_server.rs) when the
user clicks "Draw Excalidraw (visual)" in DiagramsTab.svelte.

The page opens in the user's DEFAULT BROWSER, NOT in the Tauri WebView —
Excalidraw renders broken on Wayland + webkit2gtk (docs/EXCALIDRAW_WAYLAND_TEST.md),
which is the whole reason for the local-server-in-browser design.

The URL contract (matches mermaid/index.html for symmetry):
    http://127.0.0.1:<port>/excalidraw/?file=<rel_path>#token=<hex>

`<rel_path>` is the project-relative path of the .excalidraw file the
launcher created or pre-existed. The page:
    1. On load, GET /file?path=<rel_path> to populate the canvas
       (404 / empty body = blank new file).
    2. On Save, serialize the scene and POST it to
       /save?path=<rel_path> with `Authorization: Bearer <#token>`.
    3. The launcher's filesystem watcher (commands/diagram_watcher.rs)
       picks up the change and auto-registers the diagram on first edit.

Assets are 100% self-hosted (no CDN):
    - excalidraw.bundle.js  — react + react-dom + @excalidraw + glue
                              (built by src/build.mjs; see VENDORED.md)
    - excalidraw.bundle.css — Excalidraw's stylesheet
    - css-fonts/            — the small UI font (Assistant), referenced
                              by the CSS @font-face url()s
    - fonts/               — the hand-drawn CANVAS fonts (Excalifont,
                              Virgil, Cascadia, CJK, …), loaded at
                              runtime via window.EXCALIDRAW_ASSET_PATH.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>VCO — Excalidraw editor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./excalidraw.bundle.css" />
    <style>
      :root {
        --bg: #1e1e1e;
        --fg: #e1e1e1;
        --accent: #3b82f6;
        --accent-hover: #2563eb;
        --border: #3a3a3a;
        --panel: #252525;
        --error: #ef4444;
        --success: #10b981;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 14px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 16px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        height: 48px;
      }
      header h1 {
        font-size: 14px;
        margin: 0;
        font-weight: 600;
      }
      header .file-path {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 12px;
        color: #999;
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      header button {
        background: var(--accent);
        color: white;
        border: none;
        padding: 6px 16px;
        border-radius: 4px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }
      header button:hover { background: var(--accent-hover); }
      header button:disabled { opacity: 0.5; cursor: not-allowed; }
      header .status {
        font-size: 12px;
        color: #999;
        min-width: 120px;
        text-align: right;
      }
      header .status.error { color: var(--error); }
      header .status.success { color: var(--success); }
      header .status.modified { color: #f59e0b; }
      /* The Excalidraw canvas fills everything below the toolbar. */
      #root {
        height: calc(100% - 48px);
        width: 100%;
      }
      /* Excalidraw mounts a full-height flex container into #root. */
      #root .excalidraw {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Excalidraw editor</h1>
      <span id="filePath" class="file-path">—</span>
      <span id="status" class="status">Loading…</span>
      <button id="saveBtn" disabled>Save</button>
    </header>
    <div id="root"></div>

    <!--
      EXCALIDRAW_ASSET_PATH must be the directory that CONTAINS the
      `fonts/` tree (Excalidraw builds font URLs as
      `new URL("fonts/<Family>/<file>.woff2", EXCALIDRAW_ASSET_PATH)`).
      This page is served at /excalidraw/, and we copied the font tree
      to /excalidraw/fonts/, so the asset path is this page's own dir.
      Set it BEFORE the bundle loads so the font resolver sees it.
    -->
    <script>
      window.EXCALIDRAW_ASSET_PATH = "/excalidraw/";
    </script>
    <script src="./excalidraw.bundle.js"></script>
  </body>
</html>
