# Supabase project config for the launcher's edge functions.
#
# This file is consumed by `supabase functions deploy ...`. Per-function
# settings here override the CLI default (which is verify_jwt = true).
#
# Why several functions are verify_jwt = false:
#   - validate-tier: authenticates via the request body's `license_key`
#     (a license key OR a Vault admin token). The auth boundary is at
#     the body level, not the JWT level. Adding a JWT requirement on
#     top would force the launcher to obtain a Supabase anon key just
#     to call validate-tier — which it already needs to do anyway, but
#     the wider compatibility (sb_publishable_* keys are NOT accepted
#     by verify_jwt edge functions) makes this cleaner.
#   - lemon-squeezy-webhook: authenticates via HMAC-SHA256 signature in
#     the X-Signature header. JWT verification on top is redundant.

project_id = "ovpdtijpdchzlxbojhsg"

[functions.validate-tier]
verify_jwt = false

[functions.lemon-squeezy-webhook]
verify_jwt = false

[functions.rl-latest-version]
verify_jwt = false

# v0.2.33: public catalog endpoint. Returns metadata for paid modules
# (id, name, version, tier, hosts, install-time slice). Read by the
# launcher's `module_catalog_client.rs` before the user has any
# license — anonymous reads are intentional. Same auth posture as
# validate-tier / rl-latest-version. The actual security gate is at
# rl-artifact-url (license-validated GHCR token issuance) for image
# pulls, not at the
# catalog-read layer (catalog metadata is marketing-tile-equivalent).
[functions.module-catalog]
verify_jwt = false

# v0.2.35 (2026-05-26): paid-module pull-token gateway. Authenticates
# via the body's {license_key, machine_id_hash} pair (license_key is
# either a Lemon Squeezy UUID or a `vct_admin_*` Vault token; both
# shapes accepted by `validateRequestBody`). The function internally
# does a server-to-server call to `/validate-tier` to re-confirm tier
# ≥ pro BEFORE issuing a GHCR pull token, so the auth boundary is at
# the body level (not JWT). Without `verify_jwt = false`, every
# launcher install attempt hits `UNAUTHORIZED_NO_AUTH_HEADER` before
# the function body even runs — discovered during v0.2.35 dogfooding
# 2026-05-26. Source-controlled so the next deploy re-applies it.
[functions.rl-artifact-url]
verify_jwt = false
