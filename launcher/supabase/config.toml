# Supabase project config for the launcher's edge functions.
#
# This file is consumed by `supabase functions deploy ...`. Per-function
# settings here override the CLI default (which is verify_jwt = true).
#
# Why several functions are verify_jwt = false:
#   - validate-tier: authenticates via the request body's `license_key`
#     (a license key OR a Vault admin token). The auth boundary is at
#     the body level, not the JWT level. Adding a JWT requirement on
#     top would force the launcher to obtain a Supabase anon key just
#     to call validate-tier — which it already needs to do anyway, but
#     the wider compatibility (sb_publishable_* keys are NOT accepted
#     by verify_jwt edge functions) makes this cleaner.
#   - lemon-squeezy-webhook: authenticates via HMAC-SHA256 signature in
#     the X-Signature header. JWT verification on top is redundant.

project_id = "ovpdtijpdchzlxbojhsg"

[functions.validate-tier]
verify_jwt = false

[functions.lemon-squeezy-webhook]
verify_jwt = false

[functions.rl-latest-version]
verify_jwt = false

# v0.2.33: public catalog endpoint. Returns metadata for paid modules
# (id, name, version, tier, hosts, install-time slice). Read by the
# launcher's `module_catalog_client.rs` before the user has any
# license — anonymous reads are intentional. Same auth posture as
# validate-tier / rl-latest-version. The actual security gate is at
# rl-artifact-url (license-validated GHCR token issuance) for image
# pulls, not at the
# catalog-read layer (catalog metadata is marketing-tile-equivalent).
[functions.module-catalog]
verify_jwt = false

# v0.2.35 (2026-05-26): paid-module pull-token gateway. Authenticates
# via the body's {license_key, machine_id_hash} pair (license_key is
# either a Lemon Squeezy UUID or a `vct_admin_*` Vault token; both
# shapes accepted by `validateRequestBody`). The function internally
# does a server-to-server call to `/validate-tier` to re-confirm tier
# ≥ pro BEFORE issuing a GHCR pull token, so the auth boundary is at
# the body level (not JWT). Without `verify_jwt = false`, every
# launcher install attempt hits `UNAUTHORIZED_NO_AUTH_HEADER` before
# the function body even runs — discovered during v0.2.35 post-update validation
# 2026-05-26. Source-controlled so the next deploy re-applies it.
[functions.rl-artifact-url]
verify_jwt = false

# v0.2.49 (2026-06-06): default-weights signed-URL gateway. Same auth
# posture as rl-artifact-url — validates the body's
# {license_key, machine_id_hash, embedding_source, module_id} and
# issues a short-lived signed Storage URL for the per-source default
# .pt weights. Launcher caller sets `Authorization: Bearer <license_key>`
# (the call site in `module_default_weights.rs::fetch_signed_download_url`
# wraps `bearer_auth(license_key)` for compat with the validate-tier
# variant), but the function reads its auth from the body, NOT the
# header. Without `verify_jwt = false`, every post-install
# auto-download hits `UNAUTHORIZED_INVALID_JWT_FORMAT` because the
# license key isn't a Supabase JWT — the gateway pre-gate rejects
# before the function body runs.
#
# Discovered 2026-06-06 during post-update validation after
# Bug B + C unblocked the install path end-to-end. Audit log:
# `module_default_weights_auto_download_deferred` with
# `rl-latest-weights returned 401 Unauthorized:
# {"code":"UNAUTHORIZED_INVALID_JWT_FORMAT","message":"Invalid JWT"}`.
#
# Same lesson as the v0.2.35 rl-artifact-url discovery: edge functions
# that DO their own body-level auth must opt out of Supabase's
# default JWT pre-gate via `verify_jwt = false`, otherwise the
# pre-gate runs first and rejects on header shape regardless of body.
[functions.rl-latest-weights]
verify_jwt = false

# v0.2.36: admin machine-rebind endpoint. Authenticates via the body's
# `license_key` (vct_admin_*) — possession of the token is the auth
# boundary, same model as validate-tier's Path A. The endpoint mutates
# the Vault secret via a SECURITY DEFINER RPC and audit-logs the rebind
# outcome. Without `verify_jwt = false`, the launcher would have to
# obtain an anon key just to call this, defeating the point of a
# self-serve recovery flow when the user's only credential is the
# vct_admin_ token itself.
[functions.rebind-admin-token]
verify_jwt = false
