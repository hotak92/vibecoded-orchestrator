[package]
name = "vct-hub"
version = "0.2.21"
edition = "2021"
description = "Detached HTTP server for VCT — supervisor + resolver, survives launcher GUI close."
authors = ["VibeCoded Tools"]
license = "AGPL-3.0"

[lib]
name = "vct_hub"
path = "src/lib.rs"

[[bin]]
name = "vct-hub"
path = "src/main.rs"

[dependencies]
vct-launcher-core = { path = "../vct-launcher-core" }

# HTTP server
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Hex-encoded auth tokens
hex = "0.4"

# DB (hub.db state for the message-bus / app-registry sub-API)
rusqlite = { version = "0.39", features = ["bundled"] }

# UUID for message + interaction IDs
uuid = { version = "1", features = ["v4"] }

# Time stamps in event log
chrono = { version = "0.4", features = ["serde"] }

# Inter-binary HTTP calls (cli_api proxies licensing/telemetry to in-process helpers; future hub→launcher callbacks)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Logging (println for v0.2.21 minimal stub; structured logging is a v0.2.22 followup)

# Random for hub auth tokens (will reuse the same posture as the in-launcher hub)
rand = { version = "0.9", default-features = false, features = ["std", "std_rng", "os_rng"] }

# Step 11: boot.rs canonicalises current_exe() via dunce so the
# rendered unit/plist/task always embeds a stable, UNC-free path.
# Same crate is already used by the main launcher (vct-launcher-core).
dunce = "1"

# Step 5: lifecycle.rs uses libc::kill / libc::setsid on Unix, and
# windows-sys::TerminateProcess / OpenProcess on Windows. pid_is_alive
# lives in vct-launcher-core::process and already brings those, but
# lifecycle.rs uses them directly too — declare here so the dependency
# graph is self-documenting.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"

# `modules_api.rs` has a keyring-probe gate that conditionally skips
# keychain-touching tests on CI where libsecret is absent. The probe
# itself needs the `keyring` crate.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
