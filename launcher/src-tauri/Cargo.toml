[workspace]
# v0.2.21 in-place workspace conversion. The launcher package (this file)
# remains both the workspace root manifest AND a workspace member. New
# crates live in subdirectories. Tauri build artifacts (tauri.conf.json,
# build.rs, capabilities/, icons/, gen/) stay at this level — they belong
# to the launcher member. See `knowledge/concepts/launcher-binary-metadata-schema.md`
# §"Workspace structure (v0.2.21)" + the v0.2.21 plan §3.
members = ["vct-launcher-core", "vct-hub", "vct-updater"]

# v0.2.57: SINGLE source of truth for the workspace version. Every member
# crate (the launcher binary below + vct-hub / vct-updater /
# vct-launcher-core) sets `version.workspace = true` and inherits THIS
# value. Bump it here ONCE per release — cargo propagates it to all
# crates, and the hub's `env!("CARGO_PKG_VERSION")` (its /health version)
# then reports correctly. Before v0.2.57 each crate carried its own
# literal `version =`, which silently drifted (the hub was stuck at
# 0.2.54 while the launcher shipped 0.2.56). The non-Cargo pins are
# propagated from this same logical version by `scripts/bump-version.sh`
# and verified by `scripts/pre-ship-check.sh`.
[workspace.package]
version = "0.2.67"

[package]
name = "vct-launcher-temp"
version.workspace = true
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vct_launcher_temp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# v0.2.21: shared types live in the workspace's `vct-launcher-core` member.
# Both this binary and the new `vct-hub` binary depend on it. See plan §3d.
vct-launcher-core = { path = "vct-launcher-core" }

# NOTE: tried adding [dev-dependencies] vct-launcher-core with the
# test-support feature here, but it triggered a tauri-build panic
# ("missing cargo:dev instruction"). Workspace-aware feature
# unification interacts oddly with that re-declaration. The fix is
# different — TBD. For now the launcher tests will fail to compile
# until resolved.

tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

# v0.2.21: per-user single-instance enforcement. On 2nd launch attempt,
# the plugin fires a callback in the FIRST launcher process and exits
# the SECOND process before the Tauri runtime initialises. Our callback
# focuses the existing window so the user sees their already-running
# launcher come to front instead of "nothing happened" + a half-spawned
# duplicate. This removes the dual-launcher hazard (hub.token rotation,
# port-bind chaos, parallel DB writers) entirely.
#
# The plugin uses an OS-level mutex/lock under the hood:
#   - Linux/macOS: AF_UNIX socket at $XDG_RUNTIME_DIR/<identifier>.sock
#   - Windows: Named mutex via OpenMutexW / CreateMutexW
# Both are user-scoped (different users can run their own launcher).
tauri-plugin-single-instance = "2"
# v0.2.43 (contributor branch feat/launcher-logo-circular-white): persist window
# size + position + maximized state across launches. Without this, the
# launcher always opens at the default 1200x800 even after the user
# maximizes — irritating UX (Slack/Discord/VS Code all persist state).
# The plugin auto-restores on `tauri::Builder::setup` and auto-saves on
# window resize/move/close. Per-user state file at the OS conventional
# app-config dir (`%APPDATA%/com.vibecodedtools.launcher/.window-state.json`
# on Windows, `~/Library/Application Support/...` on macOS, `~/.config/...`
# on Linux). Combined with `maximized: true` in tauri.conf.json `windows[]`,
# the first launch opens full-screen + every subsequent launch reuses
# whatever shape the user left it in.
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
directories = "6"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"

# Hub API server
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }

# SQLite for async comms + config
rusqlite = { version = "0.39", features = ["bundled"] }

# OS keychain for secrets (macOS Keychain / Windows Credential Manager / Linux libsecret)
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# Safer subprocess spawning (tokenize strings to Vec<String>)
shlex = "1"

# Hashing for machine ID (sha256 of platform-stable host id, matches
# Python validator.py — algorithm updated in v0.2.36 from MAC-based to
# platform-stable; see commands/licensing.rs::machine_id_hash).
sha2 = "0.11"

# Regex for manifest validation patterns + PII scrub
regex = "1"

# Platform hostname
gethostname = "1"

# v0.2.36: machine binding now reads platform-stable host identifiers
# (Windows MachineGuid registry / macOS IOPlatformUUID via ioreg / Linux
# /etc/machine-id). The MAC-based `mac_address` crate was removed from
# the launcher binary because it produced unstable hashes on laptops
# (Wi-Fi/Ethernet swaps changed the bound NIC). The Linux + macOS
# branches use std only; Windows uses `winreg` (declared in the
# cfg(windows) target deps block below). `hex` stays — same encoder
# applied to the new sha256 input.
hex = "0.4"

# Bug 31: launcher.toml config (volume location, etc.)
toml = "0.9"

# H5 (2026-05-08): cryptographically random hub auth tokens.
# We generate a fresh 32-byte token on every hub startup and persist it
# to `~/.vct/hub.token` (mode 0o600). The middleware in
# `hub/auth.rs` requires `Authorization: Bearer <token>` on every
# request that returns secrets — without this, any process running as
# the same OS user could curl `/projects/<id>/env` and exfiltrate the
# user's keychain values. `OsRng` here pulls bytes directly from the
# OS CSPRNG (getrandom on Linux, BCryptGenRandom on Windows,
# SecRandomCopyBytes on macOS); already in the dep tree transitively
# via several existing crates, so promoting to a direct dep adds zero
# binary size.
rand = { version = "0.9", default-features = false, features = ["std", "std_rng", "os_rng"] }

# Bug 31 tests: tempdir for filesystem fixtures (also used by Bug 31
# volumes module for non-test tempdir uses).
tempfile = "3"

# v0.2.46 V46-E (C2): base64 encoding for the per-pull `--authfile`
# auth.json shape (`{"auths": {"<registry>": {"auth": "<b64 user:token>"}}}`).
# Replaces the global-state `podman login` + `podman logout` flow so
# concurrent paid-module pulls can't invalidate each other's auth
# sessions. Transitively available via reqwest already; promoting to a
# direct dep adds zero binary size and stabilises the API surface we
# rely on (`engine::general_purpose::STANDARD`).
base64 = "0.22"

# PR-4 (2026-05-06): gitignore-aware filesystem walker. Used by
# `copy_recursive_sync` in commands/installer.rs to avoid propagating
# machine-local files (state/, .claude/agents/, tools/vct-secrets/,
# infrastructure/docker-compose.override.yml, etc.) when
# `update_orchestrator_at` copies one orchestrator install over
# another. Honors `.gitignore` + `.git/info/exclude` +
# `core.excludesFile` + `.ignore` files via `WalkBuilder::standard_filters(true)`.
# Drop-in for our previous blind directory walker.
ignore = "0.4"

# v0.2.24 A0 (2026-05-22): glob-pattern matcher for the user-editable
# path allowlist (`CLAUDE.md`, `knowledge/**/*.md`, etc.) used by
# `commands/git_user_editable_merge`. Same burntsushi family as the
# `ignore` crate (which transitively depends on globset), so no net
# new dependency tree — just promoting to a direct dep so the module
# can build `GlobSet`s explicitly. Cross-OS via `case_insensitive(true)`
# matching (needed for HFS+/APFS/NTFS where `CLAUDE.MD` vs `CLAUDE.md`
# can both appear on disk).
globset = "0.4"

# PR-42 (v0.2.12 / 2026-05-16): file watcher for `.claude/settings.json`.
# When the user edits env in settings.json, the watcher debounces a few
# hundred ms of "settling" events then fires SIGHUP to all running MCPs
# so they exit cleanly + respawn with fresh env. `notify` is the standard
# Rust cross-platform watcher crate (inotify on Linux, FSEvents on macOS,
# ReadDirectoryChangesW on Windows). Lightweight dep (~250 KB compiled),
# already widely used in the Rust ecosystem (cargo-watch, mdbook, tauri-
# plugin-fs-watch all depend on it). No alternative offers cross-OS
# coverage at this size.
notify = "8"

# System info (RAM, CPU). MIT-licensed, lightweight. Used by detect_system.
# v0.2.46: pinned to "0.38" — the entire sysinfo 0.39.x line requires rustc
# 1.95+, which breaks contributors / CI runners still on 1.94. API surface
# we use (System::new, refresh_memory, total_memory) is stable across 0.38
# and 0.39. Forward-compatible: when the project's rustc floor moves to
# 1.95, bump back to "0.39" or latest. Must match pin in
# vct-launcher-core/Cargo.toml.
sysinfo = { version = "0.38", default-features = false, features = ["system"] }

# v0.2.17 (hotfix): path canonicalization that avoids `\\?\` UNC
# prefixes on Windows. `std::fs::canonicalize` on Windows always
# returns the verbatim/UNC form (`\\?\C:\...`), which breaks
# downstream string comparisons (`.starts_with(install_path)` would
# fail because install_path is `C:\...`). `dunce::canonicalize` is
# the canonical Rust workaround — same behaviour as
# std::fs::canonicalize on POSIX, returns the conventional form on
# Windows. Already transitively in the lockfile via Tauri but
# promoting to a direct dep so the `update_orchestrator` pre-pull
# rename path resolves correctly on Windows.
dunce = "1"

# v0.2.62 (BLOCKER-1): tests for the watchdog pause-marker PRODUCER
# (services_stop_all / service_stop create markers; the start commands
# remove them) mutate the process-global VCT_STATE_DIR env var to redirect
# the marker root at a temp dir, so they must run #[serial] to avoid racing
# the parallel test pool. Same crate version vct-hub + vct-launcher-core use.
[dev-dependencies]
serial_test = "3"

# Bug 31: libc statvfs for free-space probe (Unix only — Windows path
# returns None, see free_bytes_at in commands/volumes.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# v0.2.26: WebKitGTK + EGL/GBM pre-flight probe. Used by
# `src/webkit_preflight.rs` to dlopen libEGL.so.1 / libgbm.so.1 at
# launcher startup and detect the NVIDIA-driver-mismatch crash signature
# (EGL_NOT_INITIALIZED) BEFORE WebKit aborts the process. When the
# probe fails, we set WEBKIT_DISABLE_DMABUF_RENDERER=1 so WebKit falls
# back to its older renderer instead of aborting. Linux-only; no
# functionality (and no dep) on macOS / Windows.
[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"

# v0.2.17 (hotfix): direct windows-sys dep for `pid_is_alive`'s
# Windows branch (OpenProcess + CloseHandle from
# Win32::System::Threading + Win32::Foundation). Already in the
# lockfile transitively (Tauri pulls it) but Cargo doesn't expose
# transitive deps to crates that don't declare them. Adding it
# directly with a `cfg(windows)` gate keeps Linux/macOS builds
# lean (no compilation cost).
#
# v0.2.36: `winreg` reads HKLM\SOFTWARE\Microsoft\Cryptography\MachineGuid
# in `machine_id_hash` for platform-stable machine binding.
# v0.2.49 Phase 3: `machine_id_hash` + per-OS host-id readers moved to
# `vct-launcher-core::licensing`. The `winreg` direct dep migrated with
# them (declared in `vct-launcher-core/Cargo.toml` under `cfg(windows)`).
# Dropped from the launcher binary's direct deps since no in-crate code
# references `winreg::` after the port — verified by grep over
# `launcher/src-tauri/src/` and `launcher/src-tauri/vct-hub/src/`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

# Release-profile privacy + size hardening (PR-4, 2026-05-06).
#
# Rust release builds carry the build host's ~/.cargo/registry/... and
# manifest-dir paths inside panic-message metadata + debug info. On a
# developer machine this leaks the username (e.g. /home/martino/...,
# C:\Users\marti\...) and any sensitive path components (OneDrive sync
# folder, etc.) directly into the shipped binary's `strings` output.
#
# `strip = "symbols"` removes debug symbols and most embedded path
# strings post-link. Combined with the rustflags `--remap-path-prefix`
# entries in `.cargo/config.toml`, ANY remaining path strings get
# rewritten to neutral `/builder/...` / `<cargo>/...` placeholders at
# compile time. The two together are belt-and-braces — strip alone
# isn't sufficient because some path strings are baked into rodata
# constants that strip won't touch.
#
# `lto = true` enables fat link-time optimization. This is a size +
# perf win on its own; as a side-effect it also helps the linker drop
# more unreachable code (and the path strings in that code).
#
# We deliberately do NOT set `panic = "abort"`. The launcher uses
# panic-unwinding semantics in some Tauri/axum paths and switching to
# abort is a behavior change unrelated to this PR's privacy scope.
# Revisit later if binary-size tuning calls for it.
[profile.release]
strip = "symbols"
lto = true

