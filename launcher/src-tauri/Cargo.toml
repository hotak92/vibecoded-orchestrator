[package]
name = "vct-launcher-temp"
version = "0.2.7"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vct_launcher_temp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
directories = "6"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"

# Hub API server
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }

# SQLite for async comms + config
rusqlite = { version = "0.39", features = ["bundled"] }

# OS keychain for secrets (macOS Keychain / Windows Credential Manager / Linux libsecret)
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# Safer subprocess spawning (tokenize strings to Vec<String>)
shlex = "1"

# Hashing for machine ID (sha256 of MAC matches Python validator.py)
sha2 = "0.11"

# Regex for manifest validation patterns + PII scrub
regex = "1"

# Platform hostname
gethostname = "1"

# MAC address for machine binding (matches commercial_workflow/license/validator.py)
mac_address = "1"
hex = "0.4"

# Bug 31: launcher.toml config (volume location, etc.)
toml = "0.9"

# H5 (2026-05-08): cryptographically random hub auth tokens.
# We generate a fresh 32-byte token on every hub startup and persist it
# to `~/.vct/hub.token` (mode 0o600). The middleware in
# `hub/auth.rs` requires `Authorization: Bearer <token>` on every
# request that returns secrets — without this, any process running as
# the same OS user could curl `/projects/<id>/env` and exfiltrate the
# user's keychain values. `OsRng` here pulls bytes directly from the
# OS CSPRNG (getrandom on Linux, BCryptGenRandom on Windows,
# SecRandomCopyBytes on macOS); already in the dep tree transitively
# via several existing crates, so promoting to a direct dep adds zero
# binary size.
rand = { version = "0.9", default-features = false, features = ["std", "std_rng", "os_rng"] }

# Bug 31 tests: tempdir for filesystem fixtures (also used by Bug 31
# volumes module for non-test tempdir uses).
tempfile = "3"

# PR-4 (2026-05-06): gitignore-aware filesystem walker. Used by
# `copy_recursive_sync` in commands/installer.rs to avoid propagating
# machine-local files (state/, .claude/agents/, tools/vct-secrets/,
# infrastructure/docker-compose.override.yml, etc.) when
# `update_orchestrator_at` copies one orchestrator install over
# another. Honors `.gitignore` + `.git/info/exclude` +
# `core.excludesFile` + `.ignore` files via `WalkBuilder::standard_filters(true)`.
# Drop-in for our previous blind directory walker.
ignore = "0.4"

# System info (RAM, CPU). MIT-licensed, lightweight. Used by detect_system.
sysinfo = { version = "0.38", default-features = false, features = ["system"] }

# Bug 31: libc statvfs for free-space probe (Unix only — Windows path
# returns None, see free_bytes_at in commands/volumes.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Release-profile privacy + size hardening (PR-4, 2026-05-06).
#
# Rust release builds carry the build host's ~/.cargo/registry/... and
# manifest-dir paths inside panic-message metadata + debug info. On a
# developer machine this leaks the username (e.g. /home/martino/...,
# C:\Users\marti\...) and any sensitive path components (OneDrive sync
# folder, etc.) directly into the shipped binary's `strings` output.
#
# `strip = "symbols"` removes debug symbols and most embedded path
# strings post-link. Combined with the rustflags `--remap-path-prefix`
# entries in `.cargo/config.toml`, ANY remaining path strings get
# rewritten to neutral `/builder/...` / `<cargo>/...` placeholders at
# compile time. The two together are belt-and-braces — strip alone
# isn't sufficient because some path strings are baked into rodata
# constants that strip won't touch.
#
# `lto = true` enables fat link-time optimization. This is a size +
# perf win on its own; as a side-effect it also helps the linker drop
# more unreachable code (and the path strings in that code).
#
# We deliberately do NOT set `panic = "abort"`. The launcher uses
# panic-unwinding semantics in some Tauri/axum paths and switching to
# abort is a behavior change unrelated to this PR's privacy scope.
# Revisit later if binary-size tuning calls for it.
[profile.release]
strip = "symbols"
lto = true

