[package]
name = "vct-launcher-core"
version = "0.2.54"
edition = "2021"
description = "Shared library for vct-launcher and vct-hub binaries — db, manifest, secrets, paths, config, services::runtime/picker, state, types, registry."
authors = ["VibeCoded Tools"]
license = "AGPL-3.0"

[lib]
name = "vct_launcher_core"
crate-type = ["rlib"]

# v0.2.33 (Agent F, C2): manifest-CI binaries. These live in `vct-launcher-core`
# (not the launcher binary's Cargo.toml) so they avoid `tauri-build`'s heavy
# build script — CI compiles them in seconds instead of minutes. Both
# binaries are pure consumers of `manifest.rs` types + the schemars derive.
[[bin]]
name = "validate-manifest"
path = "src/bin/validate_manifest.rs"

[[bin]]
name = "export-schema"
path = "src/bin/export_schema.rs"

# v0.2.21 Step 3d note: an earlier attempt used a `test-support` Cargo
# feature on this crate (enabled by launcher's [dev-dependencies]) to
# expose `Db::open_in_memory`, `secrets::test_serialize`, and
# `secrets::TestSpacingGuard` to the launcher's test code. That
# triggered a tauri-build panic ("missing cargo:dev instruction") in
# the launcher's build script — Cargo's feature unification with a
# workspace-path dependency declared in BOTH [dependencies] and
# [dev-dependencies] breaks tauri-build's environment-variable
# propagation. The simpler resolution: gate the test helpers on
# `cfg(any(test, debug_assertions))`. They're visible to all dev /
# test builds across both crates, excluded from `--release`. Same
# end state, no Cargo gotcha.

[dependencies]
# DB
rusqlite = { version = "0.39", features = ["bundled"] }

# OS keychain
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# Path resolution (HOME, app dirs)
directories = "6"

# Time + machine ID
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.11"

# Subprocess + tokenizer for runtime detection
shlex = "1"

# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# tokio for async paths in db (and runtime/picker async helpers)
tokio = { version = "1", features = ["fs", "macros", "process", "rt", "sync", "time", "io-util", "io-std"] }

# UUID for IDs
uuid = { version = "1", features = ["v4"] }

# HTTP client (used by services/picker.rs for container service-fullness probes
# and by future cross-binary hub HTTP calls)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Regex (used by manifest validation patterns + PII scrub)
regex = "1"

hex = "0.4"

# Platform hostname
gethostname = "1"

# launcher.toml config parsing
toml = "0.9"

# Path canonicalization (Windows UNC handling)
dunce = "1"

# System info (CPU/RAM) — used by detect_system, which lives in launcher today
# but its data types may move to core. Keep here as shared infrastructure.
# v0.2.46: pinned to "0.38" — the entire sysinfo 0.39.x line requires rustc
# 1.95+, which breaks contributors / CI runners still on 1.94. API we use
# is stable across 0.38/0.39. Must match pin in launcher/src-tauri/Cargo.toml.
# Forward-compatible: relax both when project's rustc floor moves to 1.95.
sysinfo = { version = "0.38", default-features = false, features = ["system"] }

# tempfile for tests + intentional use in core (volumes module path probes,
# and v0.2.47 per-pull authfile/dir guard in services::container_runtime)
tempfile = "3"

# v0.2.47: base64-encoded credentials in the per-pull auth.json blob built
# by services::container_runtime::build_per_pull_authfile. Used to be a
# direct dep of the launcher crate only; promoted here because the helper
# is now shared with vct-hub. Transitively in the dep tree via reqwest,
# so no net binary-size change.
base64 = "0.22"

# v0.2.33 (Agent F, C2): JSON Schema export for the manifest types. We
# derive `JsonSchema` on the 31 public types in `manifest.rs` and the
# `export-schema` bin emits a Draft 2020-12 schema document. Module
# publishers (e.g. RL chat) validate their `vct-module.json` against
# the same schema in their own CI before shipping a release.
# Version 0.8 is the family already transitively in the lockfile (via
# Tauri / its deps), so adding it as a direct dep is zero net build
# size — just promotes the resolved version to a first-class edge.
schemars = { version = "0.8", features = ["preserve_order"] }

# Bug 31: libc statvfs for free-space probe (Unix only)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows-specific (pid_is_alive uses OpenProcess + CloseHandle)
# v0.2.49: `winreg` reads HKLM\SOFTWARE\Microsoft\Cryptography\MachineGuid
# in `licensing::machine_id_hash` for platform-stable machine binding.
# Promoted from launcher/src-tauri/Cargo.toml because the helper now lives
# in core (shared between launcher GUI and vct-hub for the Phase 3
# supervisor auth port). Tiny dep (~15 KB compiled), already in the
# lockfile transitively via Tauri's Windows path.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }
winreg = "0.55"

# v0.2.42 W4-TEST-7: serial_test allows daemon_usable_probe_* tests to run
# serially (they spawn subprocess fakes and flake under parallelism).
[dev-dependencies]
serial_test = "3"
