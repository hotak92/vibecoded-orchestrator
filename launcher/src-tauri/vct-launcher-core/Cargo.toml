[package]
name = "vct-launcher-core"
version = "0.2.21"
edition = "2021"
description = "Shared library for vct-launcher and vct-hub binaries — db, manifest, secrets, paths, config, services::runtime/picker, state, types, registry."
authors = ["VibeCoded Tools"]
license = "AGPL-3.0"

[lib]
name = "vct_launcher_core"
crate-type = ["rlib"]

# v0.2.21 Step 3d note: an earlier attempt used a `test-support` Cargo
# feature on this crate (enabled by launcher's [dev-dependencies]) to
# expose `Db::open_in_memory`, `secrets::test_serialize`, and
# `secrets::TestSpacingGuard` to the launcher's test code. That
# triggered a tauri-build panic ("missing cargo:dev instruction") in
# the launcher's build script — Cargo's feature unification with a
# workspace-path dependency declared in BOTH [dependencies] and
# [dev-dependencies] breaks tauri-build's environment-variable
# propagation. The simpler resolution: gate the test helpers on
# `cfg(any(test, debug_assertions))`. They're visible to all dev /
# test builds across both crates, excluded from `--release`. Same
# end state, no Cargo gotcha.

[dependencies]
# DB
rusqlite = { version = "0.39", features = ["bundled"] }

# OS keychain
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# Path resolution (HOME, app dirs)
directories = "6"

# Time + machine ID
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.11"

# Subprocess + tokenizer for runtime detection
shlex = "1"

# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# tokio for async paths in db (and runtime/picker async helpers)
tokio = { version = "1", features = ["fs", "macros", "process", "rt", "sync", "time", "io-util", "io-std"] }

# UUID for IDs
uuid = { version = "1", features = ["v4"] }

# HTTP client (used by services/picker.rs for container service-fullness probes
# and by future cross-binary hub HTTP calls)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Regex (used by manifest validation patterns + PII scrub)
regex = "1"

# MAC address for machine binding (matches Python validator.py)
mac_address = "1"
hex = "0.4"

# Platform hostname
gethostname = "1"

# launcher.toml config parsing
toml = "0.9"

# Path canonicalization (Windows UNC handling)
dunce = "1"

# System info (CPU/RAM) — used by detect_system, which lives in launcher today
# but its data types may move to core. Keep here as shared infrastructure.
sysinfo = { version = "0.38", default-features = false, features = ["system"] }

# tempfile for tests + intentional use in core (volumes module path probes)
tempfile = "3"

# Bug 31: libc statvfs for free-space probe (Unix only)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows-specific (pid_is_alive uses OpenProcess + CloseHandle)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }
