[conditions.service_registry_unavailable]
class = "action_required"
owner = "install.py"
clear_probe = "owned-drop-when-absent"
emit_surfaces = ["ledger"]
notes = """v0.2.97: `vct-hub --ensure-db` failed or left launcher.db without the service_endpoints table (a missing or pre-047 hub binary). The run used its detected endpoints as in-memory pins for compose, settings and the MCP registration. Emitted by vco_lib.service_reconcile INSIDE the install.py run (into its report) and re-detected every run, so the first run with a current hub binary drops it."""

[conditions.service_endpoint_unreachable]
class = "action_required"
owner = "vco_lib.service_reconcile"
clear_probe = "probe:py:service_endpoint_still_unreachable"
emit_surfaces = ["ledger"]
dismiss_key = ["service", "endpoint"]
notes = """v0.2.97: a recorded endpoint does not answer after VCO ran its lifecycle (compose start / start-by-name), an adopted container is gone, or the legacy import kept a previously effective endpoint nothing answers on. VCO never switches to another instance on its own (plan I6). The probe re-checks every named service's row endpoint; all answering ⇒ resolved."""

[conditions.service_endpoint_ambiguous]
class = "action_required"
owner = "vco_lib.service_reconcile"
clear_probe = "probe:py:service_endpoint_still_ambiguous"
emit_surfaces = ["ledger"]
dismiss_key = ["service", "candidates"]
notes = """v0.2.97: more than one running instance holds VCO data; the ranking picked one (continuity, else the canonical port). Clears once the user confirms a row (`service_endpoints adopt`, confirmed_by_user=1) or at most one candidate still holds VCO data."""

[conditions.legacy_service_statement_unimported]
class = "action_required"
owner = "vco_lib.service_reconcile"
clear_probe = "owned-drop-when-absent"
emit_surfaces = ["ledger"]
dismiss_key = ["source", "value"]
notes = """v0.2.97: an older endpoint setting (app_state *.port_override, a non-default vct-config.toml weaviate_url, an exported VCT_*_URL, or an import run's services.toml / alt-port override value) names an endpoint that does not answer and did not win. Re-detected every install run for the settings that stay in place, so settling or removing them drops the entry."""

[conditions.container_runtime_record_reconciled]
class = "informational_record"
owner = "vco_lib.runtime_reconcile"
clear_probe = "owned-drop-when-absent"
emit_surfaces = ["ledger"]
notes = """v0.2.97 (R8 G1): install.py rewrote `state/install/runtime.txt` because VCO's own record named a runtime that is not installed (or holds none of VCO's containers/volumes while the other runtime holds them) — `runtime_reconcile.apply_at_install`, called from `_detect_system` INSIDE the install run, into that run's report. The next run finds the record matching the machine, does not re-detect it, and finalize drops it (one-shot record, family A). The auto-resolutions trail carries the same event."""

[conditions.container_runtime_unusable]
class = "action_required"
owner = "vco_lib.runtime_reconcile"
clear_probe = "probe:py:container_runtime_still_unusable"
emit_surfaces = ["ledger"]
dismiss_key = ["runtime", "via", "root"]
notes = """v0.2.97 (R8 G1/G6): the pinned runtime (VCT_CONTAINER_RUNTIME, or VCO's record after reconcile could not settle it) cannot be used — install.py tried the documented start, skipped containers and finished the rest of the run; or the boot wrapper `scripts/launch-claude-mcp-stack.{sh,ps1}` exited 3 (`python -m vco_lib.runtime_reconcile record-boot-refusal`). The probe re-runs `containers.resolve()` for the entry's install root as the probing process sees the pin; it clears once that resolves to a runtime with compose (install re-probe pass, doctor, bundle update)."""

[conditions.container_runtime_data_under_both]
class = "action_required"
owner = "vco_lib.runtime_reconcile"
clear_probe = "probe:py:container_runtime_data_still_under_both"
emit_surfaces = ["ledger"]
dismiss_key = ["recorded", "root"]
notes = """v0.2.97 (R8 G1 case c): podman AND docker both hold VCO containers/volumes; the recorded runtime was kept. R11 L2: also written when VCO's data is a bind-mounted host folder and the OTHER runtime holds VCO containers that are not running beside it (either runtime could serve the folder) — the recorded runtime is kept when it answers; when it is not installed nothing is started. Clears once the user confirms a runtime (`install.py --update --container <x>` writes `state/install/runtime.confirmed`) or VCO's data is no longer under both (the probe asks the same bind-layout rule the reconcile applies)."""

[conditions.adopted_service_config_drift]
