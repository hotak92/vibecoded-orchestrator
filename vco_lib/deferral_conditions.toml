# ── schema_migration_runner tagged errors (v0.2.97) ────────────────────────
# These ids travel as a trailing `[id]` tag inside an error detail and become
# condition ids in `build_deferral_entries` — which is why a `condition_id=`
# source scan never saw them. The runner now DECLARES them
# (`ERROR_CONDITION_IDS`), the decoder refuses an undeclared tag, and the
# completeness test imports that set. The runner re-evaluates every artifact
# on every pass, so the lifecycle is "not re-detected ⇒ over": install.py
# owns them for the root ledger (its finalize drops an id it did not re-emit),
# and `project_init._clear_runner_conditions_not_reemitted` is the paired
# clear a per-project `migrate-schema` pass runs on its own ledger.

