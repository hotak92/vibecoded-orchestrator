[conditions.kg_binding_evidence_repointed]
class = "informational_record"
owner = "vco_lib.kg_binding_heal"
clear_probe = "owned-drop-when-absent"
emit_surfaces = ["ledger"]
notes = """v0.2.92 D18 HEAL (the writing half of kg_binding_evidence_mismatch). \
A project's primary binding named an existing class while file-backed \
evidence showed its objects living in a DIFFERENT class no binding row \
named; the binding was re-pointed at the class holding the data. The \
eligibility input is `kg_binding_doctor`'s ownership verdict \
(`ProjectBindingVerdict.evidence`, with BOUND classes counted — a bound \
class that also holds the files is an AMBIGUITY the heal refuses, not a \
candidate) and NOTHING else — never the \
name-derived class, which is the guess R38 rejected precisely because it \
re-stamps the ghost when the NAME is what went wrong. Written only when one \
class clears the bar with NO RIVAL — alone, or leading the runner-up by the \
decisive margin (EVIDENCE_MARGIN_FACTOR 2.0x AND EVIDENCE_MARGIN_ABS +10 \
matched paths, both strict, ranked on the doctor's own numbers); a closer \
split writes nothing and raises `kg_binding_ambiguous_evidence`, and zero \
cleared classes leaves `kg_binding_evidence_mismatch` to carry the \
diagnosis. A \
`manual_override` row, a row changed since the scan, and a class another \
binding row names are each refused at write time under the same cursor. \
INFORMATIONAL because the action is already complete and nothing is pending \
— but it is never silent: a repoint changes which collection a project reads \
and writes, so the entry names the old class, the new class, the evidence \
that chose it, and the Identity-tab reversal (the previous value is also in \
the row's config_json under `evidence_repoint.from`). NO Weaviate data is \
moved or deleted; objects in the previously-named class stay put. \
Idempotent by construction: once re-pointed the class IS bound, so the one \
class that clears the bar is the already-bound one and the gate cannot \
fire again."""

[conditions.kg_binding_ambiguous_evidence]
class = "action_required"
owner = "vco_lib.kg_binding_heal"
clear_probe = "owned-drop-when-absent"
emit_surfaces = ["ledger"]
notes = """v0.2.92 D18 HEAL, the ASK half. Two or more Weaviate classes clear \
`kg_binding_doctor`'s ownership bar for one project and none leads by the \
decisive margin (kg_binding_heal.EVIDENCE_MARGIN_FACTOR = 2.0x AND \
EVIDENCE_MARGIN_ABS = +10 matched paths over the runner-up, both strict), so \
the heal writes nothing. Before v0.2.92 that refusal was SILENT — \
REFUSE_AMBIGUOUS was recorded in the install log and nowhere the user reads; \
this entry is that state surfaced, naming every candidate class with its \
matched/sampled path counts and object count, the currently-bound one, and \
how far short of the margin the leader fell. ACTION_REQUIRED, not \
environmental: the project's KG corpus is split across classes and it reads \
and writes only the one its binding names, so data is unreachable — and no \
mechanism VCO runs can choose for the user. CLEARED (owned-drop-when-absent, \
family A: emitted from INSIDE the install.py run whose finalize rebuilds the \
ledger, so it is re-detected every run) when the next `install.py --update` \
no longer refuses — the evidence stops being ambiguous because one class now \
dominates (a merge/re-sync), the leftover class is emptied or removed, or the \
primary binding row carries a `manual_override` sentinel, which \
`resolve_evidence_heal_plan` reads as "a human already chose" and which the \
write-time gate honours identically. Since v0.2.92 the launcher's picker \
writes that sentinel itself: a GUI save (`set_project_kg_binding`) that \
CHANGES — or first sets — the row's collection_name stamps \
`manual_override: true` into the row's config_json (merged, other keys \
preserved), so the remedy's step 1 is now self-recording and the ask clears \
on the next update run; a same-collection save (model/URL-only edit) writes \
NO sentinel, keeping the row machine-repairable, so the copy-paste SQL \
stanza remains the route for headless machines and for confirming the \
already-bound class. EMITTED from the read-only plan site \
(install.py's `_self_heal_kg_bindings_on_update`, right after \
`resolve_evidence_heal_plan`), NOT beside `kg_binding_evidence_repointed` in \
the RW heal pass: an ambiguous project owes no write, so the RW pass is never \
entered for it and an emit sited there would be inert in exactly the case it \
exists for. Adjacent to `kg_binding_evidence_mismatch` (the doctor's \
diagnosis of data outside a binding, dismissible) but distinct: this one says \
the automated repair LOOKED and declined, and shows the numbers behind the \
decline — including for the shape the doctor's entry cannot see, where every \
candidate is a bound class."""

[conditions.multi_candidate_prefix_adopt]
