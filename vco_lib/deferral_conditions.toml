itself" while nothing did, which is precisely the classification-mistaken-for- \
implementation state the registry exists to end. The handler runs the R-7 \
DRIVER (`vco_lib.codegraph_resync --run-resync`), never a bare analyzer walk: \
the driver re-probes the stale count and performs THIS cid's paired clear on a \
positive zero, so the dispatcher's ledger-re-read has something to observe. A \
bare walk performs no clear and would have been INCONCLUSIVE every attempt \
until the durable cap burned. v0.2.96 (WP-3, register issue 8): the entry has \
TWO flavours — service-down ("bring the service up") and stale-image ("rebuild \
the image FIRST"; emitting through a stale image silently truncates over-window \
input at HTTP 200). The verdict is enforced INSIDE the driver \
(``run_resync_and_verify``) so install, auto-retry and manual ``--run-resync`` \
all pass it, and the dispatcher BLOCKS a stale verdict BEFORE writing the \
STARTED row — a persistently stale image therefore burns NO retry budget and \
the retry resumes by itself once the image is rebuilt and current."""

