[conditions.launcher_binary_stale]
class = "action_required"
owner = "launcher/src-tauri/src/services/binary_freshness.rs"
clear_probe = "probe:py:launcher_binary_stale_still_applies"
emit_surfaces = ["ledger", "gui_banner"]
notes = """v0.2.91 WP-A. Rendered as the persistent (non-actionable) stale-binary \
banner: restart.rs::get_launcher_restart_status sets `binary_stale` + the two \
parsed versions from this section. The emit is latched once per launcher process \
(STALE_CONDITION_EMITTED), so the clear MUST be probe-driven — an \
emit-refresh clear could never fire. The canonical probe is the Rust \
freshness probe at boot (it alone sees the RUNNING process version); the \
Python probe here is the complementary leg that runs on every `--update`, \
uses TRACKED-ONLY dist dirtiness (matching the v0.2.91 MAJOR-1 `-uno` fix), \
and clears only on positive evidence that no launcher is holding a stale \
image. A wrongly-cleared entry is re-emitted at the next launcher boot while \
the condition holds, which is what makes the Python leg safe."""

