# ═══════════════════════════════════════════════════════════════════════════
# Project move (v0.2.92 W3 / WP-17) — owner `vco_lib.project_move`
# ═══════════════════════════════════════════════════════════════════════════
#
# A move performs ZERO deletions and ZERO overwrites at the destination, so
# every conflict it meets becomes a ledger entry rather than a merge. The
# project's own Claude picks them up at session start — which is the whole
# point of delegating the merge instead of guessing it.
#
# NONE of these rows is `owned-drop-when-absent`: install.py does not emit
# them and must not own them. An install run that did not re-detect an
# install-owned cid DROPS it, which for a move record would silently delete
# the only surviving pointer to a conflict nobody has merged yet.

[conditions."project_move_conflict_*"]
match = "glob"
class = "action_required"
owner = "vco_lib.project_move"
clear_probe = "manual-dismiss"
emit_surfaces = ["ledger", "gui_modal"]
notes = """One entry PER FILE that existed at the destination with different \
content. The destination's file was left byte-identical and the previous \
folder's version landed beside it as `<name>.vco-moved`; the entry names both \
plus the origin path under the old folder. `manual-dismiss` is the honest \
mechanism: no probe can know whether a human merged two versions of a file, \
and a probe that guessed would delete the reminder while the merge was still \
owed. The prefix family follows the `stale_unit_retired_` precedent."""

[conditions.project_move_stale_path_reference]
class = "action_required"
owner = "vco_lib.project_move"
clear_probe = "paired-resolution"
emit_surfaces = ["ledger"]
notes = """A managed surface at the new folder (`.claude/env`, \
`.claude/settings.json`, `.env`, a legacy `.vscode` block, or the deferral \
ledger itself) still contains the OLD folder path after the move's rewrite \
passes. The file is NOT edited: VCO rewrites managed values by re-deriving \
them from the database, so a surface it could not re-derive is a signal that \
a rewrite pass missed an entry class — sed-ing it would hide exactly that. \
PAIRED SITE: `vco_lib.project_move.verify_move`, re-runnable at any time via \
`vco project move --verify --folder <path>`; it re-scans the same surfaces \
and calls `resolve_conditions` when no occurrence remains. The design named a \
`probe:py:project_move_stale_paths` probe for this; the probe callable exists \
as `vco_lib.project_move.scan_files_for_path` but its one-line registration \
in `deferral_probes.PROBES` is owed (see the WP-17 report), so the row \
declares the mechanism that IS wired rather than one that is not."""

[conditions.project_move_stale_db_path]
class = "action_required"
owner = "vco_lib.project_move"
clear_probe = "manual-dismiss"
emit_surfaces = ["ledger"]
notes = """The read-only launcher.db sweep found the OLD folder path in a \
column whose policy says it should not be there. Two meanings, both needing a \
human: a column with a fixer still carrying the path means the fixer did not \
reach those rows; a column classified `not-path-bearing` in \
`vco_lib/path_bearing_keys.py` carrying it means the REGISTRY is wrong. \
`manual-dismiss` because there is nothing to re-run — the fix is a code \
change plus a re-classified column, and the schema-coverage test makes the \
same omission fail CI from then on. Columns classified `historical` \
(log tails, telemetry payloads, audit details) are expected to carry the old \
path and are never reported here."""

[conditions."project_move_extra_codegraph_path_*"]
match = "glob"
class = "action_required"
owner = "vco_lib.project_move"
clear_probe = "manual-dismiss"
emit_surfaces = ["ledger"]
notes = """The project's code graph also indexes a USER-DESIGNATED extra path \
that lies inside the old folder. The row is left byte-identical: the user may \
well intend the old checkout (a public-repo clone walked under a private \
project's collection is the shipped use case for that table). Only the user \
knows, so only the user re-points it."""

[conditions.project_move_codegraph_reanalyze_pending]
class = "auto_retryable"
owner = "vco_lib.project_move"
clear_probe = "paired-resolution"
emit_surfaces = ["ledger"]
notes = """Emitted as `auto_retryable` ONLY when the committing writer \
actually inserted the `code_graph_builds` pending row inside the flip \
transaction. When the enqueue fails, the SAME cid is emitted with \
disposition `action_required` and the manual analyze command instead — a \
row that says "VCO retries this itself" with nothing scheduled behind it is \
the exact defect `codegraph_embed_resync_pending` documented. \
NO `retry_action` ON PURPOSE: the scheduled work is the launcher's own build \
runner consuming the pending row, and a WP-H retry handler would be a SECOND \
scheduler racing it into a double walk. PAIRED SITE: \
`vco_lib.project_move.verify_move` clears the entry once no pending or \
running build row remains for the project."""

[conditions.project_move_old_folder_retained]
class = "informational_record"
owner = "vco_lib.project_move"
clear_probe = "paired-resolution"
emit_surfaces = ["ledger"]
notes = """The move deleted NOTHING. The previous folder is intact, including \
everything VCO deliberately did not copy (the project's own source, `.git`, \
venvs, `.env`, run logs). Designing a VCO-initiated recursive delete needs \
its own destructive-gate review, so no command here removes anything. PAIRED \
SITE: `vco_lib.project_move.verify_move` clears this record once the old \
folder is gone from disk — the user's own cleanup is what ends it, and until \
then the record is the only place the old path is written down."""

[conditions.project_move_harness_state_review]
class = "action_required"
owner = "vco_lib.project_move"
clear_probe = "manual-dismiss"
emit_surfaces = ["ledger"]
notes = """Claude Code keys per-project memory, permissions and transcripts \
by ABSOLUTE path, and none of it follows a move: sessions at the new folder \
start with empty memory while the old-path state lingers orphaned. \
`~/.claude/` is harness-owned — VCO writes nothing there (W7) and never \
touches `~/.claude.json` (house rule 4) — so the entry SURFACES the copy \
command rather than running it, and the command is `cp`, never `mv`. Emitted \
ONLY when the old slug directory actually exists; a project that never \
hosted a session gets no entry at all."""

# ── v0.2.92 WP-18 / W14: `vco project rename-collections` ──────────────────
#
# NONE of these is `owned-drop-when-absent`. install.py does not emit them and
# must not own them: an install run that did not re-detect an install-owned cid
# DROPS it, and for a rename record that would delete the only surviving
# pointer to a retired collection family while the classes are still on disk.
# Same reasoning W3 recorded for the move family directly above.

[conditions.collections_renamed_old_retained]
class = "informational_record"
owner = "vco_lib.collection_rename"
clear_probe = "paired-resolution"
emit_surfaces = ["ledger"]
notes = """The rename copied every object to the new class family and dropped \
NOTHING. The previous classes are intact and still hold their data, so this \
entry is a RECORD of a completed action, not owed work — which is why it is \
`informational_record` and `info` severity. It is also the only place the \
retired class names are written down in prose, which is why it must not \
auto-expire while they exist. `command_to_apply` is the ONE guarded drop: \
`vco project rename-collections --drop-retired --confirm --folder <path>` \
re-derives the live schema, the current bindings and the current object \
counts AT RUN TIME and refuses per class if the old class is still bound \
anywhere, if its replacement is missing, or if the replacement no longer \
holds at least as many objects — never the unguarded codegraph drop that \
BUG-M2 was. PAIRED SITE: `vco_lib.collection_rename.drop_retired` resolves \
this cid once every retired class is gone from the live schema; the user's \
own decision is what ends it, and until then the record is the pointer."""

[conditions.collection_rename_reconcile_pending]
class = "action_required"
owner = "vco_lib.collection_rename"
clear_probe = "paired-resolution"
emit_surfaces = ["ledger"]
notes = """The flip COMMITTED — the collections were copied and verified and \
the project's bindings name them — but a post-flip step did not finish (env \
re-projection, the code-graph prefix generation record, or the identity \
re-mint). The project works; what is stale is a surface that re-derives from \
the database, so re-running is safe and idempotent. `action_required` rather \
than `auto_retryable` because nothing is scheduled behind it: a row claiming \
"VCO retries this itself" with no runner is the defect \
`codegraph_embed_resync_pending` documented. PAIRED SITE: \
`vco project rename-collections --resume --folder <path>` re-runs exactly the \
steps that did not complete and clears this entry."""

[conditions.collection_rename_identity_remint_incomplete]
class = "action_required"
owner = "vco_lib.collection_rename"
clear_probe = "manual-dismiss"
emit_surfaces = ["ledger"]
notes = """Code-graph rows carry a `project` property that is mixed into the \
analyzer's deterministic UUID seed, so a prefix change requires re-keying \
them (`vco_lib.codegraph_vector_copy.migrate_project_identity`, which REUSES \
each stored vector verbatim — never a re-embed). Rows whose identity key \
cannot be reconstructed from their stored properties are LEFT in place and \
counted, never guessed at and never deleted. `manual-dismiss` is the honest \
mechanism: the remedy is a full code-graph analysis, which is the user's \
decision because it costs compute, and a probe that cleared the entry when \
the count happened to reach zero could not distinguish "analyzed" from \
"someone deleted the rows"."""
