[conditions.kg_unclaimed_populated_classes]
class = "action_required"
owner = "vco_lib.doctor"
clear_probe = "probe:py:kg_unclaimed_classes_still_present"
emit_surfaces = ["ledger"]
dismiss_key = ["classes"]
notes = """v0.2.92 (reported-not-fixed item 3): a populated *_KnowledgeGraph \
class that NO registered project's binding row names (any role) AND whose \
sampled file_paths anchor to no registered project's folder — data with no \
reader, e.g. a removed project's leftover class. Adjacent to but distinct \
from kg_binding_evidence_mismatch (a REGISTERED project's data outside its \
binding) and from the hardcoded legacy-name detectors. Detection extends the \
SAME kg_binding_doctor scan (no new IO); the canonical shared class named by \
app_state orchestrator_root_kg_collection is exempt (its lifecycle belongs \
to the shared-KG surfaces). Diagnosis only: the entry NEVER prints a drop \
command — re-adding the project, re-binding via the Identity tab, or \
migrate-collections are the named remedies, and dismissal records 'expected \
leftover'."""

[conditions.kg_binding_evidence_mismatch]
class = "action_required"
owner = "vco_lib.doctor"
clear_probe = "probe:py:kg_binding_evidence_still_mismatched"
emit_surfaces = ["ledger"]
dismiss_key = ["projects", "evidence_classes"]
notes = """v0.2.92 D18 re-closure (Fable round 6, MAJOR-R6-1). The \
existing-ghost case: a registered project's KG objects demonstrably live in \
a class its primary binding does not name. The update-time prefix-adopt pass \
(`kg_binding_heal`) rebinds only a binding whose class is ABSENT from \
Weaviate, so a ghost that has already received the project's writes exists \
and is skipped by construction — nothing named that state until this probe. \
DETECTION: `vco_lib.kg_binding_doctor.scan_kg_binding_evidence` compares, per \
registered project with a real primary binding row, (1) the binding, (2) \
file-backed evidence of where the data lives (a populated *_KnowledgeGraph \
class whose sampled file_paths exist under the project folder, at >= 80% of \
distinct sampled paths and >= 2 matches), (3) the name-derived expected \
class. EMITTED by the doctor's `kg_binding_evidence` probe (full scope: \
install/update end-of-run + `vco doctor`); one aggregated entry names every \
mismatching project's three values. CLEARED by the same reading — the \
registry probe re-runs the identical scan, and the doctor self-resolves the \
cid on a clean no-sink pass. CLASS: action_required, NOT environmental — the \
reviewer's round-5 sketch said environmental, but the registry's own \
environmental definition is 'nothing is broken'; here the project's KG \
writes land outside its binding (data-bearing) and the remedy is a human \
action (pick the right class in the launcher's Identity tab), which is \
action_required's definition verbatim. The doctor never writes a binding \
(R38: the previous automatic 'fix' would have re-stamped the ghost); the \
SEPARATE v0.2.92 heal (kg_binding_evidence_repointed, owner \
vco_lib.kg_binding_heal) acts only on the UNAMBIGUOUS subset, so what \
survives to THIS entry is what it refused — a split with no decisive leader \
(itself surfaced as kg_binding_ambiguous_evidence), a manual_override row, \
or a target another binding row names. \
dismiss_key: (projects, evidence_classes) — a dismissal holds while the same \
projects stay mismatched against the same classes and re-fires when either \
set changes."""

