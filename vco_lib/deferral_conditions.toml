# ═══════════════════════════════════════════════════════════════════════════
# deferral_conditions.toml — the DEFERRAL LIFECYCLE CONTRACT (v0.2.91 WP-B)
# ═══════════════════════════════════════════════════════════════════════════
#
# ONE registry declaring, for EVERY deferral condition_id VCO can emit:
#
#   * `class`          — the disposition tier (what the reader owes it)
#   * `owner`          — the module that emits it
#   * `clear_probe`    — HOW it stops being listed (the lifecycle mechanism)
#   * `emit_surfaces`  — where it renders besides the ledger
#   * `dismiss_key`    — the stable fields forming its dismissal identity
#
# WHY this file exists
# --------------------
# Before v0.2.91 each condition's lifecycle lived only in scattered comments.
# Three consequences, all field-observed:
#   1. Conditions shipped with a DOCUMENTED self-clear protocol that was never
#      implemented on either side (v0.2.54 Track D found two;
#      `kg_sync_no_embedding_backend` and `orchestrator_user_modified_preserved`
#      were two more, still immortal at v0.2.90).
#   2. Severity was conflated with disposition: an "already done, no action
#      needed" record rendered identically to a blocking migration, so the
#      Claude-pickup channel silted up with stale FYIs and real signals drowned.
#   3. Nothing could enumerate the conditions, so no test could notice a NEW
#      cid shipping without a lifecycle.
#
# The registry makes all three a TEST FAILURE instead of a docstring lie:
#   * `tests/test_deferral_registry_completeness_v0291.py` source-scans every
#     emit site across Python + Rust and hard-fails on any cid absent here.
#   * The same test validates the schema and asserts every `probe:py:<name>`
#     resolves to a real callable in `vco_lib.deferral_probes.PROBES`.
#
# CLASSES (the `class` key) — the disposition tier
# -----------------------------------------------
#   action_required     A human (or their Claude) must DO something. The
#                       default for anything not positively known to be
#                       otherwise — misclassifying downward hides work.
#   auto_retryable      A transient failure VCO can retry on its own once the
#                       precondition returns (backend up, daemon started).
#                       The retry machinery itself is v0.2.91 WP-H; the class
#                       is what marks a cid as ITS tenant.
#   environmental       A true, live description of the user's machine that
#                       persists while the machine looks that way. Nothing is
#                       broken; VCO cannot and should not "fix" it.
#   informational_record  A record of an action ALREADY COMPLETED, or a
#                       by-design skip. Nothing is pending. These must not
#                       require a manual action to disappear.
#
# CLEAR PROBES (the `clear_probe` key) — the lifecycle mechanism
# -------------------------------------------------------------
#   owned-drop-when-absent  install.py OWNS the cid: it re-detects it on every
#                       run, and `InstallDeferralFlow.finalize()` rebuilds the
#                       ledger from the run report, so an owned cid NOT
#                       re-detected this run simply disappears. For a cid
#                       install.py never emits (a Rust-emitted record), the
#                       same ownership yields ONE-SHOT AUTO-EXPIRY on the next
#                       update — the `stale_unit_retired_` precedent.
#                       ⚠ Only safe when the emitter does NOT run inside an
#                       install.py run: a same-run emit would be dropped by
#                       that run's own finalize.
#   bundle-reconciled   `vco_lib.project_init._reconcile_bundle_deferrals`
#                       recomputes the condition on every bundle update and
#                       clears it when it no longer applies.
#   paired-resolution   A specific success path or re-probe calls
#                       `resolve_conditions` / `mark_resolved` for this exact
#                       cid. `notes` names the site.
#   probe:py:<name>     A named read-only probe in `vco_lib.deferral_probes`.
#                       Run by install.py's re-probe pass on EVERY `--update`
#                       (v0.2.91 promoted it out of `--apply-deferred`) and by
#                       the bundle-update reconcile.
#   probe:rs:<name>     A named probe owned by the launcher (Rust), which sees
#                       state Python cannot (e.g. the RUNNING process's
#                       version). `notes` names the site.
#   manual-dismiss      No automatic clear exists. The generic
#                       `python -m vco_lib.project_init dismiss-deferral` is
#                       the only exit. This value is an HONEST admission, not
#                       an aspiration — never write a probe name here that
#                       does not exist.
#
# RETRY ACTIONS (the `retry_action` key) — v0.2.91 WP-H
# -----------------------------------------------------
#   retry:py:<handler>  The condition names OWED WORK VCO can re-attempt on
#                       its own once the precondition returns (backend up).
#                       `<handler>` must exist in
#                       `vco_lib.deferral_retry.HANDLERS`; the dispatcher runs
#                       it from the doctor pass and from the session-start
#                       owed-work check, gated on POSITIVE precondition
#                       evidence and capped at 3 attempts per folder.
#                       ONLY `class = "auto_retryable"` rows may declare one —
#                       the class IS the consent record (the loader rejects
#                       the combination otherwise). A retry re-runs work the
#                       user already asked for by installing; it never repairs
#                       their machine and never touches a running binary
#                       (decision #4).
#                       Python-side only: the Rust mirror tolerates and
#                       ignores this key (as it does `notes`), because a Rust
#                       field would mean a second retry engine.
#
# DISMISS KEYS (the `dismiss_key` key) — generalized dismissal memory
# ------------------------------------------------------------------
# An ordered list of stable detected-state field NAMES. `vco_lib.deferral_dismissal`
# computes ONE key = `cid + normalized(values of those fields)`; a dismissal
# holds until the KEY changes. Cosmetic rewording of the entry's prose can
# therefore never re-fire a dismissal — the failure mode that made a raw
# hash-of-`detected` unacceptable (v0.2.91 decision #17). A cid with NO
# declared key gets `manual` semantics: the dismissal holds until the cid is
# cleared by its clear_probe or dismissed again.
#
# MATCHING (the `match` key)
# --------------------------
#   exact (default)  the table key IS the condition_id.
#   glob             the table key is an fnmatch pattern with `*` wildcards
#                    (dynamically-suffixed families). Lookup order: exact
#                    first, then globs by DESCENDING literal length, so
#                    `stale_unit_retired_*_backup_failed` wins over
#                    `stale_unit_retired_*`.
#
# CROSS-LANGUAGE
# --------------
# Rust reads a compile-time mirror
# (`launcher/src-tauri/vct-launcher-core/src/deferral_registry.rs`,
# `include_str!` of THIS file) drift-locked by
# `launcher/src-tauri/tests/deferral_registry_parity.rs` +
# `tests/test_deferral_registry_parity_v0291.py` — the same tier-(B)
# shared-config discipline as `mcp_scan_rules.toml`. The include path must
# follow any future move of this file in lockstep.
#
# ADDING A CONDITION
# ------------------
# Emit sites and this table land in the SAME commit. The completeness test is
# a hard gate — there is no warn-only grace period (zero-deferral rule).

format_version = 1

