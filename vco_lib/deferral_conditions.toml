clear_probe = "probe:py:gateway_exec_still_unrunnable"
emit_surfaces = ["ledger"]
notes = """v0.2.95 R5c. A THIRD state, between "not registered" and "running": \
the model gateway's login-time registration exists and is enabled, and the \
entry point baked into it cannot run. Measured on 2026-09-10 — \
`install.py --update` re-rendered the unit with whichever interpreter ran the \
installer (a system python that cannot import `model_router`), so the unit was \
unrunnable from the moment it was written, and it stayed invisible for eight \
hours because the PREVIOUS process was still serving. The launcher toggle said \
"registered" throughout. Two emitters, one lifecycle: the SessionStart ensure \
(`vco_lib.gateway_ensure`) writes it into the project whose session started, \
and `vco_lib.doctor`'s `model_gateway_runnable` probe writes it into the \
install root during an install/update run. Both read the same function, and \
the clear probe re-runs that same reading, so the entry clears itself the \
moment the registration can run (or the gateway is running, or the user \
unregistered it). action_required because the exit is an install/update run: \
that is what re-renders the registration, now verifying the argv before it \
writes. No dismiss_key: an unrunnable registration is a real break, not a \
description of the machine to acknowledge."""

[conditions.former_launcher_cli_on_path]
class = "action_required"
owner = "vco_lib.doctor"
clear_probe = "probe:py:former_launcher_cli_still_on_path"
emit_surfaces = ["ledger"]
notes = """v0.2.97. The launcher's Rust CLI was `vco` until v0.2.96 — the name \
of the orchestrator's Python console script — and `vct` before v0.1.0 (now the \
secrets tool); it is `vct-cli` since v0.2.97. A copy left on PATH under an old \
name hides, or is hidden by, the real program of that name, so "run \
`vco doctor`" answers "unrecognized subcommand". The doctor's \
`former_launcher_cli` probe (install root, full scope) identifies each `vco` / \
`vct` on PATH by what it prints — `--version` = "<name> <digit>" AND `-h` \
carries the CLI's tagline — through `vco_lib.launcher_cli_identity`, the same \
rule `launcher/tools/vct-cli/install.sh` uses to remove the copy it installed. \
The doctor never deletes a binary. The clear probe re-runs the reading: first \
on the paths the entry names (so a PATH that differs from the user's shell \
cannot clear it), then on the current PATH. action_required: removing the copy \
is the user's act. No dismiss_key — keeping it is a dismissal with manual \
semantics."""

[conditions.code_embed_image_stale]
class = "action_required"
owner = "vco_lib.doctor"
clear_probe = "probe:py:code_embed_image_still_stale"
emit_surfaces = ["ledger"]
notes = """v0.2.92 BLOCKER-1. `code_embed` is the ONLY VCO service that ships \
as a container image BUILT from the checkout \
(infrastructure/docker-compose.yml::code_embed.build), and both `docker \
compose up` and `podman-compose up` build an image only when it is MISSING — \
a changed build context is not a rebuild trigger, and `--force-recreate` \
replaces the CONTAINER from the SAME image. So a source fix could be correct \
in server.py, pinned by its own tests, green in CI, and running NOWHERE. It \
was: measured on the maintainer's machine, image built 2026-05-16, container \
recreated 2026-07-12, and the live service still answering HTTP 200 with a \
silently truncated leading window for over-window code — while v0.2.92's \
source refuses it at HTTP 400 so the caller can shrink and retry. \
action_required because the exit is an install/update run: `_start_services` \
now adds `--build` (and names code_embed for `--force-recreate`) whenever the \
image is not PROVABLY current, and the doctor re-probes at the end of the \
same run — so the entry is dropped by the run that fixes it. The evidence is \
the service's own: it hashes the source files it loaded and publishes the \
digest as /health.source_sha (vco_lib.code_embed_image + the image_source.py \
that is COPYed into the image), so "we hope it rebuilt" became checkable. A \
/health WITHOUT the field identifies a pre-v0.2.92 image. The clear probe \
re-runs that same comparison, so a user who rebuilds by hand and re-runs \
`vco doctor` sees the entry go. ORDER MATTERS in the remedy: rebuild the \
image BEFORE any code-graph re-sync — re-walking the graph first embeds every \
entity through the old, truncating service and then reports success."""

[conditions.install_manifest_attests_uninstalled_source]
class = "action_required"
owner = "vco_lib.doctor"
clear_probe = "owned-drop-when-absent"
emit_surfaces = ["ledger"]
notes = """v0.2.95 WP-2 — the detector the half-executed install states lacked. \
`state/install-manifest.json` has TWO writers: install.py, and \
`manifest.rs::refresh_install_manifest`, which the launcher's \
`apply_launcher_update`, `force_resync_launcher` and `update_orchestrator_at` \
each call. Those three advance the whole source tree, rebuild only the \
launcher binary, and never run install.py — and then re-assert \
`installed: true` over it. So venv, pip, hooks, templates, MCP registrations, \
the KG seed, the schema and the boot service stay where the last installer \
run left them while the marker says the install is complete, and every other \
surface reports health: the checkout is 0-behind upstream, so \
`source_currency` is `ok` and `_currency_finding` drops the install age it \
appends only to a PROBLEM, while `probe_last_update_run` reports the stale \
date as `ok` by design (age has two causes and cannot separate them). Before \
this row no doctor probe read install-manifest.json at all. THREE legs, and \
which one can speak depends on WHICH launcher wrote the marker. Until v0.2.95 \
that writer re-read `version` from the files it had just pulled, so the \
version leg catches every install arriving from a pre-0.2.95 launcher. WP-1 \
stopped it writing `version` and `completed_at` (install.py is their only \
writer now) and made it stamp `post_source_only: true` instead — so for a \
0.2.95+ launcher the versions agree by construction and only the commit leg \
can speak, and that one is silent whenever `.git/HEAD` did not move \
(`update_orchestrator_at` file-copies a tree and leaves the target's HEAD \
alone) or could not be read (packed ref / worktree HEAD → `read_git_rev` \
returns None and the old `source_commit` stands). The FLAG leg is the writer \
naming the state itself, and the only one that survives both. None of the \
three is a proxy: `.claude/.vco-manifest.json` is written ONLY by the bundle \
engine an installer run reaches, is gitignored (so `update_orchestrator_at`'s \
gitignore-aware copy does not carry the source clone's copy into the target), \
and no launcher update path writes it; `post_source_only` is written only by \
a path that advanced the tree without installing, and cleared only by an \
installer run (install.py rebuilds the manifest from a literal dict, so the \
key does not survive). Conservative everywhere else: a missing or unparseable \
manifest, a pre-v0.2.92 bundle manifest whose `vco_version` holds a git SHA, \
a packed ref that left `source_commit` empty, or an ABSENT `post_source_only` \
(every manifest written before v0.2.95, and every manifest install.py writes) \
all yield `unknown` or `ok`, never `problem` — a false problem here would \
send the owner of a healthy install into an update they do not need. \
owned-drop-when-absent on the `vco_lib_shadowed_by_venv_copy` precedent: \
`python install.py --update` (the printed remedy, and a real flag on \
install.py's argparse) rewrites BOTH records from the one tree at the end of \
a run that has already re-done the skipped work, and the doctor phase \
re-probes AFTER both writes in that same run — so the entry is dropped by \
the run that fixes it. No dismiss_key: a marker attesting work nothing did \
is a real break, not a description of the machine to acknowledge."""

[conditions.vco_lib_shadowed_by_venv_copy]
class = "action_required"
owner = "vco_lib.doctor"
clear_probe = "owned-drop-when-absent"
emit_surfaces = ["ledger"]
notes = """v0.2.92. `import vco_lib` from a NEUTRAL cwd does not reach <install_root>/vco_lib — it reaches a copy in the venv's site-packages, or a third location entirely. Cause of the shipped case: the codegraph-ts step ran `pip install <root>[codegraph-ts]` without `-e`, which made pip uninstall step 4's EDITABLE install of the same distribution and replace it with a real copy of vco_lib/. Nothing errored; every hook, MCP and `python -m vco_lib.X` fired outside a repo root then ran a snapshot frozen at install time, and because later updates change the checkout and not the copy, the user's fixes silently never took effect. action_required because the exit is an install/update run: step 4's `pip install -e .` removes the pip-OWNED copy, and install_companions.repair_shadowed_vco_lib sweeps the UNOWNED residue (a copy whose dist-info was lost, which pip cannot see and therefore never removes). Owned/drop-when-absent on the npx_missing_mcp_unspawnable precedent: the doctor re-probes at the end of every install/update, AFTER that repair, so the entry is dropped by the same run that fixes it. It persists only for the arm VCO must not touch — an editable install owned by a DIFFERENT checkout — where deleting anything would break that other install. No dismiss_key: a shadowed vco_lib is a real break, not a machine description to acknowledge."""

