notes = """v0.2.96 WP-7 (register issues 13 + 14). The summary backend ladder's \
preferred tier opened its circuit breaker on a QUOTA (token/budget \
exhaustion — 5 h cooldown, `VCO_SUMMARY_BREAKER_QUOTA_COOLDOWN`) or TRUST \
(headless `claude -p` refused: workspace not trusted — terminal for the \
tier) failure. Until the tier returns, summaries generate on a FALLBACK \
tier or not at all, and because the sidecars record the backend that \
actually answered, the degraded rows are exactly the ones a sidecar names \
a non-preferred backend for with a CURRENT content hash (hash-frozen: \
ordinary runs correctly skip them) plus nodes with no summary at all. \
The pending set is derived by SCANNING the sidecars \
(`vco_lib.summary_health.scan_pending`) — no second ledger to maintain. \
New and changed nodes resume on the preferred tier when the cooldown \
expires; the frozen rows regenerate only via the recheck command, which \
clears the breaker and regenerates exactly the pending set (also the \
launcher's "Recheck summary backend now" action). ONE entry per event, \
not per attempt: the breaker trip seam spawns `python -m vco_lib.\
summary_health note-degradation` detached (best-effort, stdlib \
constraint — `templates/scripts/summary_backends.py` cannot import \
vco_lib from user projects), and the ledger's per-cid last-write-wins \
makes a re-notify a REPLACE. action_required, NOT auto_retryable, on the \
`kg_sync_drift_detected` precedent: no dispatcher handler is wired for \
this cid (deferral_retry.py is outside this work package's file set) and \
the 5 h clock only restores the TIER — the frozen rows need the command, \
and the trust flavour needs a human to re-accept the workspace dialog. \
Paired site: `vco_lib.summary_health.summary_recheck` resolves this cid \
when a post-backfill scan finds ZERO pending rows — after a converged \
recheck, or when ordinary runs have already regenerated everything."""

