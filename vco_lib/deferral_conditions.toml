notes = """v0.2.92 BLOCKER-1. `code_embed` is the ONLY VCO service that ships \
as a container image BUILT from the checkout \
(infrastructure/docker-compose.yml::code_embed.build), and both `docker \
compose up` and `podman-compose up` build an image only when it is MISSING — \
a changed build context is not a rebuild trigger, and `--force-recreate` \
replaces the CONTAINER from the SAME image. So a source fix could be correct \
in server.py, pinned by its own tests, green in CI, and running NOWHERE. It \
was: measured on the maintainer's machine, image built 2026-05-16, container \
recreated 2026-07-12, and the live service still answering HTTP 200 with a \
silently truncated leading window for over-window code — while v0.2.92's \
source refuses it at HTTP 400 so the caller can shrink and retry. \
action_required because the exit is an install/update run: `_start_services` \
now adds `--build` (and names code_embed for `--force-recreate`) whenever the \
image is not PROVABLY current, and the doctor re-probes at the end of the \
same run — so the entry is dropped by the run that fixes it. The evidence is \
the service's own: it hashes the source files it loaded and publishes the \
digest as /health.source_sha (vco_lib.code_embed_image + the image_source.py \
that is COPYed into the image), so "we hope it rebuilt" became checkable. A \
/health WITHOUT the field identifies a pre-v0.2.92 image. The clear probe \
re-runs that same comparison, so a user who rebuilds by hand and re-runs \
`vco doctor` sees the entry go. ORDER MATTERS in the remedy: rebuild the \
image BEFORE any code-graph re-sync — re-walking the graph first embeds every \
entity through the old, truncating service and then reports success."""

[conditions.vco_lib_shadowed_by_venv_copy]
