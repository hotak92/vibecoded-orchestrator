[conditions."settings_write_refused_*"]
match = "glob"
class = "action_required"
owner = "vco_lib.settings_refusal"
clear_probe = "probe:py:settings_write_refusal_still_applies"
emit_surfaces = ["ledger"]
dismiss_key = ["path", "kind", "sha256"]
notes = """v0.2.97. An env-block writer (the canonical projection, the user-secret \
strip, or `write-env-block` for the launcher's module-deprecation keys) found \
`.claude/settings.json` / `.vscode/settings.json` existing but not editable — \
not JSON(C), not UTF-8, unreadable, a non-object root, or a JSONC edit that could \
not be verified — and left it byte-identical instead of rewriting it as `{}` plus \
its block (the pre-v0.2.97 behaviour, which destroyed every other setting). The \
bundle's settings.json merge (`vco_lib.bundle_settings_io`) records its own \
surface, `bundle_claude_settings_json`: before v0.2.97 it skipped any \
non-strict-JSON file SILENTLY, so newly shipped hooks never landed in a JSONC \
settings.json; it now edits JSONC in place and refuses only what it cannot \
verify. The Hooks tab (`vco_lib.hooks_settings`) records its own too, \
`hooks_claude_settings_json` (review F19: sharing the projection's surface let a \
successful hook edit clear the projection's still-true refusal). ONE surface \
per WRITER, so each refusal is cleared only by the writer that made it. One \
entry per surface (`settings_write_refused_<surface>`). Cleared by the next \
successful write of that surface (paired, `settings_refusal.clear_recorded`) and \
by the probe: resolved once the file is gone or reads as an object; a refused \
JSONC edit stays while its bytes are unchanged (None once they change). \
dismiss_key includes the file's sha256, so a dismissal re-fires if the file \
changes and is still refused."""

