# Single source of truth for all pinned external dependencies (introduced
# by the 2026-05-24 diagrams plan; the diagram pins were removed in
# v0.2.102 — only [chromium] remains, so the [npm.*] set is currently
# empty and the schema below is kept for the next pin).
#
# Bumping any version here is a deliberate act that ships in a VCO
# release. Never auto-resolved; never floating.
#
# Edited here ONLY. Both Rust (vct-launcher-core/src/bundled_versions.rs
# via `include_str!`) and Python (vco_lib/bundled_versions.py via
# `tomllib`) parse this file. A cross-language parity test
# (`tests/test_bundled_versions_parity.py`) keeps the two parsers in
# lockstep, mirroring the orchestrator-managed-paths.txt pattern.
#
# Parse rules
# -----------
# This is standard TOML — see https://toml.io. The two language parsers
# are required to interpret the file identically; the parity test
# triangulates them against a third independent parse.
#
# Schema
# ------
# Each [npm.<key>] table has:
#   package : str — the npm package name.
#   version : str — exact semver, NO leading "^" or "~". Resolver is
#                   disabled at install time so the installed version
#                   must equal this string byte-for-byte.
#   shasum  : str — npm's NATIVE integrity field is SHA1 (40 hex chars,
#                   lowercase), exposed as `dist.shasum` by
#                   `npm view <pkg>@<version>`. We label the TOML key
#                   `shasum` (NOT `sha256`) so nobody downstream confuses
#                   it for SHA-256. Verified post-install against the
#                   local package manifest's `_integrity` / `_shasum`
#                   field where the installed npm version exposes it;
#                   skipped with a WARN when the local manifest does not
#                   (older npm cli versions).
#
# Self-reference: this file is listed in `orchestrator-managed-paths.txt`
# so that a copy-based install (`installer/file_ops.rs::copy_orchestrator_to_sync`;
# until v0.2.100 also the retired `update_orchestrator_at`) carries new
# editions of the manifest along — same fail-safe pattern the allowlist
# file uses.

# v0.2.102 (owner ruling 2026-10-07): the four diagram pins
# ([npm.mermaid_mcp], [npm.excalidraw_mcp], [npm.mermaid_lib],
# [npm.excalidraw_lib]) were REMOVED with the diagrams integrations —
# the wrappers, the vendored excalidraw fork and the install pre-pins
# they served are all gone. Only the [chromium] reuse pin remains.

[chromium]
# Mermaid PNG export + Excalidraw PNG export both lazy-load a Chromium
# instance. Playwright already manages its own Chromium download via
# `npx playwright install chromium` (see install.py::_install_playwright_browsers).
# We reuse THAT Chromium rather than fetching a second copy — there is
# no second download to pin here.
reuse_playwright = true
