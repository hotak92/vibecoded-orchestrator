# RL SCORING LOCK — the ONE home of "is RL scoring allowed to run at all?"
# (v0.2.100, W5R-02). One committed table Rust, Python and (through Rust) the
# launcher GUI all read. Never re-type the value in code.
# ═══════════════════════════════════════════════════════════════════════════
#
# OWNER RULING (2026-10-01, verbatim): "wire it, but for now we are keeping
# the RL module off because we still didn't train the neural network, so keep
# it unactive for now".
#
# While `locked = true`, RL SCORING (reranking search results through the RL
# reranker) is OFF in every state, whatever else is set:
#
#   * an explicit per-project `enabled_for_project = true` row,
#   * a host-wide (global) `true` row,
#   * a Pro / MAO licence or a paid-module overlay,
#   * the hub being unreachable (the MCP's old fall-open path).
#
# The per-project and host-wide rows are USER DATA and are never deleted or
# rewritten by the lock: they keep their stored values, the GUI shows them as
# "kept, applies once unlocked", and they apply again the moment this flips
# to `false`. The GUI refuses new "turn on" writes while locked.
#
# WHAT THE LOCK DOES NOT TOUCH: event LOGGING / collection. Retrieval and
# citation events are written to `rl_events` whatever this says (owner: logs
# are ALWAYS collected). The module-enable cascade that decides which
# projects receive the RL module's settings is also untouched — the lock
# gates scoring, not the module.
#
# ## Readers (parse THIS file)
#
#   * Rust:   launcher/src-tauri/vct-launcher-core/src/rl_scoring_lock.rs
#             (include_str! at compile time). Applied by
#             `Db::rl_scoring_enabled_for_project` (served by the hub's
#             /config as `rl_reranker_enabled_for_project`) and surfaced to
#             the GUI through `ModuleEnableState.lock_reason` and the
#             `rl_scoring_lock` command.
#   * Python: vco_lib/rl_scoring_lock.py (tomllib). Applied FIRST in
#             claude_mcp_servers/rl_client/search_pipeline.py
#             `_resolve_rl_enabled`, so a hub-down MCP is locked too.
#
# To unlock once a trained model ships: set `locked = false` (keep `reason`
# for the record) and update the tests that pin the shipped value.
#
# ═══════════════════════════════════════════════════════════════════════════
# UNLOCKED in v0.2.106 — OWNER RULINGS (2026-11-12):
#   * the product is PER-PROJECT ONLINE adaptation (no global weights ship);
#   * it ships OPT-IN: "for now opt-in, then we'll try to find how to make the
#     model generalize";
#   * the bar for a project's model to be SERVED: NDCG@10 >= +2% over plain
#     cosine AND MRR@10 of the literally cited node >= cosine's, judged on
#     that project's cumulative prequential record (every query scored by
#     the model in place before it trained on it) at an anytime-valid
#     confidence (the k-th check at 1 - 0.10 / (k (k+1))), from 300 queries
#     and 50 citing ones on.
#
# What `locked = false` means now — and what it does NOT:
#   * RL scoring is still OFF by default. The per-project toggle and the
#     host-wide default both default to off (`Db::module_effective_enabled`'s
#     system default for vct-rl-reranker; the Python fallback of a toggle it
#     cannot read is off too). The user turns it on per project in the
#     launcher's Modules panel. Toggle off = no call to the container: no
#     rerank, no /rl_update, search order unchanged.
#   * Toggle on = the project's citations train its own model online
#     (`claude_mcp_servers/rl_reranker/online_learning.py`), and the
#     container reranks that project's searches only while the model passes
#     the bar above on the project's prequential record; otherwise it hands
#     the search order back.
#   * `reason` below is the pre-v0.2.106 text, kept for the record (it is
#     only shown while `locked = true`).
# ═══════════════════════════════════════════════════════════════════════════

format_version = 1

locked = false

reason = "RL scoring stays inactive until the model is trained. Data collection continues regardless."
