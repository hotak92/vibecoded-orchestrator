#
# The post-commit KG reviewer's rule table (v0.2.103) — one committed table
# both languages parse (tier B of the A>B>C rule).
#
# Readers:
#   * Python — `vco_lib/kg_reviewer_model.py` (model choice + fallback rungs)
#     and `vco_lib/kg_reviewer_guard.py` (the post-run validator's locked-node
#     rules, the derived sidecars, the commit subject prefix). The reviewer
#     itself is `templates/scripts/kg_reviewer_backend.py`, spawned by the
#     `post-git-commit-kg-sync` hook pair.
#   * Rust — `launcher/src-tauri/src/commands/kg_reviewer_model.rs`
#     (`include_str!`): the Preferences page's "KG commit reviewer" model
#     selector reads `[model]` to list the choices and refuses any other value
#     on write.
#
# Changing a value here changes both sides in one edit; `format_version` bumps
# with any schema change (both loaders assert it).

format_version = 1

[model]
# The ONE machine-wide setting (owner ruling 2026-10-15: global, not per
# project). Resolution order, first hit wins:
#   1. the env override named by `env` (operator / CI);
#   2. launcher.db app_state[`app_state_key`] (Preferences -> KG commit
#      reviewer);
#   3. `default`.
# A value outside `choices` is ignored with a log line (never passed to the
# CLI), and the next rung answers.
env = "VCO_KG_REVIEW_MODEL"
app_state_key = "kg_reviewer.model"
default = "sonnet"
choices = ["haiku", "sonnet", "opus"]

[fallback]
# When the chosen Claude model is unavailable (no `claude` CLI, or its tier is
# breaker-latched on a REAL quota/429/auth signal), the reviewer may run on a
# gateway model of COMPARABLE capability — only when the local model gateway
# actually serves it (the catalogue is asked, never assumed). Flash models are
# deliberately absent: they are too weak for this job (owner ruling
# 2026-10-15), so with none of these served the review is SKIPPED with a log
# line, never degraded. Each row is [vendor row id, bare model id]; the
# gateway spelling is derived from model_router's vendor table.
gateway_rungs = [
    ["zai", "glm-5.3"],
    ["kimi", "k3"],
]

[prompt]
# The diff the prompt embeds is capped; the prompt says so and tells the
# reviewer to read the full files instead of guessing. `citing_nodes_max`
# caps the "Nodes that cite files this commit changed" list (a plain-text
# scan of knowledge/**/*.md for the commit's changed paths); the prompt says
# when that list was truncated.
stat_max_lines = 80
diff_max_lines = 1200
diff_max_chars = 120000
citing_nodes_max = 20

[guard]
# Subject prefix of the reviewer's own commits. The hook's reviewer never
# reviews a commit whose subject starts with it (recursion guard).
commit_prefix = "kg-sync:"
# A node is LOCKED when its frontmatter carries any of these tags, a `type`
# in `locked_types`, a `status` in `locked_statuses`, or its body contains a
# `locked_body_markers` phrase (case-insensitive). The reviewer may only
# APPEND a "## Proposed change (kg-reviewer, <YYYY-MM-DD>)" section to a
# locked node; any other edit is reverted.
locked_tags = ["decision", "do-not-change", "adr", "locked", "frozen"]
locked_types = ["decision", "adr"]
locked_statuses = ["locked", "frozen", "final", "archived", "deprecated", "superseded"]
locked_body_markers = ["do not change without discussion", "do-not-change"]
proposed_change_heading = "## Proposed change (kg-reviewer, "
# Frontmatter keys the reviewer may add or update on an existing node.
frontmatter_mutable_keys = ["updated"]
# A NEW node must open with YAML frontmatter carrying every one of these
# keys, each non-empty; otherwise the guard reverts it. A new node whose
# `title` (case- and whitespace-normalised) equals an existing node's title
# is reverted too — extend that node instead.
new_node_required_keys = ["title", "type", "tags", "created", "updated", "status"]
# The largest knowledge/ symlink TARGET the snapshot copies (bytes). A larger
# target is recorded as "too large - not restorable": a write through that
# link is logged REVERT-IMPOSSIBLE and nothing through it is committed.
link_target_max_bytes = 1048576
# Derived knowledge/ sidecars other tools regenerate (the summary generator,
# the sync). They are neither validated nor committed by the reviewer: their
# writers run asynchronously and also serve the user's own edits.
derived_sidecars = [".node_formats.json", ".node_embeddings.*", ".curated_hashes.json"]
