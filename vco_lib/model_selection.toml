#
# The per-task model-selection grid, rendered into the shipped CLAUDE.md
# templates as {{MODEL_SELECTION_GRID}} by vco_lib/model_selection.py.
#
# The content (scores, `*`/`†` markers, row order, reach-via agents, notes)
# is copied from the maintainer's "Model selection — which model for which
# task" grid (2026-10-03, re-scored at medium effort the same day). Scores
# are copied EXACTLY and are pinned by tests/test_model_selection_grid.py —
# edit both together.
#
# `reach_via` names only agents that SHIP in templates/agents/: the gateway
# rows name the templates/agents/module-gateway/*.md agents that pin that
# model, the Claude rows name the `model:` value to dispatch with.
#
# `providers` names who can SERVE the row: "anthropic" rows always render;
# a vendor row renders when the model gateway can resolve that vendor's key
# at render time (vco_lib/model_selection.py). GLM-5.3 is served by BOTH
# vendors (z.ai's own endpoint and the QwenCloud Token Plan both list it);
# GLM-5.3-Flash by z.ai only; the DeepSeek and Qwen rows by the qwen vendor
# only.
#
# A score is "1".."10" within this set, AT MEDIUM EFFORT. "*" marks an
# assumed score (no benchmark and fewer than 3 comparison reports), "†"
# (the `dagger` flag) marks a model with only xhigh/max benchmark results
# (no medium/high data) — weaker evidence — and "—" marks a column the
# model cannot do at all (text-only).

format_version = 1

# Table columns, in order. Pinned against the source grid by the test.
columns = [
  "Code", "Debug", "Review", "Plan", "Bulk", "Tools", "Instr", "LongCtx",
  "Docs", "Vision", "Cost",
]

# The rendered section intro (2-3 lines).
intro = [
  "Delegate to subagents and **always name the model** — the gateway agents below pin it in their own file, so dispatch them without a `model` param; for the Claude rows, name the model on the Agent call (`model: opus` and so on).",
  "Scores are 1–10 within this set, **at medium effort** (what this setup runs), from effort-matched benchmarks, vendor model cards and head-to-head user comparisons. **`*`** = assumed (no benchmark and fewer than 3 comparison reports); **`†`** = this model has only xhigh/max benchmark results (no medium/high data) — weaker evidence.",
  "Only the rows for model providers reachable on this machine at render time are listed — add a vendor key in the launcher's Secrets panel and re-run the update to add its rows.",
]

# The column legend, rendered after the table.
column_legend = "Columns: Code = agentic multi-file implementation · Debug = debugging & hard reasoning · Review = code review / critique · Plan = planning & architecture · Bulk = mechanical sweeps / classification · Tools = tool calls & terminal work · Instr = instruction following / format · LongCtx = long-context retrieval · Docs = writing & research synthesis · Vision = image input (— = text-only) · Cost = cheapness × speed at medium effort (10 = cheapest/fastest)."

# Notes that are NOT tied to one model: the grid's own evidence-quality and
# maintenance caveats. They render whenever the grid renders (after the
# per-model notes, inside the same "What changes the pick:" list).
general_notes = [
  "No benchmark measures code review for these versions; that column leans on user comparison reports.",
  "Re-check a row when that model's minor version changes — scores are tied to the exact versions above.",
]

