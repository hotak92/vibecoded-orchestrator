# Haiku 5.5 (v0.2.102, owner 2026-10-08) replaces Haiku 4.5, now a legacy
# model. Scored from public evidence read 2026-10-08: the Artificial Analysis
# Intelligence Index v4.3.2 at MEDIUM effort = 34 (Haiku 4.5: 17; Sonnet 5.5
# medium: 41), ≈165 tok/s and ≈$0.05 per task there, plus Anthropic's model
# card and system card, whose headline numbers are all at effort max. No
# dagger: the AA index is a real medium-effort figure. The row rests mainly
# on vendor numbers plus that AA composite; `*` marks the three columns no
# benchmark covers (Review, Instr, Docs). Re-check Code when independent
# real-repo data lands: Vals Vibe Code Bench (90.4%, level with Opus 5.5) is
# an outlier the Code score deliberately does not follow yet.
