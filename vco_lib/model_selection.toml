# Per-model notes, rendered (in file order) only when at least one of
# `models` rendered. `models` entries are row `id`s. The source grid's one
# combined GLM bullet is split per model here so the Flash guidance never
# renders for a table that lacks the Flash row.
[[note]]
models = ["opus"]
text = "**Opus 5.5** leads at medium on almost every axis and costs less per task than Fable 5.1 (≈$1.3 vs ≈$3.0); keep Fable for final reviews, plans and the hardest debugging."

[[note]]
models = ["sonnet"]
text = "**Sonnet 5.5** is the most effort-sensitive model: near Opus at max, but at medium it trails GLM-5.3 and DeepSeek V4.1 Flash on coding. Not a default choice."

[[note]]
models = ["haiku"]
text = "**Haiku 5.5** — the fastest and cheapest Claude (≈165 tok/s, ≈$0.05 per task at medium) with a 1M window: good for bulk, classification, extraction and routing. Its headline vendor scores are at effort max; at medium it sits below the flash-tier vendor lanes on code, so keep coding, planning and review on larger models."

[[note]]
models = ["deepseek-v4.1-flash"]
text = "**DeepSeek V4.1 Flash** — fastest (≈209 tok/s, ≈1 s to first token) and cheapest per task: default for research, surveys, bulk and bounded implementation. Users report fragile tool calls / loops on long runs — keep tasks bounded."

[[note]]
models = ["glm-5.3"]
text = "**GLM-5.3** — the non-Claude model users route review/audit to; text-only."

[[note]]
models = ["glm-5.3"]
text = "**GLM-5.3 as implementer** — strong on bounded lanes whose brief names the files and the acceptance criteria. Its recurring misses are \"every call-site\" coverage claims (check them with an independent grep), line-count / ASCII gates, and stray working-tree edits while proving a test red — name each in the brief."

[[note]]
models = ["kimi-k3"]
text = "**Kimi K3** — near-frontier code quality on real repos and strong long-context retrieval, but the slowest and most verbose lane here (independent runs: ≈44 min per ticket, ≈35 tok/s, about twice the median output tokens), so queue its work and review it later. Give it small, bounded lanes or audits. It always reasons; it can repeat the same tool call or stop on reasoning with no answer, and it guesses confidently when unsure (51% hallucination rate on uncertain questions), so demand quoted evidence in its reviews."

[[note]]
models = ["glm-5.3-flash"]
text = "**GLM-5.3-Flash** suits bulk / first-pass work behind a verifier — tests, a diff review or a stronger second pass; retries help it, more effort does not (longer runs helped it only 46% of the time, below chance). Keep it off shared-component extractions, where one un-migrated call-site leaves the suite green while defeating the change, and never give it unsupervised writes to a green test suite (it broke a passing baseline test in 6.9% of rollouts)."

[[note]]
models = ["qwen3.8-max"]
text = "**Qwen3.8-Max** — best prose and literal instruction-following, but it defaults to xhigh effort (≈$5.4 per task there) and users report it leaves work half-done and skips tests unless asked: state \"add tests and run them\"."
