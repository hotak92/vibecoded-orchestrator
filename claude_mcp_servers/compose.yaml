# vibecoded-orchestrator services
#
# Default config runs Weaviate + Ollama (CPU-friendly). Uncomment the
# code_embed service below if you have an NVIDIA GPU and want
# CodeSage-Large-v2 (2048-dim) for code embeddings — on CPU, Ollama
# serves the embedding model instead.
#
# Run:   podman-compose up -d        (or: docker compose up -d)
# Stop:  podman-compose down         (or: docker compose down)
# Logs:  podman-compose logs -f <service>
#
# GPU support (optional):
#   Requires nvidia-container-toolkit + CDI generation:
#     sudo nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml

name: vibecoded

services:
  # ── Weaviate ────────────────────────────────────────────────────────
  # Vector database used by the knowledge graph and code graph.
  # Anonymous access enabled for local-only use; lock down before
  # exposing on any non-loopback interface.
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.28.4
    # Prefixed name avoids collision with bare `weaviate` containers a user
    # may already be running. The `name: vibecoded` project label above also
    # auto-prefixes, but the explicit form makes the lifecycle (start / stop /
    # log) commands self-describing for ad-hoc CLI use.
    container_name: vco_weaviate
    restart: unless-stopped
    ports:
      - "8081:8080"    # HTTP API
      - "50052:50051"  # gRPC
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      ENABLE_API_BASED_MODULES: "true"
      CLUSTER_HOSTNAME: "node1"
      DISK_USE_READONLY_PERCENTAGE: "98"
      DISK_USE_IMMUTABLE_PERCENTAGE: "99"
      ENABLE_MODULES: ""
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/v1/.well-known/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - vibecoded-network

  # ── Ollama ──────────────────────────────────────────────────────────
  # Local LLM + embedding inference. Default config is CPU-friendly.
  # If you have an NVIDIA GPU, uncomment the `devices:` block below
  # to enable CUDA acceleration (requires nvidia-container-toolkit).
  ollama:
    # Pinned for supply-chain trust + reproducibility (matches
    # infrastructure/docker-compose.yml). Bump deliberately on a new
    # ollama release; releases: https://github.com/ollama/ollama/releases
    image: docker.io/ollama/ollama:0.20.2
    # Prefixed name avoids collision with bare `ollama` containers — see
    # weaviate above.
    container_name: vco_ollama
    restart: unless-stopped
    ports:
      - "11435:11434"
    volumes:
      - ollama_models:/root/.ollama
    # Uncomment for NVIDIA GPU support:
    # devices:
    #   - nvidia.com/gpu=all
    environment:
      # NVIDIA_VISIBLE_DEVICES: all
      # NVIDIA_DRIVER_CAPABILITIES: compute,utility
      OLLAMA_KEEP_ALIVE: "30s"
      OLLAMA_ORIGINS: "*"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: "q8_0"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/11434'"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - vibecoded-network

  # ── Optional: code-embedding service (GPU) ──────────────────────────
  # CodeSage-Large-v2 (2048-dim) for higher-quality code embeddings.
  # Requires NVIDIA GPU + nvidia-container-toolkit. On CPU, leave this
  # commented — Ollama serves the embedding model instead.
  # First start downloads ~2.5GB of model weights into the cache volume.
  #
  # code_embed:
  #   build:
  #     context: ./code_embedding_service
  #     dockerfile: Dockerfile
  #   container_name: vco_code_embed
  #   restart: unless-stopped
  #   ports:
  #     - "11440:11440"
  #   devices:
  #     - nvidia.com/gpu=all
  #   environment:
  #     NVIDIA_VISIBLE_DEVICES: all
  #     NVIDIA_DRIVER_CAPABILITIES: compute,utility
  #     CODE_EMBED_BACKEND: "gpu"
  #     CODE_EMBED_MODEL: "codesage/codesage-large-v2"
  #     CODE_EMBED_DEVICE: "auto"
  #     CODE_EMBED_DTYPE: "bfloat16"
  #     CODE_EMBED_PORT: "11440"
  #     CODE_EMBED_MAX_CONCURRENT: "4"
  #     HF_HUB_CACHE: "/cache"
  #     TRANSFORMERS_CACHE: "/cache"
  #   volumes:
  #     - code_embed_cache:/cache
  #   healthcheck:
  #     test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:11440/health')\""]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5
  #     start_period: 60s
  #   networks:
  #     - vibecoded-network

# ── Volumes ─────────────────────────────────────────────────────────────
volumes:
  weaviate_data:
  ollama_models:
  code_embed_cache:

# ── Network ─────────────────────────────────────────────────────────────
networks:
  vibecoded-network:
    driver: bridge
    name: vibecoded-network
