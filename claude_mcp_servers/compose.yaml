# vibecoded-orchestrator services
#
# Default config runs Weaviate + Ollama (CPU-friendly). Uncomment the
# code_embed service below if you have an NVIDIA GPU and want
# CodeSage-Large-v2 (2048-dim) for code embeddings — on CPU, Ollama
# serves the embedding model instead.
#
# Run:   podman-compose up -d        (or: docker compose up -d)
# Stop:  podman-compose down         (or: docker compose down)
# Logs:  podman-compose logs -f <service>
#
# GPU support (optional):
#   Requires NVIDIA Container Toolkit ≥ 1.18.0. The toolkit ships
#   `nvidia-cdi-refresh.path` + `.service` systemd units that auto-write
#   /var/run/cdi/nvidia.yaml on every driver install/upgrade. **DO NOT
#   write /etc/cdi/nvidia.yaml manually** — Podman reads /etc/cdi/ first,
#   shadowing the auto-refresh and breaking GPU containers on every
#   subsequent driver update. Verify: `systemctl is-enabled nvidia-cdi-refresh.path`.

name: vibecoded

services:
  # ── Weaviate ────────────────────────────────────────────────────────
  # Vector database used by the knowledge graph and code graph.
  # Anonymous access enabled for local-only use; lock down before
  # exposing on any non-loopback interface.
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.28.4
    # Prefixed name avoids collision with bare `weaviate` containers a user
    # may already be running. The `name: vibecoded` project label above also
    # auto-prefixes, but the explicit form makes the lifecycle (start / stop /
    # log) commands self-describing for ad-hoc CLI use.
    container_name: vco_weaviate
    restart: unless-stopped
    ports:
      - "8081:8080"    # HTTP API
      - "50052:50051"  # gRPC
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      ENABLE_API_BASED_MODULES: "true"
      CLUSTER_HOSTNAME: "node1"
      # --- WRITE-AMPLIFICATION REDUCTION (v0.2.61) ---
      # Mirror of the tuning in infrastructure/docker-compose.yml (the
      # canonical orchestration file); this legacy compose path wires into the
      # same shared volume so it must carry the same knobs. The KG/code-graph
      # sync hooks issue many small upserts → on Weaviate defaults each dirty
      # memtable flushes on a 60s timer → continuous flush+compaction (~57x
      # write amplification). All knobs verified against v1.28.4 source; safe
      # 8-64GB, podman+docker. The memtable AUTO-FLUSHES at 500MB (size
      # trigger) OR 3600s/1h (time trigger), whichever fires first — Weaviate
      # OR's the two. On the hook trickle workload the SIZE trigger almost
      # always wins (so the WAL-replay backlog is bounded to ~500MB, NOT by the
      # long timer); the 1h window just avoids flushing a near-empty memtable
      # every minute during quiet periods. WAL-durable throughout (the flush
      # cadence never touches the WAL/fsync path). Plus: LSM max segment 2GiB
      # (v0.2.73 FIX-D1, RAISED from 500MiB — see the canonical
      # infrastructure/docker-compose.yml for the full rationale: the low cap
      # BLOCKED compaction from collapsing ~42k dead CodeFunction versions, so
      # they were re-written every cycle; 2GiB lets them converge once. Keep
      # 2GiB conservative so a ~2x merge spike stays under free-disk headroom /
      # DISK_USE_READONLY_PERCENTAGE). Auto-size Go heap/CPU to host to cut
      # heap-driven flushing without OOM risk.
      PERSISTENCE_MEMTABLES_FLUSH_DIRTY_AFTER_SECONDS: 3600
      PERSISTENCE_MEMTABLES_MAX_SIZE_MB: 500
      PERSISTENCE_LSM_MAX_SEGMENT_SIZE: 2GiB
      LIMIT_RESOURCES: "true"
      # --- HNSW TOMBSTONE-CLEANUP CHURN REDUCTION (v0.2.61) ---
      # Mirror of the tuning in infrastructure/docker-compose.yml (canonical);
      # this legacy compose path wires into the same shared volume so it must
      # carry the same knobs. SECOND disk-leak source, distinct from the
      # memtable write-amp above: the code-graph collections accumulate large
      # tombstone counts (re-analyze deletes+re-inserts changed rows). Weaviate
      # runs a per-(class × named-vector × shard) HNSW tombstone-cleanup cycle
      # on a FIXED 300s ticker (hnsw/config.go DefaultCleanupIntervalSeconds =
      # 5*60; FixedTicker never backs off). With ~300 such indexes on a
      # multi-project install the 300s cycles interleave to ~1 cleanup/sec, and
      # each that finds work rewrites HNSW neighbor edges IN PLACE → GB/hour of
      # mtime-invisible writes. The spin: default MIN_PER_CYCLE=0 makes a
      # cleanup walk the whole graph on ANY non-zero tombstone count
      # (copyTombstonesToAllowList only short-circuits at EXACTLY 0), so a
      # collection sitting at thousands of tombstones re-walks every tick.
      # FIX: raise the MIN so cleanup is a cheap no-op until tombstones justify
      # the walk. Global env read via os.Getenv in delete.go (NOT in
      # environment.go), verified verbatim at the v1.28.4 tag; applies to ALL
      # existing collections immediately, unlike the per-class
      # cleanupIntervalSeconds which config_update.go marks IMMUTABLE.
      # SAFE / NO DATA LOSS: cleanup is pure GC of ALREADY-deleted vectors —
      # deferring it only delays reclaiming a few MB of dead-vector disk; it
      # never touches live data (searches already skip tombstoned nodes). The
      # MAX cap spreads a big reclaim over several short cycles instead of one
      # multi-GB stall; CONCURRENCY=1 keeps a firing cleanup off the disk/CPU
      # hot path on small hosts. All three verified at v1.28.4.
      TOMBSTONE_DELETION_MIN_PER_CYCLE: "10000"
      TOMBSTONE_DELETION_MAX_PER_CYCLE: "10000"
      TOMBSTONE_DELETION_CONCURRENCY: "1"
      # Disk usage thresholds (default 80%/90%/95%): raised to allow
      # operation on a nearly-full disk where the user has knowingly
      # accepted the risk. Warning at 95% so 80-94% disk doesn't spam
      # the launcher's logs and trigger spurious "unhealthy" states
      # (Bug 2026-05-05: at ~90% disk the rootlessport proxy can stall,
      # leaving the container Up-but-unreachable on the host port —
      # see knowledge/concepts/launcher-state-isolation-vct-state-dir.md
      # Lesson 3 for the recovery procedure).
      DISK_USE_WARNING_PERCENTAGE: "95"
      DISK_USE_READONLY_PERCENTAGE: "98"
      DISK_USE_IMMUTABLE_PERCENTAGE: "99"
      ENABLE_MODULES: ""
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      # Use /v1/meta, NOT /v1/.well-known/ready. Root cause of the
      # 2026-05-08 weaviate restart-loop / port-mapping desync was that
      # /v1/.well-known/ready returns 503 during legitimate operations
      # (vector-cache prefill, shard load, compactions). The strict
      # endpoint produced healthcheck flap → restart:unless-stopped → race
      # between podman restart N+1 and restart N's teardown → conmon /
      # rootlessport / state-DB desync that left the container in a
      # zombie "running but port dead" state. /v1/meta returns 200 as
      # long as the HTTP server itself is up, which is the right signal
      # for "container is functional".
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/v1/meta"]
      interval: 30s
      timeout: 5s
      retries: 5
      # Boot can take 20-40s on a multi-GB KG (raft init + shard load +
      # vector-cache prefill). Don't count failures during this window.
      start_period: 60s
    networks:
      - vibecoded-network

  # ── Ollama ──────────────────────────────────────────────────────────
  # Local LLM + embedding inference. Default config is CPU-friendly.
  # If you have an NVIDIA GPU, uncomment the `devices:` block below
  # to enable CUDA acceleration (requires nvidia-container-toolkit).
  ollama:
    # Pinned for supply-chain trust + reproducibility (matches
    # infrastructure/docker-compose.yml). Bump deliberately on a new
    # ollama release; releases: https://github.com/ollama/ollama/releases
    image: docker.io/ollama/ollama:0.20.2
    # Prefixed name avoids collision with bare `ollama` containers — see
    # weaviate above.
    container_name: vco_ollama
    restart: unless-stopped
    ports:
      - "11435:11434"
    volumes:
      - ollama_models:/root/.ollama
    # Uncomment for NVIDIA GPU support — the device syntax is ENGINE-
    # SPECIFIC (v0.2.54 C-RT-8):
    #   * Podman (CDI form — docker compose can't parse this spec):
    # devices:
    #   - nvidia.com/gpu=all
    #   * Docker (deploy.resources form — podman-compose ignores it on
    #     older releases; use the CDI form above instead):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    environment:
      # NVIDIA_VISIBLE_DEVICES: all
      # NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # v0.2.77 Part 9 task 6: keep the embedding model resident so hook-path
      # context injection doesn't re-pay the ~1.9 s model reload after any idle
      # gap (measured in the hook-latency audit 2026-07-11). The 30s default
      # meant any pause > 30s evicted qwen3-embedding; the next injection then
      # stalled ~1.9 s reloading it. "24h" pins it for the working day. The
      # per-request keep_alive the embedding clients now send (VCO_OLLAMA_KEEP_ALIVE,
      # default 24h) is the primary fix; this server-side default is the backstop
      # for any Ollama path that doesn't carry the request-level field.
      OLLAMA_KEEP_ALIVE: "24h"
      OLLAMA_ORIGINS: "*"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: "q8_0"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/11434'"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - vibecoded-network

  # ── Optional: code-embedding service (GPU) ──────────────────────────
  # CodeSage-Large-v2 (2048-dim) for higher-quality code embeddings.
  # Requires NVIDIA GPU + nvidia-container-toolkit. On CPU, leave this
  # commented — Ollama serves the embedding model instead.
  # First start downloads ~2.5GB of model weights into the cache volume.
  #
  # NOTE (v0.2.54 C-RT-8): the `devices: [nvidia.com/gpu=all]` line in
  # the block below is the PODMAN CDI form. Docker users must replace it
  # with the `deploy.resources.reservations.devices` form shown on the
  # ollama service above.
  #
  # code_embed:
  #   build:
  #     context: ./code_embedding_service
  #     dockerfile: Dockerfile
  #   container_name: vco_code_embed
  #   restart: unless-stopped
  #   ports:
  #     - "11440:11440"
  #   devices:
  #     - nvidia.com/gpu=all
  #   environment:
  #     NVIDIA_VISIBLE_DEVICES: all
  #     NVIDIA_DRIVER_CAPABILITIES: compute,utility
  #     CODE_EMBED_BACKEND: "gpu"
  #     CODE_EMBED_MODEL: "codesage/codesage-large-v2"
  #     CODE_EMBED_DEVICE: "auto"
  #     CODE_EMBED_DTYPE: "bfloat16"
  #     CODE_EMBED_PORT: "11440"
  #     # v0.2.77 F2: honour the host-derived cap install.py wrote to .env
  #     # (falls back to 4). Keep in sync with infrastructure/docker-compose.yml.
  #     CODE_EMBED_MAX_CONCURRENT: "${CODE_EMBED_MAX_CONCURRENT:-4}"
  #     HF_HUB_CACHE: "/cache"
  #     TRANSFORMERS_CACHE: "/cache"
  #   volumes:
  #     - code_embed_cache:/cache
  #   healthcheck:
  #     test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:11440/health')\""]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5
  #     start_period: 60s
  #   networks:
  #     - vibecoded-network

# ── Named volumes ─────────────────────────────────────────────────────
# Explicit `name:` declarations are required so Bug-31-style overrides
# in docker-compose.override.yml can alias them to external
# pre-existing volumes (otherwise podman-compose 1.5.x crashes with
# "can't merge value of [<vol>] of type NoneType and dict" when the
# override tries to add `external: true` to a null-valued entry here).
# Override pattern:
#
#   volumes:
#     <name_above>:
#       external: true
#       name: <pre-existing-volume-name>
volumes:
  weaviate_data:
    name: vco_weaviate_data
  ollama_models:
    name: vco_ollama_models
  code_embed_cache:
    name: vco_code_embed_cache

# ── Network ─────────────────────────────────────────────────────────────
networks:
  vibecoded-network:
    driver: bridge
    name: vibecoded-network
