#
# pyproject.toml — packaging for the sub-packages under `claude_mcp_servers/`
# that must be importable from an ARBITRARY working directory after install:
# `weaviate_mcp` and `model_router`.
#
# After `pip install -e claude_mcp_servers/` (which install.py runs at step
# 4/10, after the root requirements.txt install), all consumer scripts can
# `from weaviate_mcp.chunking import Chunker` or `from model_router.server
# import create_app` without sys.path hacks, and the `vct-model-gateway`
# console script resolves on PATH.
#
# `claude_mcp_servers/` itself has NO `__init__.py` and is not a package, so
# `python -m claude_mcp_servers.<anything>` only resolves from the repository
# root (via PEP 420 implicit namespace packages). The console script and the
# top-level module names below are what make the gateway runnable from a
# service unit, whose working directory is not the checkout.
#
# NOT packaged here, deliberately: `search_mcp`, `rl_client`, `_lib`,
# `wrappers`, `code_embedding_service`. Every one of them is reached by an
# explicit `sys.path` insert in the script that launches it (the MCP servers
# are spawned by absolute path, not as installed modules), so they are already
# delivered by the clone. Installing them as TOP-LEVEL modules would put a
# name as generic as `_lib` into site-packages and create the "non-editable
# copy shadows the checkout" failure mode this project has already been bitten
# by. A test that derives this list from "directories containing __init__.py"
# would therefore be wrong; the criterion is "must import from an arbitrary
# cwd", and these two are the ones that must.
#
# install.py handles the invocation; users don't run this directly.

[build-system]
requires = ["hatchling >= 1.18"]
build-backend = "hatchling.build"

[project]
# The distribution NAME stays `weaviate-mcp` even though it now ships two
# packages: renaming it would leave every existing install carrying an
# orphaned `weaviate_mcp-*.dist-info` alongside the new one, with two editable
# finders pointing at the same source tree. The name is an upgrade contract,
# not a description.
name = "weaviate-mcp"
version = "0.2.92"
description = "VibeCoded Orchestrator MCP servers — Weaviate KG/code-graph search and the local model gateway"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [
    { name = "Martino Cesaratto", email = "martino.cesaratto@gmail.com" },
]
keywords = ["mcp", "weaviate", "knowledge-graph", "claude-code", "orchestrator", "gateway"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Runtime deps shared with the root requirements.txt.
# Versions are kept in sync with the root file; install.py installs the root
# requirements.txt first, then `pip install -e .` here (no re-download
# since the packages are already present in the venv).
#
# `model_router` adds no dependency: it needs `aiohttp` (already declared for
# the MCP servers) and `vco_lib` (installed from the ROOT distribution before
# this one — deliberately not declared here, because declaring the root
# distribution as a dependency of one of its own sub-distributions would make
# pip resolve the repository as a package of itself).
dependencies = [
    # Ceiling MUST match requirements.txt / the root pyproject `mcp` extra: mcp 2.0
    # removed `mcp.server.fastmcp`, which both shipped servers import. This surface
    # had no ceiling until v0.2.94 (Dependabot #364 would have lifted it silently).
    "mcp>=1.27.0,<2",
    "weaviate-client>=4.23.0",
    "aiohttp>=3.13.5",
    "httpx>=0.28.1",
    "pydantic>=2.13.3",
    "pyyaml>=6.0.3",
]

[project.scripts]
# The gateway daemon's entry point. Mirrors the root distribution's
# `vco = vco_lib.cli.__main__:main`; hatchling emits a `.exe` shim on Windows,
# which is what makes a Scheduled Task able to launch it without naming a
# Python interpreter path.
vct-model-gateway = "model_router.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["weaviate_mcp", "model_router"]
