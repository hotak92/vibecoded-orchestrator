# vct-config.toml — local-machine config for the VCO launcher.
#
# This file lives next to the launcher binary (the release archive ships it
# as `vct-config.toml`). Missing or unparseable is fine: every value has a
# compiled default.
#
# What's OUT of scope (NOT in this file — product-fixed, same for everyone):
#   * License-validation Supabase URL → env override only
#     (`VCT_VALIDATE_TIER_URL`); the canonical default is baked into
#     the binary because changing it per-machine would break licensing.
#   * The canonical orchestrator GitHub repo URL.
#
# Service endpoints are NOT configured here any more (v0.2.97).
# ─────────────────────────────────────────────────────────────────────
# Where Weaviate, Ollama and code-embed are reached is recorded ONCE, in the
# launcher DB (`service_endpoints`), and every process reads it from there.
# `python install.py --update` imported a non-default `weaviate_url` from this
# file one time (the value below was the shipped default, not a setting), and
# nothing reads the key since. To point VCO at a different Weaviate:
#
#   python -m vco_lib.service_endpoints candidates        # what is running
#   python -m vco_lib.service_endpoints adopt --service weaviate --url http://<host>:<port>
#   python -m vco_lib.service_endpoints show              # what VCO uses now
#
# weaviate_url = "http://localhost:8081"
