#
# packs.toml — the ONE committed table of opt-in agent/skill packs
# (v0.2.101 catalogue plan §3.1). Parsed by `vco_lib/packs.py` (the one
# home for pack behaviour); the launcher GUI reads it ONLY through
# `python -m vco_lib.packs status --json` (Rust never mirrors the table).
#
# Shape:
#   [pack.<name>]
#   description = "<one line, shown in the launcher's Packs tab>"
#   members = [ "<path relative to THIS file>", ... ]
#
# A member path is relative to this file and is either
#   <pack>/agents/<name>.md            — one agent definition, or
#   <pack>/skills/<name>/SKILL.md      — one skill directory (every
#                                        companion file under the directory
#                                        ships with it).
# Every member MUST exist; no member in two packs; no member also shipped
# by default (`templates/agents/free|module-gateway`, `templates/skills`) —
# all three rules are validated loudly by `vco_lib.packs.load_packs` and
# pinned by `tests/test_catalogue_packs.py`.
#
# Delivery: members install to the SAME destinations as default agents and
# skills (`.claude/agents/<name>.md`, `.claude/skills/<name>/…`), so every
# bundle rule (hash compare, adoption, skip-disabled, --skip-kind, orphan
# handling) applies to them unchanged. A pack is recorded in the project
# manifest's `packs` map; a plain `install-bundle --update` keeps recorded
# packs current, `--remove-pack <name>` removes them (edited members are
# backed up first, never silently deleted).

