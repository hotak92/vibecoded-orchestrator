#
# pyproject.toml — packaging for the `vibecoded-orchestrator` Python
# distribution. This file replaces the `scripts/vco{,.ps1}` shim
# wrappers shipped in Phase 0.C: once a user runs
# `pip install -e .` (or `pip install -e .[mcp]` for the full MCP /
# indexer stack), the `vco` console_script is registered on PATH
# directly via `[project.scripts]` (cross-OS: hatchling generates
# `vco.exe` on Windows and a `vco` script on Unix).
#
# install.py invokes `pip install -e .` after creating the project's
# `.venv` so end-users never have to run it themselves; the file is
# pip-installable from any sufficiently-recent pip without extra config.

[build-system]
requires = ["hatchling >= 1.18"]
build-backend = "hatchling.build"

[project]
name = "vibecoded-orchestrator"
version = "0.2.51"
description = "VibeCoded Orchestrator — local-first agentic infrastructure for Claude Code"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [
    { name = "Martino Cesaratto", email = "martino.cesaratto@gmail.com" },
]
keywords = [
    "claude-code",
    "agentic-systems",
    "knowledge-graph",
    "weaviate",
    "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Code Generators",
]

# CLI-only runtime deps. Heavy deps (MCP SDK, Weaviate client, sentence-
# transformers, torch) live in the `mcp` optional-dependency group so the
# bare `vco` CLI doesn't drag them in: `verify-pins` and `verify-env-
# projection` only need stdlib + tomllib (3.11+), and `rebuild-diagram-
# index` / `codegraph-diagram` import Weaviate lazily inside guarded
# `try/except ImportError` blocks. Users who want the full stack do
# `pip install -e .[mcp]` (install.py picks this path automatically).
dependencies = [
    # tomllib is stdlib on 3.11+ (our minimum), so no backport pin is
    # needed at runtime. Listed here only as a sentinel for future
    # readers who consider lowering `requires-python`.
]

[project.optional-dependencies]
# Full MCP server stack — required for weaviate-kg, search, ollama MCPs
# and for the diagram indexer's Weaviate-backed path. Mirrors
# requirements.txt; kept loose-pinned here so the optional install
# resolves cleanly with whatever requirements.txt has nailed down.
mcp = [
    "mcp >= 1.27.0",
    "weaviate-client >= 4.21.0",
    "aiohttp >= 3.13.5",
    "httpx >= 0.28.1",
    "requests >= 2.31",
    "pydantic >= 2.13.3",
    "pyyaml >= 6.0.3",
    "watchdog >= 6.0.0",
    "asyncpg >= 0.31.0",
    "ollama >= 0.6.2",
    "sentence-transformers >= 5.4.1",
    # Pinned <4.50 because CodeSage-Large-v2 trust_remote_code modeling
    # file imports `Conv1D` from `transformers.modeling_utils` (moved in
    # 4.50). See requirements.txt for the full multi-paragraph rationale.
    "transformers >= 4.40.0, < 4.50.0",
    "torch >= 2.11.0",
    "fastapi >= 0.136.1",
    "uvicorn >= 0.46.0",
    "psutil >= 7.2.2",
]
# Test/dev tools — mirrors requirements-dev.txt.
test = [
    "pytest >= 9.0.3",
    "pytest-asyncio >= 1.3.0",
]
dev = [
    "pytest >= 9.0.3",
    "pytest-asyncio >= 1.3.0",
    "ruff >= 0.15.12",
    "pyright >= 1.1.409",
    # playwright is intentionally NOT pulled in by the dev extra — it
    # downloads ~300 MB of browser binaries on first use. Install it
    # explicitly when needed: `pip install playwright && playwright install`.
]

[project.scripts]
# Single CLI entry point. Resolves to `vco_lib.cli.__main__:main`,
# which dispatches to verify-pins / verify-env-projection / rebuild-
# diagram-index / codegraph-diagram (and future subcommands as Phase 1+
# adds them — each subcommand registers itself onto a shared argparse
# subparsers action via its module's `add_subparsers(sub)` hook).
vco = "vco_lib.cli.__main__:main"

[project.urls]
Repository = "https://github.com/hotak92/vibecoded-orchestrator"
Issues = "https://github.com/hotak92/vibecoded-orchestrator/issues"
Changelog = "https://github.com/hotak92/vibecoded-orchestrator/blob/main/CHANGELOG.md"

# ---------------------------------------------------------------------------
# Hatchling build configuration
# ---------------------------------------------------------------------------

[tool.hatch.build.targets.wheel]
# Ship only `vco_lib/` in the wheel. The orchestrator-self has a much
# larger source tree (launcher/, claude_mcp_servers/, templates/, etc.)
# but those are NOT what `pip install` packages — they're orchestrator
# infrastructure consumed by the launcher GUI / hooks / `install.py`,
# not Python library code. Keeping the wheel scope to `vco_lib` matches
# how the CLI is consumed (a thin Python entry point) and keeps the
# install footprint small enough that `pip install -e .` is essentially
# free.
packages = ["vco_lib"]

[tool.hatch.build.targets.sdist]
# The sdist intentionally bundles slightly more (so `pip install` from a
# git tarball still works), but stays well short of the full repo. Add
# anything else here that becomes part of the Python install surface
# later; large infra (launcher binaries, container compose files) does
# NOT belong in the sdist.
include = [
    "vco_lib/**/*.py",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]
