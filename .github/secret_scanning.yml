# GitHub secret-scanning configuration.
#
# This file tells GitHub's secret-scanning service to ignore specific paths
# when scanning for leaked credentials. Use sparingly — every exclusion is
# a class of bug we voluntarily blind ourselves to.
#
# See: https://docs.github.com/en/code-security/secret-scanning/configuring-secret-scanning-for-your-repositories
#
# ────────────────────────────────────────────────────────────────────────
# vco_lib/excalidraw_mcp_fork/dist/canvas/frontend/**
# ────────────────────────────────────────────────────────────────────────
# The Excalidraw MCP server (MIT, vendored from upstream
# github.com/debu-sinha/excalidraw-mcp-server v2.0.0) ships a built web
# bundle at dist/canvas/frontend/ for its optional "connected mode"
# (multi-client browser canvas sync via WebSocket). That bundle includes
# upstream's Firebase config — an AIzaSy-prefix Google API key that is
# publicly embedded in client-side JS by design, restricted at the GCP
# layer via HTTP referrer + API restrictions.
#
# We don't own the key and can't rotate it. Our wrapper at
# claude_mcp_servers/wrappers/excalidraw_proxy.py starts
# dist/mcp/index.js (standalone mode), never dist/canvas/index.js — the
# canvas frontend is dead code in our integration today but kept for a
# potential v0.2.34+ "Open in browser canvas" feature (useful on
# mobile per user direction).
#
# Trade-off accepted: if a future Excalidraw rebuild ships a NEW
# different leaked secret in the same path, this exclusion silences it
# too — we'd ship the new leak unaware. Mitigation: when bumping the
# vendored Excalidraw version, manually grep for AIzaSy / sk- / xoxb-
# / glpat- / etc. in the new dist/ tree before committing. The
# `vco_lib/bundled_versions.py` pin bump is a natural moment to do this.
paths-ignore:
  - 'vco_lib/excalidraw_mcp_fork/dist/canvas/frontend/**'
