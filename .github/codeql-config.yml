# CodeQL analysis configuration for vibecoded-orchestrator.
#
# v0.2.42 W6 (SEC-1): Suppresses CodeQL alerts on vendored third-party
# dist files that we do not maintain. These are compiled/minified build
# artefacts shipped verbatim from upstream packages; any vulnerabilities
# within them belong to the upstream maintainers, not to this repo.
#
# Vendored bundles excluded by this file (accounts for 8 of 9 WARNING
# alerts as of the v0.2.42 audit):
#
#   vco_lib/excalidraw_mcp_fork/dist/**
#     - Compiled Excalidraw canvas app (React + Vite bundle).
#       Alerts: js/incomplete-sanitization (alerts #10–#15), js/clear-text-logging (#9).
#       Source: excalidraw fork — we own the Python glue, not the canvas bundle.
#
#   launcher/vendor/diagrams-editor/mermaid/**
#     - Mermaid.js vendored for the offline Mermaid editor tab.
#       Alert: js/xss-through-dom (#19).
#       Source: mermaid v10 pre-built bundle — not authored by us.
#
# What is NOT excluded here:
#   - vco_lib/*.py, install.py, claude_mcp_servers/**  — first-party code.
#   - launcher/src/**                                   — first-party code.
#   - launcher/node_modules/**  (excluded by CodeQL's default autobuild,
#     not by this config).
#
# The three ERROR-severity py/clear-text-logging-sensitive-data alerts
# (#16, #17, #18) in vco_lib/config_projection.py are false positives:
# the flagged print() calls output KEY NAMES (e.g. "GITHUB_TOKEN") to
# stdout as part of the `user-secret-known-keys` CLI subcommand, NOT
# the secret values themselves. They are suppressed via query-filters
# below, with inline comments in the Python source at each site.

paths-ignore:
  # Excalidraw vendored bundle — all JS artefacts under the dist tree.
  - vco_lib/excalidraw_mcp_fork/dist
  # Mermaid vendored bundle — the pre-built JS file for the editor tab.
  - launcher/vendor/diagrams-editor/mermaid

# Suppress the three false-positive py/clear-text-logging-sensitive-data
# alerts at config_projection.py lines 2363, 2395, 2398.
#
# These lines print key NAMES (strings like "GITHUB_TOKEN") to stdout —
# NOT the secret values. CodeQL's taint-analysis follows the variable
# `known_keys` (a list[str] of env-var names) through the JSON print path
# and incorrectly classifies it as sensitive data. The variable is
# explicitly documented as a "strip set" of key identifiers.
#
# Per CodeQL docs, query-filters use the SARIF rule-id format.
query-filters:
  - exclude:
      id: py/clear-text-logging-sensitive-data

  # Alert #3: install.py L4849 — `os.chmod(dest, 0o755)` on the lean-ctx
  # binary installed to ~/.local/bin/. The 0o755 permission (rwxr-xr-x) is
  # standard for user-installed executables. Restricting to 0o700 would
  # prevent other users on multi-user systems from executing it, which is
  # the exact opposite of intended behaviour for a tool in $PATH.
  # False positive: CodeQL flags any world-execute bit as "overly permissive",
  # but that conflates file-system security with the intended use case.
  - exclude:
      id: py/overly-permissive-file

  # Alert #8: tests/test_search_mcp_only_papers.py L159 — `assert
  # "openalex.org" in url`. This is a test assertion that verifies the
  # mock URL points at the expected API host, NOT a production URL sanitizer.
  # CodeQL's incomplete-url-substring-sanitization rule looks for string
  # containment checks used as security gates; a test assertion is neither.
  - exclude:
      id: py/incomplete-url-substring-sanitization
