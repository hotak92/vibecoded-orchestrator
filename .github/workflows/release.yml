# Release workflow — Stage 8 multi-OS shipping (2026-04-26).
#
# Triggers on tag push (v*), produces per-OS launcher artifacts, and
# uploads them to the GitHub release. Does NOT replace ci.yml (that's
# the per-PR fast lane); this is the slow per-tag pipeline.
#
# What we ship per OS:
#   - Linux:   .AppImage (portable) + .deb (system install). Both come
#              out of `tauri build` for free on ubuntu-latest. Primary
#              is .AppImage; .deb is the convenience for Debian/Ubuntu.
#   - Windows: portable .exe. We grab the raw binary from
#              src-tauri/target/release/, NOT the NSIS installer Tauri
#              also produces. User direction (Stage 8): "a simple
#              portable .exe to launch the launcher". WebView2 is
#              downloaded on first run via Tauri's bootstrapper if
#              missing (almost never on Win10 21H1+/Win11). Unsigned
#              for v0.1.0 — SmartScreen warning is documented in README.
#   - macOS:   .dmg. EXPERIMENTAL — we have no Mac to test on (Stage 8
#              constraint). Built best-effort on macos-latest (which is
#              currently macos-14 on Apple Silicon, M1). Unsigned and
#              un-notarized: macOS Gatekeeper will quarantine on first
#              open. README documents the `xattr -cr` workaround. Apple
#              Developer enrollment is on the post-launch backlog.
#
# macOS gotcha research (canonical at time of writing, 2026-04):
#   - Without notarization, .dmg downloads pick up the
#     com.apple.quarantine xattr → Gatekeeper says "app is damaged".
#     Workaround: `xattr -cr /Applications/VCT\ Launcher.app`.
#   - Universal binary (Intel + Apple Silicon) requires the
#     `aarch64-apple-darwin` AND `x86_64-apple-darwin` Rust targets
#     installed AND `--target universal-apple-darwin`. We ship
#     architecture-specific artifacts (Apple Silicon only via macos-14
#     runner) for v0.1.0 to keep the matrix simple. Intel users will
#     have to wait for v0.1.1 OR build from source. Documented in README.
#   - WebKit on macOS has no known Tauri 2 blockers as of 2026-04.
#   - LaunchServices registers the .app once it's dragged to /Applications.
#
# Code signing (Windows AuthentiCode + Apple Developer ID) is OUT OF
# SCOPE for v0.1.0. Tracked separately for v0.1.1.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # needed to attach artifacts to the release

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_glob: |
              launcher/src-tauri/target/release/bundle/appimage/*.AppImage
              launcher/src-tauri/target/release/bundle/deb/*.deb
          - os: windows-latest
            artifact_glob: |
              launcher/src-tauri/target/release/vct-launcher-temp.exe
          - os: macos-latest
            artifact_glob: |
              launcher/src-tauri/target/release/bundle/dmg/*.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      # Tauri 2 Linux build deps. Same set as ci.yml.
      - name: Install Tauri Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: npm ci
        working-directory: launcher
        run: npm ci

      # `tauri build` runs the frontend build (vite) via beforeBuildCommand
      # then bundles the Rust backend per-OS targets.
      - name: tauri build
        working-directory: launcher
        run: npx tauri build

      # Rename Windows .exe to a download-friendly name. Tauri produces
      # `vct-launcher-temp.exe` (matches Cargo `[package].name`); we
      # rename in-place before upload so the artifact is `vct-launcher-windows-x64.exe`.
      - name: Rename Windows portable .exe
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $src = "launcher/src-tauri/target/release/vct-launcher-temp.exe"
          $dst = "launcher/src-tauri/target/release/vct-launcher-windows-x64.exe"
          if (Test-Path $src) {
            Move-Item -Path $src -Destination $dst -Force
            Write-Host "Renamed -> $dst"
            $size = (Get-Item $dst).Length / 1MB
            Write-Host ("Size: {0:N1} MB" -f $size)
          } else {
            Write-Error "Expected portable .exe not found at $src"
            exit 1
          }

      # Rename .dmg so users can tell architecture. macos-14 runners
      # are Apple Silicon; macos-13 was Intel. We're on -latest = -14
      # for v0.1.0; Intel users build from source or wait for v0.1.1.
      - name: Rename macOS .dmg with arch suffix
        if: matrix.os == 'macos-latest'
        run: |
          dmg=$(ls launcher/src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          if [ -z "$dmg" ]; then
            echo "::error::No .dmg found"
            exit 1
          fi
          arch=$(uname -m)
          new="launcher/src-tauri/target/release/bundle/dmg/vct-launcher-macos-${arch}.dmg"
          mv "$dmg" "$new"
          echo "Renamed -> $new"
          ls -lh "$new"

      - name: Upload to GitHub Release
        if: matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: launcher/src-tauri/target/release/vct-launcher-windows-x64.exe

      - name: Upload to GitHub Release (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            launcher/src-tauri/target/release/bundle/appimage/*.AppImage
            launcher/src-tauri/target/release/bundle/deb/*.deb

      - name: Upload to GitHub Release (macOS)
        if: matrix.os == 'macos-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: launcher/src-tauri/target/release/bundle/dmg/*.dmg
