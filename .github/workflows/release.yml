# Release workflow — multi-OS shipping.
#
# Triggers:
#   - Tag push matching v*.*.* (e.g. v0.1.0) → cuts a GitHub Release.
#   - Manual workflow_dispatch → useful for dry-runs / re-cutting artifacts.
#
# What we ship per OS (two asset classes per matrix entry):
#
#   1. Standalone launcher binary (legacy, kept for GUI-only users):
#      - Linux x64 (ubuntu-latest):    vct-launcher          + .metadata.json
#      - Windows x64 (windows-latest): vct-launcher.exe      + .metadata.json
#      - macOS arm64 (macos-latest):   vct-launcher          + .metadata.json
#
#   2. Full release archive (recommended path, since v0.2.0):
#      - Linux x64:    vibecoded-orchestrator-<version>-linux-x64.tar.gz
#      - Windows x64:  vibecoded-orchestrator-<version>-windows-x64.zip
#      - macOS arm64:  vibecoded-orchestrator-<version>-macos-arm64.tar.gz
#      Each archive contains:
#        - launcher binary + vct-cli (vco) binary
#        - claude_mcp_servers/ (Python MCP stack — venv stripped)
#        - templates/ (agents, skills, hooks templates)
#        - .claude/ (hooks, scripts, settings.json — no runtime state)
#        - infrastructure/ (compose files)
#        - tools/ (Claude wrapper, secrets helpers)
#        - install.{sh,ps1,py} + first-install.* + start-launcher.*
#          (OS-appropriate set per archive)
#        - BOOTSTRAP.md, README.md, LICENSE, vct-module.json,
#          orchestrator-managed-paths.txt, MIGRATION-<version>.md
#      Plus .sha256 sidecar per archive.
#
# Intel Macs (x86_64) intentionally NOT shipped: the `macos-13` GitHub
# runner image was fully deprecated 2025-12-04 (actions/runner-images
# #13046) and v0.1.5's matrix entry caused a 23h47m queue hang because
# no runner picks up that label anymore. Apple stopped selling Intel
# Macs in late 2023, so the cohort is negligible for a tier-2 alpha.
# Revisit if user demand surfaces — cross-compile path:
# `--target x86_64-apple-darwin` from the arm64 runner.
#
# macOS UNSIGNED — Apple Developer ID + notarization deferred
# (Tier-2 alpha, see QuickStart). First-launch users will see a
# Gatekeeper "unidentified developer" dialog; right-click → Open
# bypasses it. README + QuickStart already disclose this. Code
# signing tracked separately for v0.2.x.
#
# Build is driven by `bash scripts/build-bundled-launcher.sh` — the
# SAME script maintainers run locally. It does:
#   1. npm/pnpm install + run build (SvelteKit frontend) — explicit, NOT
#      relying on Tauri's beforeBuildCommand which has silently no-op'd
#      under mismatched package managers.
#   2. tauri build --no-bundle (we ship the raw binary, not installers).
#   3. POST-BUILD asset-ref check — refuses to stage a binary with <5
#      `_app/immutable/` refs (catches the "Could not connect to
#      localhost" empty-frontend regression class).
#   4. Stage to launcher/dist/<host_target>/<binary> + .metadata.json
#      (source_sha, source_hash, built_at, launcher_version, etc.).
# Reusing the script keeps CI and local builds bit-identical and means
# the embedded-frontend safety check ALSO runs in CI — not just locally.
#
# Code signing (Windows AuthentiCode + Apple Developer ID) is OUT OF
# SCOPE for v0.1.0. Tracked separately for v0.1.1.

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      skip_dist_commit:
        description: "Skip committing built binaries back to main (dry-run / QA)"
        type: boolean
        default: false
      skip_supabase_deploy:
        description: "Skip auto-deploying Supabase edge functions + migrations (dry-run / QA)"
        type: boolean
        default: false

permissions:
  contents: write       # needed to attach artifacts to the release
  id-token: write       # needed to mint Sigstore OIDC token for attestation
  attestations: write   # needed to publish the SLSA provenance attestation

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            binary: vct-launcher
          - os: windows-latest
            target: windows-x64
            binary: vct-launcher.exe
          # macOS Apple Silicon (M1/M2/M3). `macos-latest` defaults to ARM
          # since the GitHub-hosted runner image transition (Sept 2024+).
          # macOS Intel (x86_64) entry was removed 2026-05-01 — the
          # macos-13 runner image was fully deprecated 2025-12-04 and
          # caused v0.1.5's release run to hang in queue for 23+ hours.
          # See .claude/context/macos-x64-build-investigation-2026-05-01.md
          # in the orchestrator host repo.
          - os: macos-latest
            target: macos-arm64
            binary: vct-launcher

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri

      # Tauri 2 Linux build deps. Mirror the set in scripts/build-bundled-launcher.sh
      # docs and ci.yml so a CI failure here matches what a contributor would
      # hit running the script on a fresh Ubuntu box. `build-essential`,
      # `curl`, `wget`, `file` are required by Tauri's bundler chain even
      # under --no-bundle (file is used for ELF detection).
      - name: Install Tauri Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file

      # Single source of truth: same script maintainers run locally.
      # Bash is the shell on all runners — Git Bash on windows-latest is
      # preinstalled. The script auto-detects host arch but accepts a
      # `BUILD_TARGET` override so CI can pin the canonical dist subdir
      # name (matters for macOS where local builds use the legacy
      # `experimental_macOS` slot but CI ships `macos-arm64`/`macos-x64`).
      - name: Build launcher (bundled script)
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: bash scripts/build-bundled-launcher.sh

      # v0.2.21+: vct-hub is a sibling binary built from the same Cargo
      # workspace and staged into the same launcher/dist/<arch>/ directory
      # by scripts/build-bundled-launcher.sh. Expose its platform-specific
      # filename (vct-hub vs vct-hub.exe) as a step output so downstream
      # steps don't duplicate the ".exe on Windows" branching logic.
      - name: Compute vct-hub binary name
        id: hub_meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            echo "binary=vct-hub.exe" >> "$GITHUB_OUTPUT"
          else
            echo "binary=vct-hub" >> "$GITHUB_OUTPUT"
          fi

      # Sanity-check that the staged artifacts exist before upload, so a
      # silent build-script change can't produce a release with empty
      # assets. Listing also surfaces sizes in the run log.
      - name: Verify staged artifacts
        shell: bash
        run: |
          set -euo pipefail
          dist="launcher/dist/${{ matrix.target }}"
          if [ ! -f "$dist/${{ matrix.binary }}" ]; then
            echo "::error::Expected $dist/${{ matrix.binary }} not found"
            ls -la "$dist" || true
            exit 1
          fi
          if [ ! -f "$dist/${{ matrix.binary }}.metadata.json" ]; then
            echo "::error::Expected $dist/${{ matrix.binary }}.metadata.json not found"
            ls -la "$dist" || true
            exit 1
          fi
          # v0.2.21+: vct-hub assertions. Same hard-fail contract as the
          # launcher checks above — if the build script regresses and
          # forgets to stage vct-hub on a particular arch, fail here
          # rather than silently shipping a launcher-only release.
          hub_bin="${{ steps.hub_meta.outputs.binary }}"
          if [ ! -f "$dist/$hub_bin" ]; then
            echo "::error::Expected $dist/$hub_bin not found"
            ls -la "$dist" || true
            exit 1
          fi
          if [ ! -f "$dist/$hub_bin.metadata.json" ]; then
            echo "::error::Expected $dist/$hub_bin.metadata.json not found"
            ls -la "$dist" || true
            exit 1
          fi
          ls -lh "$dist"

      # macOS artifacts are flagged with the `-experimental` suffix in their
      # filename so users browsing the GitHub Release sidebar see the tier
      # marker before downloading. Apple Developer ID code-signing +
      # notarization are deferred to v0.2.x; until then macOS users will
      # hit Gatekeeper. Done BEFORE attestation so SLSA provenance binds
      # to the user-visible filename (so `gh attestation verify
      # vct-launcher-macos-arm64-experimental` works).
      - name: Stage release artifact (rename macOS to -experimental)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          dist="launcher/dist/${{ matrix.target }}"
          stage="$dist/_release"
          mkdir -p "$stage"
          hub_bin="${{ steps.hub_meta.outputs.binary }}"
          case "${{ matrix.target }}" in
            macos-arm64|macos-x64)
              cp "$dist/${{ matrix.binary }}" "$stage/vct-launcher-${{ matrix.target }}-experimental"
              cp "$dist/${{ matrix.binary }}.metadata.json" "$stage/vct-launcher-${{ matrix.target }}-experimental.metadata.json"
              # v0.2.21+: vct-hub gets the same -experimental suffix on
              # macOS so the Release sidebar surfaces the unsigned-tier
              # marker consistently across both binaries. vct-hub ships
              # UNSIGNED on macOS in v0.2.21 — same posture as vct-launcher.
              cp "$dist/$hub_bin" "$stage/vct-hub-${{ matrix.target }}-experimental"
              cp "$dist/$hub_bin.metadata.json" "$stage/vct-hub-${{ matrix.target }}-experimental.metadata.json"
              ;;
            *)
              cp "$dist/${{ matrix.binary }}" "$stage/${{ matrix.binary }}"
              cp "$dist/${{ matrix.binary }}.metadata.json" "$stage/${{ matrix.binary }}.metadata.json"
              # v0.2.21+: vct-hub staged for Linux/Windows under its
              # canonical filename (vct-hub or vct-hub.exe).
              cp "$dist/$hub_bin" "$stage/$hub_bin"
              cp "$dist/$hub_bin.metadata.json" "$stage/$hub_bin.metadata.json"
              ;;
          esac
          ls -lh "$stage"

      # Build the vct-cli (`vco`) binary that ships alongside the launcher.
      # Separate Cargo workspace at launcher/tools/vct-cli/Cargo.toml. The
      # binary name is `vco` (renamed from `vct` to avoid collision with
      # the bash secrets tool at tools/vct-secrets/vct — see
      # launcher/tools/vct-cli/Cargo.toml `[[bin]] name = "vco"` for the
      # rationale and docs/CLI.md for the user-facing rename note).
      #
      # We don't reuse `Swatinem/rust-cache` for this build — the
      # workspace is only ~7 deps and the build is sub-30s on a cold
      # cache. Adding a second cache entry would risk cache thrash with
      # the launcher's much larger entry above.
      - name: Build vct-cli (vco) binary
        shell: bash
        run: |
          cargo build --release \
            --manifest-path launcher/tools/vct-cli/Cargo.toml

      # Stage the full release archive layout. The archive ships the
      # launcher binary plus everything an end user needs to run it
      # standalone: claude_mcp_servers (Python MCP stack), templates
      # (agents/skills/hooks templates), .claude (project-scoped hooks
      # + scripts + settings), infrastructure (compose files), tools
      # (Claude wrapper + secrets helpers), the install scripts, and
      # the doc surface (BOOTSTRAP / README / LICENSE / MIGRATION).
      #
      # The version string in the archive name is sourced from
      # launcher/src-tauri/Cargo.toml so the workflow stays valid
      # across future version bumps without re-editing — single source
      # of truth pattern same as build-bundled-launcher.sh.
      #
      # Exclusions are conservative: we strip runtime/state pollution
      # (.venv, __pycache__, *.pyc, .claude/logs, .claude/metrics)
      # but keep agents/skills/hooks/scripts/settings.json which the
      # installer wires into the user's project on first run. None of
      # these excluded paths exist in CI's checkout (clean clone), but
      # the patterns are defensive in case the workflow is ever run
      # locally via `act` against a developer's working tree.
      - name: Determine release version and archive name
        id: archive_meta
        shell: bash
        run: |
          set -euo pipefail
          # Pull version from the SAME source the launcher embeds at
          # build time (launcher/src-tauri/Cargo.toml `version = "..."`).
          # Cargo metadata would be cleaner but adds a JSON parse step;
          # grep is enough for a single well-formed line.
          version="$(grep -m1 '^version = ' launcher/src-tauri/Cargo.toml \
            | sed -E 's/^version *= *"([^"]+)".*/\1/')"
          if [ -z "$version" ]; then
            echo "::error::Could not extract version from launcher/src-tauri/Cargo.toml"
            exit 1
          fi

          # On tag push, sanity-check that the tag matches the Cargo
          # version. Catches the failure mode "tag v0.2.0 pushed but
          # forgot to bump Cargo.toml" — would otherwise produce an
          # archive named after the OLD version under the NEW tag.
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            tag_version="${GITHUB_REF#refs/tags/v}"
            if [ "$tag_version" != "$version" ]; then
              echo "::error::Tag version ($tag_version) does not match Cargo.toml version ($version)."
              echo "         Bump launcher/src-tauri/Cargo.toml to $tag_version before tagging,"
              echo "         OR retag from a commit where the versions agree."
              exit 1
            fi
          fi

          archive_base="vibecoded-orchestrator-${version}-${{ matrix.target }}"
          # Uniform `.zip` for all three OSes (2026-05-10 packaging
          # direction). Pre-this-PR Linux + macOS used `.tar.gz`, which
          # required users to know the difference between `tar -xzf` and
          # double-clicking. `.zip` is the universal archive format —
          # macOS Finder / GNOME Archive Manager / Windows Explorer all
          # extract it natively. The reproducibility loss vs the GNU-tar
          # `--owner=0 --group=0 --numeric-owner --sort=name` path is
          # accepted (zip carries per-file uid/gid + mtime; SLSA build
          # provenance binds to the launcher binary inside the archive,
          # not the archive wrapper, so attestation isn't affected).
          archive_ext="zip"
          archive_name="${archive_base}.${archive_ext}"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "archive_base=${archive_base}" >> "$GITHUB_OUTPUT"
          echo "archive_ext=${archive_ext}" >> "$GITHUB_OUTPUT"
          echo "archive_name=${archive_name}" >> "$GITHUB_OUTPUT"
          echo "Archive will be: ${archive_name}"

      # Build the staging tree at dist/<archive_base>/. We copy via
      # `tar c | tar x` with --exclude rules so the same shell logic
      # runs on Linux, macOS, and the Windows Git Bash runner (rsync
      # is not on the Windows runner image; tar is).
      - name: Stage archive contents
        shell: bash
        env:
          ARCHIVE_BASE: ${{ steps.archive_meta.outputs.archive_base }}
          MATRIX_TARGET: ${{ matrix.target }}
          MATRIX_BINARY: ${{ matrix.binary }}
          HUB_BINARY: ${{ steps.hub_meta.outputs.binary }}
        run: |
          set -euo pipefail
          stage_root="dist/${ARCHIVE_BASE}"
          rm -rf "$stage_root"
          mkdir -p "$stage_root"

          # 1. Launcher binary (from the bundled-script staging dir;
          # this is the SAME binary the existing workflow uploads as a
          # standalone asset, so SLSA attestation downstream still
          # binds correctly to the launcher inside the archive).
          src_launcher="launcher/dist/${MATRIX_TARGET}/${MATRIX_BINARY}"
          if [ ! -f "$src_launcher" ]; then
            echo "::error::Expected launcher binary at $src_launcher"
            exit 1
          fi
          cp "$src_launcher" "$stage_root/${MATRIX_BINARY}"

          # 1b. vct-hub binary (v0.2.21+). Same staging pattern; lives
          # next to vct-launcher inside the archive so end users get
          # both with one extract.
          src_hub="launcher/dist/${MATRIX_TARGET}/${HUB_BINARY}"
          if [ ! -f "$src_hub" ]; then
            echo "::error::Expected vct-hub binary at $src_hub"
            exit 1
          fi
          cp "$src_hub" "$stage_root/${HUB_BINARY}"
          if [ "${MATRIX_TARGET}" != "windows-x64" ]; then
            chmod +x "$stage_root/${HUB_BINARY}"
          fi

          # 2. vct-cli (vco) binary
          if [ "${MATRIX_TARGET}" = "windows-x64" ]; then
            vco_src="launcher/tools/vct-cli/target/release/vco.exe"
            vco_dst="$stage_root/vco.exe"
          else
            vco_src="launcher/tools/vct-cli/target/release/vco"
            vco_dst="$stage_root/vco"
          fi
          if [ ! -f "$vco_src" ]; then
            echo "::error::Expected vct-cli binary at $vco_src"
            ls -la launcher/tools/vct-cli/target/release/ || true
            exit 1
          fi
          cp "$vco_src" "$vco_dst"
          # Preserve executable bit on Unix (rsync below also preserves
          # it for the directory copies, but a direct cp drops it on
          # some host configurations).
          if [ "${MATRIX_TARGET}" != "windows-x64" ]; then
            chmod +x "$stage_root/${MATRIX_BINARY}" "$vco_dst"
          fi

          # 3. Subtree copies — claude_mcp_servers, templates, .claude,
          # infrastructure, tools. tar's --exclude filters keep runtime
          # detritus out of the shipped archive. The `tar c | tar x`
          # idiom preserves modes and is available on all three runner
          # OSes (Git Bash on Windows ships GNU tar).
          base_excludes=(
            --exclude='.venv'
            --exclude='__pycache__'
            --exclude='*.pyc'
            --exclude='*.pyo'
            --exclude='.pytest_cache'
            --exclude='.mypy_cache'
            --exclude='node_modules'
          )
          copy_subtree() {
            local src="$1"; local dst="$2"; shift 2
            mkdir -p "$dst"
            tar -cf - "${base_excludes[@]}" "$@" -C "$src" . | tar -xf - -C "$dst"
          }
          copy_subtree claude_mcp_servers "$stage_root/claude_mcp_servers"
          copy_subtree templates "$stage_root/templates"
          copy_subtree infrastructure "$stage_root/infrastructure"
          copy_subtree tools "$stage_root/tools"

          # .claude/ has additional exclusions for runtime state we
          # never want shipped: logs, metrics, ephemeral context.
          #
          # PR-39 (v0.2.12, 2026-05-16): the public repo no longer tracks
          # .claude/{hooks,scripts,settings.json} — install.py renders them
          # from templates/ at install time. The `.claude/` directory may
          # therefore be missing entirely from the checked-out tree. Guard
          # with `mkdir -p` so the copy step doesn't fail on an empty
          # source; the destination stays present (possibly empty), and
          # install.py at user install time populates it via
          # _materialize_orchestrator_self_claude_dir().
          mkdir -p .claude
          copy_subtree .claude "$stage_root/.claude" \
            --exclude='logs' \
            --exclude='metrics' \
            --exclude='context' \
            --exclude='cron-jobs.json' \
            --exclude='cron-dashboard.html'

          # 4. Installer scripts — OS-specific picks.
          if [ "${MATRIX_TARGET}" = "windows-x64" ]; then
            # Windows users get the .ps1 + .bat entry points and the
            # cross-platform install.py. The .sh + .command + .desktop
            # entries are Linux/macOS-only and would just confuse a
            # Windows user.
            cp install.ps1 "$stage_root/"
            cp install.py "$stage_root/"
            cp first-install.bat "$stage_root/"
            cp start-launcher.bat "$stage_root/"
          else
            # Linux + macOS share the .sh entry points; the .command
            # variant is macOS-friendly (Finder double-click) and the
            # .desktop variant is Linux-friendly (GNOME/KDE), but
            # shipping both is harmless on either OS — they just get
            # ignored by the wrong platform's file manager.
            cp install.sh "$stage_root/"
            cp install.py "$stage_root/"
            cp first-install.sh "$stage_root/"
            cp first-install.command "$stage_root/"
            cp first-install.desktop "$stage_root/"
            cp start-launcher.sh "$stage_root/"
            cp start-launcher.command "$stage_root/"
            cp start-launcher.desktop "$stage_root/"
          fi

          # 5. Top-level docs + manifests.
          # README, CLAUDE.md (Claude Code session-start instructions),
          # and KNOWN_ISSUES are needed at archive root for users / Claude
          # to find them on extraction. CHANGELOG, CONTRIBUTING, CLA,
          # CODE_OF_CONDUCT, SECURITY are community/legal docs that
          # belong at the root of any open-source release.
          cp BOOTSTRAP.md "$stage_root/"
          cp README.md "$stage_root/"
          cp CLAUDE.md "$stage_root/"
          cp KNOWN_ISSUES.md "$stage_root/"
          cp CHANGELOG.md "$stage_root/"
          cp CONTRIBUTING.md "$stage_root/"
          cp CLA.md "$stage_root/"
          cp CODE_OF_CONDUCT.md "$stage_root/"
          cp SECURITY.md "$stage_root/"
          cp LICENSE "$stage_root/"
          cp vct-module.json "$stage_root/"
          cp orchestrator-managed-paths.txt "$stage_root/"
          cp requirements.txt "$stage_root/"
          # Local-machine config (per the 2026-05-10 packaging direction).
          # Source ships as `vct-config.example.toml` to keep it out of
          # `git status` noise during dev; the archive renames it to
          # `vct-config.toml` because that's what the launcher reads at
          # runtime via `std::env::current_exe() → parent → vct-config.toml`.
          # User edits in place after install; the example name is only
          # the source-tree convention.
          if [ -f vct-config.example.toml ]; then
            cp vct-config.example.toml "$stage_root/vct-config.toml"
          fi
          # MIGRATION-0.2.0.md is the per-release migration doc; if a
          # docs/MIGRATION-<version>.md file matches the archive
          # version, ship it at archive root for visibility (users
          # extract → see migration notes immediately, before they
          # have to know about docs/).
          version="${ARCHIVE_BASE#vibecoded-orchestrator-}"
          version="${version%-${MATRIX_TARGET}}"
          migration_doc="docs/MIGRATION-${version}.md"
          if [ -f "$migration_doc" ]; then
            cp "$migration_doc" "$stage_root/MIGRATION-${version}.md"
          fi

          # 6. Public docs/ folder. Internal maintainer docs live in the
          # top-level internal/ directory which is NOT shipped — see
          # internal/README.md. The launcher subtree is excluded from
          # docs/ explicitly; subtree docs live under launcher/ already.
          copy_subtree docs "$stage_root/docs"

          # Sanity ls — surfaces sizes in the run log so a regression
          # (e.g. someone accidentally including a 200MB cache dir)
          # is visible without needing to dig into the artifact.
          echo "::group::Staging tree summary"
          du -sh "$stage_root"
          du -sh "$stage_root"/* 2>/dev/null || true
          echo "::endgroup::"

      - name: Create archive (Linux/macOS — zip)
        if: matrix.os != 'windows-latest'
        shell: bash
        env:
          ARCHIVE_BASE: ${{ steps.archive_meta.outputs.archive_base }}
          ARCHIVE_NAME: ${{ steps.archive_meta.outputs.archive_name }}
        run: |
          set -euo pipefail
          # `zip` is preinstalled on `ubuntu-latest` and `macos-latest`
          # GitHub-hosted runners. -r recurses; -X strips OS-extra
          # extended attributes for cross-platform stability; -9 picks
          # the maximum compression level (CI minutes are cheap; user
          # download bandwidth isn't). The trailing `--symlinks` flag
          # preserves any symlinks in the staged tree (we don't ship
          # any today, but the flag is cheap insurance against a future
          # subtree introducing one).
          cd dist
          zip -r -X -9 --symlinks "${ARCHIVE_NAME}" "${ARCHIVE_BASE}"
          ls -lh "${ARCHIVE_NAME}"

      - name: Create archive (Windows — Compress-Archive)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          ARCHIVE_BASE: ${{ steps.archive_meta.outputs.archive_base }}
          ARCHIVE_NAME: ${{ steps.archive_meta.outputs.archive_name }}
        run: |
          # PowerShell's Compress-Archive ships in every Windows runner
          # image. -CompressionLevel Optimal trades CPU for ~5-10%
          # smaller .zip vs default. -Force overwrites any leftover
          # archive from a previous run on the same runner.
          # Note: Linux/macOS use `zip -9 -X --symlinks`; Compress-Archive
          # has no equivalent flags but produces a compatible .zip
          # readable by every platform's archive manager.
          #
          # Pass the STAGE DIRECTORY itself (not "$stage\*") so the zip
          # mirrors Linux/macOS layout: contents nested at
          # `<archive_base>/...` rather than flat at the zip root.
          # This was inconsistent through v0.2.13 (Windows zip was flat,
          # other OSes were nested); fixed in v0.2.14 so end-users get
          # the same `unzip -j <zip> "<archive_base>/<file>"` extraction
          # pattern on every OS.
          $stage = Join-Path "dist" $env:ARCHIVE_BASE
          $out   = Join-Path "dist" $env:ARCHIVE_NAME
          if (-not (Test-Path $stage)) {
              Write-Error "Staging dir not found: $stage"
              exit 1
          }
          Compress-Archive -Path $stage `
                           -DestinationPath $out `
                           -CompressionLevel Optimal `
                           -Force
          Get-Item $out | Format-List Name, Length, LastWriteTime

      - name: Compute archive checksum
        shell: bash
        env:
          ARCHIVE_NAME: ${{ steps.archive_meta.outputs.archive_name }}
        run: |
          set -euo pipefail
          cd dist
          # sha256sum is GNU coreutils on Linux; macOS ships shasum -a 256;
          # Git Bash on Windows ships sha256sum (msys2 build).
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          else
            shasum -a 256 "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          fi
          cat "${ARCHIVE_NAME}.sha256"

      # SLSA build provenance attestation. Generates a Sigstore-signed
      # in-toto provenance predicate (SLSA Build Level 2 by default on
      # GitHub-hosted runners) for the launcher binary. End users can
      # verify the binary really came from this workflow on this commit
      # with `gh attestation verify <binary> --repo hotak92/vibecoded-orchestrator`.
      # Runs only on tagged releases — workflow_dispatch dry-runs skip
      # attestation since there's nothing to publish provenance for.
      # Subject path resolution: macOS jobs attest the renamed
      # `-experimental` binary, others attest the canonical filename.
      - name: Generate build provenance attestation
        if: startsWith(github.ref, 'refs/tags/v')
        # v4 wraps actions/attest@v4 — both run on Node 24, fixing the
        # Node 20 deprecation warnings (Node 20 removed from runners
        # 2026-09-16). v4 also marks attest-build-provenance as a thin
        # compat wrapper; new logic should call actions/attest directly,
        # but for an existing release pipeline v4 is the minimal upgrade.
        uses: actions/attest-build-provenance@v4
        with:
          # v0.2.21+: multi-line subject-path attests BOTH binaries in a
          # single provenance predicate, so `gh attestation verify` works
          # for vct-launcher AND vct-hub from the same workflow run. If a
          # future @v5 release tightens multi-subject semantics, fall back
          # to two separate `actions/attest-build-provenance` steps.
          subject-path: |
            launcher/dist/${{ matrix.target }}/_release/${{ (startsWith(matrix.target, 'macos-')) && format('vct-launcher-{0}-experimental', matrix.target) || matrix.binary }}
            launcher/dist/${{ matrix.target }}/_release/${{ (startsWith(matrix.target, 'macos-')) && format('vct-hub-{0}-experimental', matrix.target) || steps.hub_meta.outputs.binary }}

      # Upload the binary + metadata + full release archive as Release
      # assets. softprops/action-gh-release@v3 auto-creates the release
      # on tag push if it doesn't exist yet, and is a no-op for
      # workflow_dispatch runs without a tag (files still show up as
      # workflow artifacts via the separate upload-artifact step below
      # — useful for dry-runs).
      #
      # One asset class per OS: the full release archive plus its
      # .sha256 sidecar. The archive bundles the launcher, vct-cli,
      # MCP servers, templates, hooks, and install scripts — i.e. the
      # standalone launcher binary is included inside the archive, so
      # we no longer publish it as a separate Release asset (avoids a
      # confusing 12-asset list per release; the launcher binary +
      # metadata.json are still produced and kept as workflow artifacts
      # for QA, see the Upload-as-workflow-artifact steps below).
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/${{ steps.archive_meta.outputs.archive_name }}
            dist/${{ steps.archive_meta.outputs.archive_name }}.sha256

      # Always upload as workflow artifacts too — lets workflow_dispatch
      # runs (no tag) still produce downloadable binaries + archives
      # for QA. Two artifacts per matrix entry: the legacy launcher-only
      # bundle and the full release archive.
      - name: Upload launcher binary as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: vct-launcher-${{ matrix.target }}
          # v0.2.21+: artifact now bundles BOTH binaries + sidecars under
          # the same artifact name (vct-launcher-<target>). actions/upload-
          # artifact@v7 flattens multi-line `path:` of individual files
          # into the artifact root, so download-artifact will produce:
          #   _dist-artifacts/<target>/vct-launcher[.exe]
          #   _dist-artifacts/<target>/vct-launcher[.exe].metadata.json
          #   _dist-artifacts/<target>/vct-hub[.exe]
          #   _dist-artifacts/<target>/vct-hub[.exe].metadata.json
          # The commit-dist-binaries job downstream consumes this flat
          # layout — its stage_binary function is already generic over
          # binary name (see lines below).
          path: |
            launcher/dist/${{ matrix.target }}/${{ matrix.binary }}
            launcher/dist/${{ matrix.target }}/${{ matrix.binary }}.metadata.json
            launcher/dist/${{ matrix.target }}/${{ steps.hub_meta.outputs.binary }}
            launcher/dist/${{ matrix.target }}/${{ steps.hub_meta.outputs.binary }}.metadata.json
          if-no-files-found: error

      - name: Upload release archive as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.archive_meta.outputs.archive_base }}
          path: |
            dist/${{ steps.archive_meta.outputs.archive_name }}
            dist/${{ steps.archive_meta.outputs.archive_name }}.sha256
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  # commit-dist-binaries
  #
  # After all three OS builds succeed, download the built launcher binaries
  # from workflow artifacts and commit them back to `main` so that
  # `git clone` always ships a binary that matches HEAD.
  #
  # ⚠️  BRANCH-PROTECTION PREREQUISITE — this job pushes directly to main.
  # If your default branch is protected by a ruleset that requires PR review
  # or status checks, the push will 403 unless one of two options is in
  # place:
  #
  # Option A (recommended for org-owned repos):
  #   Add the GitHub Actions bot to the ruleset's `bypass_actors` list:
  #     { "actor_id": 41898282, "actor_type": "Integration", "bypass_mode": "always" }
  #   actor_id 41898282 is the canonical GitHub Actions Bot integration ID.
  #
  # Option B (required for personal-account repos):
  #   The Integration-type bypass actor only works on org-owned repos.
  #   On a user-owned repo, set a `DIST_COMMIT_TOKEN` repository secret to
  #   a fine-grained PAT with `Contents: Write` on this repo (the PAT bypasses
  #   ruleset enforcement when it belongs to a repo admin). The "Push updated
  #   binaries" step below honours `${{ secrets.DIST_COMMIT_TOKEN }}` when
  #   present and falls back to `${{ secrets.GITHUB_TOKEN }}` otherwise.
  #
  # The commit is skipped (no-op) when:
  #   - workflow_dispatch input skip_dist_commit == true  (manual override)
  #   - All three binaries are byte-identical to what is already at HEAD
  #     (avoids churn commits when only source-only changes release)
  # ─────────────────────────────────────────────────────────────────────────
  commit-dist-binaries:
    name: Commit built binaries back to main
    needs: build
    runs-on: ubuntu-latest
    # Only run on tag pushes or explicit workflow_dispatch (skip in PR checks).
    # Also honour the manual skip_dist_commit input.
    if: |
      (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
      && github.event.inputs.skip_dist_commit != 'true'

    steps:
      # v0.2.15 (0.3): early visibility on missing DIST_COMMIT_TOKEN.
      # The auto-commit step would otherwise run all the way through
      # build + artifact download + diff and only fail at the final
      # `git push` with a 403. By probing the secret presence FIRST we
      # save ~5 minutes of CI work + leave a clear marker for
      # maintainers in the job log.
      - name: Check DIST_COMMIT_TOKEN presence
        run: |
          if [ -z "${{ secrets.DIST_COMMIT_TOKEN }}" ]; then
            echo "::warning::DIST_COMMIT_TOKEN secret is not set on this repo."
            echo "::warning::The auto-commit step will fall back to GITHUB_TOKEN and 403"
            echo "::warning::against branch protection. Either:"
            echo "::warning::  (a) Set the secret per docs/MAINTAINER_GUIDE.md Option B, OR"
            echo "::warning::  (b) Manually commit binaries post-release via the recipe in"
            echo "::warning::      docs/MAINTAINER_GUIDE.md 'Manual binary commit recipe'."
            echo "missing=true" >> "$GITHUB_OUTPUT"
          else
            echo "DIST_COMMIT_TOKEN is set — auto-commit will use it."
            echo "missing=false" >> "$GITHUB_OUTPUT"
          fi
        id: token_check

      - uses: actions/checkout@v6
        with:
          # v0.2.17 fix (post-v0.2.16 release): explicitly check out
          # `main`, NOT the tag's commit. When the release tag is
          # pushed on a pre-squash branch (PR squash-merged then
          # tagged on the source branch tip), the tag's commit is
          # tree-identical to the merge commit on main but has a
          # different ancestry. A workflow that checks out the tag
          # and then `git push HEAD:main` is rejected as non-fast-
          # forward because main's squash commit isn't an ancestor.
          # Observed on v0.2.16 release run 26045579108. Build the
          # binary commit on top of current main HEAD instead so the
          # push is always a fast-forward.
          ref: main
          # Fetch full history so we can check byte-equality before committing.
          fetch-depth: 1
          # Prefer DIST_COMMIT_TOKEN (a fine-grained PAT with Contents:Write
          # on this repo, configured as a repository secret). This bypasses
          # branch-protection on user-owned repos where Integration-type
          # bypass_actors do not apply. Falls back to GITHUB_TOKEN if the
          # secret is not set — that path will 403 against a protected
          # branch but works against unprotected ones. See the
          # `token_check` step above for visibility on which token is
          # being used.
          token: ${{ secrets.DIST_COMMIT_TOKEN || secrets.GITHUB_TOKEN }}

      # Download all three OS launcher binaries produced by the build matrix.
      # Each artifact is named `vct-launcher-<target>` and contains:
      #   launcher/dist/<target>/vct-launcher[.exe]
      #   launcher/dist/<target>/vct-launcher[.exe].metadata.json
      - name: Download linux-x64 binary
        uses: actions/download-artifact@v4
        with:
          name: vct-launcher-linux-x64
          path: _dist-artifacts/linux-x64

      - name: Download windows-x64 binary
        uses: actions/download-artifact@v4
        with:
          name: vct-launcher-windows-x64
          path: _dist-artifacts/windows-x64

      - name: Download macos-arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: vct-launcher-macos-arm64
          path: _dist-artifacts/macos-arm64

      # Copy the freshly-built binaries into the committed dist tree.
      # Preserve executable bits (download-artifact strips them on Linux).
      # Compare to HEAD before staging — skip entirely if byte-identical.
      - name: Stage binaries and detect changes
        id: stage
        shell: bash
        run: |
          set -euo pipefail

          # Determine version from Cargo.toml (same source as release.yml build job).
          version="$(grep -m1 '^version = ' launcher/src-tauri/Cargo.toml \
            | sed -E 's/^version *= *"([^"]+)".*/\1/')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          changed=0

          stage_binary() {
            local artifact_dir="$1"  # e.g. _dist-artifacts/linux-x64
            local target="$2"        # e.g. linux-x64
            local binary="$3"        # e.g. vct-launcher or vct-launcher.exe

            # actions/upload-artifact@v7 FLATTENS files into the artifact root
            # when uploaded with a multi-line `path:` of individual files.
            # The build job (see lines 581-588) uploads:
            #   launcher/dist/<target>/<binary>
            #   launcher/dist/<target>/<binary>.metadata.json
            # but the resulting artifact unpacks to:
            #   <artifact_dir>/<binary>
            #   <artifact_dir>/<binary>.metadata.json
            # NOT the nested `<artifact_dir>/launcher/dist/<target>/<binary>`
            # the pre-v0.2.16 code assumed. The v0.2.15 release auto-commit
            # failed at this step with exactly this path mismatch (the manual
            # binary-commit recipe was used to ship 0d24812 to main).
            # Fixed in v0.2.16: use the flat layout actions/upload-artifact@v7
            # actually produces.
            local src="${artifact_dir}/${binary}"
            local dst="launcher/dist/${target}/${binary}"

            if [ ! -f "$src" ]; then
              echo "::error::Expected artifact not found: $src"
              echo "  artifact_dir contents:"
              ls -la "$artifact_dir" || true
              exit 1
            fi

            # Restore executable bit (download-artifact strips it).
            chmod +x "$src"

            # Compare: if files are byte-identical, nothing to do for this OS.
            if [ -f "$dst" ] && cmp -s "$src" "$dst"; then
              echo "  [skip] ${target}/${binary} — byte-identical to HEAD"
            else
              cp "$src" "$dst"
              chmod +x "$dst"
              echo "  [stage] ${target}/${binary} — updated"
              changed=$((changed + 1))
            fi

            # Always update the metadata.json sidecar (it contains built_at
            # timestamp so it's always different, but it's tiny — no concern).
            local meta_src="${artifact_dir}/${binary}.metadata.json"
            local meta_dst="launcher/dist/${target}/${binary}.metadata.json"
            if [ -f "$meta_src" ]; then
              cp "$meta_src" "$meta_dst"
            fi
          }

          stage_binary "_dist-artifacts/linux-x64"   "linux-x64"   "vct-launcher"
          stage_binary "_dist-artifacts/windows-x64" "windows-x64" "vct-launcher.exe"
          stage_binary "_dist-artifacts/macos-arm64" "macos-arm64" "vct-launcher"

          # v0.2.21+: vct-hub rides along inside the same per-arch
          # artifact (see Upload launcher binary as workflow artifact
          # above), so no extra download steps are needed — just three
          # additional stage_binary calls reusing the generic function.
          stage_binary "_dist-artifacts/linux-x64"   "linux-x64"   "vct-hub"
          stage_binary "_dist-artifacts/windows-x64" "windows-x64" "vct-hub.exe"
          stage_binary "_dist-artifacts/macos-arm64" "macos-arm64" "vct-hub"

          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          echo "Summary: ${changed} binary/binaries updated."

      - name: Commit and push updated binaries
        if: steps.stage.outputs.changed != '0'
        shell: bash
        env:
          VERSION: ${{ steps.stage.outputs.version }}
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage ONLY the dist binary files — nothing else.
          # v0.2.21+: six new entries cover vct-hub (binary + sidecar) for
          # each of the three arches. The grep-whitelist below
          # (`grep -v '^launcher/dist/'`) already accepts these paths.
          git add \
            launcher/dist/linux-x64/vct-launcher \
            launcher/dist/linux-x64/vct-launcher.metadata.json \
            launcher/dist/windows-x64/vct-launcher.exe \
            launcher/dist/windows-x64/vct-launcher.exe.metadata.json \
            launcher/dist/macos-arm64/vct-launcher \
            launcher/dist/macos-arm64/vct-launcher.metadata.json \
            launcher/dist/linux-x64/vct-hub \
            launcher/dist/linux-x64/vct-hub.metadata.json \
            launcher/dist/windows-x64/vct-hub.exe \
            launcher/dist/windows-x64/vct-hub.exe.metadata.json \
            launcher/dist/macos-arm64/vct-hub \
            launcher/dist/macos-arm64/vct-hub.metadata.json

          # Verify only the expected files are staged — no collateral.
          staged="$(git diff --cached --name-only)"
          echo "Staged files:"
          echo "$staged"
          unexpected="$(echo "$staged" | grep -v '^launcher/dist/' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected files in staging area: $unexpected"
            exit 1
          fi

          git commit -m "chore(binary): refresh vct-launcher + vct-hub dist binaries for v${VERSION}

          Auto-committed by release workflow after successful tag build.
          Binaries: vct-launcher, vct-hub on linux-x64, windows-x64, macos-arm64.
          Source tag: v${VERSION}  Run: ${{ github.run_id }}"

          # v0.2.17 fix: race-tolerant push. The build matrix took
          # 15-20 min; main may have advanced since this job's
          # checkout. Refetch main + rebase the binary commit on top
          # so the push is always a fast-forward. Without this, a
          # commit landing on main mid-release would 403 the push
          # even with a PAT-bypass token.
          binary_sha=$(git rev-parse HEAD)
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD~1)" ]; then
            echo "::notice::main advanced during release build — rebasing binary commit"
            git reset --hard origin/main
            git cherry-pick "$binary_sha"
          fi

          # Push to main using the token configured at checkout time —
          # DIST_COMMIT_TOKEN if set (preferred for protected branches),
          # GITHUB_TOKEN otherwise. On a protected branch with neither
          # bypass_actors nor a PAT-secret-with-bypass, the push will
          # 403 with "Push declined by repository rules" — set up either
          # option per the job-level comment to unblock.
          git push origin HEAD:main

      - name: Report no-op (all binaries already up to date)
        if: steps.stage.outputs.changed == '0'
        run: echo "All dist binaries are byte-identical to HEAD — no commit needed."

  # ─────────────────────────────────────────────────────────────────────────
  # supabase-deploy
  #
  # v0.2.37 (Issue 2 fix): auto-deploy edge functions + DB migrations to the
  # canonical Supabase project on every successful release tag.
  #
  # Prior to v0.2.37 this was an entirely-manual step. The v0.2.36 release
  # shipped a launcher binary calling the `rebind-admin-token` edge
  # function, but the function itself was never deployed to Supabase prod
  # — every admin recovery request hit a 404 NOT_FOUND. The migration
  # backing the same function (`20260526_rebind_admin_machine.sql`) had to
  # be hand-pasted into the SQL editor. This job closes that gap.
  #
  # Trade-off (intentional): this job runs AFTER `build` and
  # `commit-dist-binaries` rather than as a hard pre-condition for the
  # release. Rationale: a Supabase outage / API hiccup shouldn't block a
  # launcher release that otherwise built fine. Symptom of a Supabase
  # deploy failure is a red `supabase-deploy` job in the run summary; the
  # GitHub Release is still cut and the binaries downloadable. Operators
  # fall back to the manual recipe documented in
  # `docs/operations/supabase-ci-deploy.md` § "Manual fallback".
  #
  # ⚠️  PREREQUISITES — see docs/operations/supabase-ci-deploy.md
  #
  # Required repo configuration (set ONCE per project):
  #   - Secret  SUPABASE_ACCESS_TOKEN  → Supabase user access token
  #     (https://supabase.com/dashboard/account/tokens)
  #   - Variable SUPABASE_PROJECT_REF  → 20-char project ref slug
  #     (e.g. ovpdtijpdchzlxbojhsg for the canonical orchestrator project,
  #     OR your fork's own project ref — nothing in this workflow hardcodes
  #     the canonical ref, so private forks just override this one variable)
  #
  # Required one-time human-driven migration repair (BEFORE this job will
  # succeed for the first time): see § "First-time CI setup" in
  # docs/operations/supabase-ci-deploy.md. We deliberately keep
  # `supabase migration repair` OUT of CI — it mutates the
  # schema_migrations ledger and is destructive; one-time normalization
  # belongs in a human-supervised runbook, not a recurring release job.
  #
  # Skipped (no-op) when:
  #   - workflow_dispatch input skip_supabase_deploy == true (manual override)
  #   - workflow_dispatch input skip_dist_commit == true     (dry-run signal —
  #                                                          a no-binary-commit
  #                                                          run almost certainly
  #                                                          shouldn't deploy
  #                                                          Supabase either)
  #   - The required secret is not set (warning-and-skip rather than hard-
  #     fail, so a private fork that hasn't configured Supabase yet can
  #     still ship launcher releases).
  # ─────────────────────────────────────────────────────────────────────────
  supabase-deploy:
    name: Deploy Supabase edge functions + migrations
    needs: [build, commit-dist-binaries]
    runs-on: ubuntu-latest
    # Mirror the gating used by commit-dist-binaries: only on tag pushes
    # or explicit workflow_dispatch, honouring both manual skip flags. A
    # dry-run workflow_dispatch with skip_dist_commit=true also skips
    # Supabase deploy (a dry-run shouldn't touch prod Supabase).
    if: |
      (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
      && github.event.inputs.skip_dist_commit != 'true'
      && github.event.inputs.skip_supabase_deploy != 'true'

    steps:
      # v0.2.37: early visibility on missing SUPABASE_ACCESS_TOKEN. Same
      # pattern as the DIST_COMMIT_TOKEN check above — surface the missing
      # secret BEFORE we install the CLI / link the project, with a clear
      # pointer to the setup doc. Falls back to a warning + step skip
      # (not a hard fail) so private forks that don't ship to a Supabase
      # project still get a clean release.
      - name: Check SUPABASE_ACCESS_TOKEN presence
        id: token_check
        run: |
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN secret is not set on this repo."
            echo "::warning::Skipping Supabase edge-function + migration deploy."
            echo "::warning::See docs/operations/supabase-ci-deploy.md for setup."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "SUPABASE_ACCESS_TOKEN is set — proceeding with deploy."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check SUPABASE_PROJECT_REF presence
        id: ref_check
        if: steps.token_check.outputs.skip != 'true'
        env:
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "${PROJECT_REF}" ]; then
            echo "::error::SUPABASE_PROJECT_REF repository variable is not set."
            echo "::error::Set it via: gh variable set SUPABASE_PROJECT_REF --body '<20-char-ref>'"
            echo "::error::See docs/operations/supabase-ci-deploy.md for setup."
            exit 1
          fi
          echo "SUPABASE_PROJECT_REF is set: ${PROJECT_REF}"

      - uses: actions/checkout@v6
        if: steps.token_check.outputs.skip != 'true'
        with:
          # Check out the tag's commit so the functions + migrations we
          # deploy match the binaries we just published. Unlike the
          # commit-dist-binaries job, we're not pushing back to main, so
          # the ancestry-divergence concern from v0.2.17 doesn't apply.
          fetch-depth: 1

      # Use the official Supabase setup action. Pinned to v1 — the action
      # is a thin shim that installs the latest stable CLI (or the version
      # named in the `version` input) and adds it to PATH. We deliberately
      # don't pin a CLI version: the CLI auto-updates the `schema_migrations`
      # ledger format from time to time, and pinning would freeze us on an
      # older format. If a feature in a future release of this workflow
      # needs a specific CLI version (e.g. a new flag), pin via `version:`
      # at THAT time and document the bump in docs/operations/supabase-
      # ci-deploy.md § "Known limitations".
      - name: Set up Supabase CLI
        if: steps.token_check.outputs.skip != 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Verify the CLI installed correctly. A hard fail here means the
      # upstream install action regressed — much cheaper to fail before
      # we attempt project link than to fail mid-deploy.
      - name: Verify Supabase CLI installation
        if: steps.token_check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          if ! command -v supabase >/dev/null 2>&1; then
            echo "::error::Supabase CLI not on PATH after setup-cli@v1"
            echo "::error::Check https://github.com/supabase/setup-cli for upstream status"
            exit 1
          fi
          supabase --version

      # `supabase link` writes the project ref to .supabase/temp/ inside
      # the workspace. Subsequent CLI calls in this job read that file
      # implicitly. We pass the access token via env so the link command
      # is non-interactive.
      - name: Link Supabase project
        if: steps.token_check.outputs.skip != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        working-directory: launcher/supabase
        run: |
          set -euo pipefail
          # `supabase link` exits 0 even on auth failure in some CLI
          # versions; explicit project-status probe afterward catches it.
          supabase link --project-ref "${PROJECT_REF}"
          echo "::notice::Linked to project ${PROJECT_REF}"

      # Deploy every directory under launcher/supabase/functions/ except
      # _shared (which is shared library code, not a deployable function).
      #
      # Resilience: rather than fail-fast on the first broken function,
      # we collect failures into a summary and exit non-zero at the end.
      # This way operators see EVERY function that needs attention in a
      # single CI run, not just the first.
      #
      # We do NOT pass `--no-verify-jwt`. Each function's verify_jwt
      # posture lives in launcher/supabase/config.toml — committed to
      # source-control rather than passed as a CLI flag. Future operators
      # who run a manual deploy don't have to remember the flag.
      - name: Deploy edge functions
        if: steps.token_check.outputs.skip != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        working-directory: launcher/supabase
        run: |
          set -uo pipefail
          # set -e disabled intentionally — we want to attempt every
          # function before failing the job.

          declare -a failed=()
          declare -a deployed=()

          if [ ! -d functions ]; then
            echo "::warning::No launcher/supabase/functions/ directory found — skipping."
            exit 0
          fi

          for fn_dir in functions/*/; do
            fn_name="$(basename "$fn_dir")"
            # _shared is library code (Deno modules imported by the
            # actual functions). It has no top-level `index.ts` entry
            # point and `supabase functions deploy _shared` would 400.
            if [ "$fn_name" = "_shared" ]; then
              echo "::group::Skipping _shared (library code, not a deployable function)"
              echo "::endgroup::"
              continue
            fi
            # Sanity: a function dir without an index.ts isn't deployable.
            # Surface this as a warning rather than a hard fail — the
            # legit case is `mkdir -p functions/new-fn/` committed before
            # the index.ts lands in a follow-up PR.
            if [ ! -f "${fn_dir}index.ts" ]; then
              echo "::warning::${fn_name} has no index.ts — skipping deploy."
              continue
            fi

            echo "::group::Deploying ${fn_name}"
            if supabase functions deploy "${fn_name}" --project-ref "${PROJECT_REF}"; then
              echo "✓ ${fn_name} deployed"
              deployed+=("${fn_name}")
            else
              echo "::error::Failed to deploy ${fn_name}"
              failed+=("${fn_name}")
            fi
            echo "::endgroup::"
          done

          echo ""
          echo "Deploy summary:"
          echo "  ✓ deployed: ${#deployed[@]} function(s): ${deployed[*]:-<none>}"
          echo "  ✗ failed:   ${#failed[@]} function(s): ${failed[*]:-<none>}"

          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::One or more edge functions failed to deploy: ${failed[*]}"
            echo "::error::See docs/operations/supabase-ci-deploy.md § 'Manual fallback' for recovery."
            exit 1
          fi

      # Apply any net-new migrations under launcher/supabase/migrations/.
      # `supabase db push` skips migrations already recorded in the
      # remote schema_migrations ledger, so re-running this on a project
      # that's already in sync is a clean no-op.
      #
      # `--include-all` ensures the CLI doesn't ask for confirmation on
      # files past a certain age (some CLI versions warn on > 1-month-old
      # migrations and require an interactive prompt). CI is non-
      # interactive, so we accept all.
      #
      # FIRST-RUN FAILURE MODE: if the operator hasn't run the one-time
      # migration-history reconciliation (see docs/operations/
      # supabase-ci-deploy.md § "First-time CI setup"), this step exits
      # non-zero with:
      #   "Remote migration versions not found in local migrations directory."
      # That's working as designed — the docs walk the operator through
      # the one-shot `supabase migration repair` + `supabase db pull`
      # flow that resolves it.
      - name: Apply migrations
        if: steps.token_check.outputs.skip != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        working-directory: launcher/supabase
        run: |
          set -euo pipefail
          # `supabase db push` against a linked project with a clean
          # ledger is idempotent — applies only net-new migrations.
          # `--include-all` skips age-based confirmation prompts.
          if ! supabase db push --include-all; then
            echo "::error::supabase db push failed."
            echo "::error::If this is the FIRST CI deploy against this project, you likely"
            echo "::error::need to run the one-time migration-history reconciliation FIRST."
            echo "::error::See docs/operations/supabase-ci-deploy.md § 'First-time CI setup'."
            exit 1
          fi
          echo "::notice::Migrations applied (or no net-new migrations to apply)."

      # Final summary step. Runs even on partial failure (the deploy +
      # migrate steps above use `exit 1` which terminates the job before
      # reaching here on hard fail — this step only runs on the success
      # path or the no-secret-skip path).
      - name: Summary
        if: always() && steps.token_check.outputs.skip != 'true'
        run: |
          echo "Supabase deploy job complete for tag/run: ${{ github.ref }}"
          echo "Project ref: ${{ vars.SUPABASE_PROJECT_REF }}"

      - name: Summary (skipped)
        if: steps.token_check.outputs.skip == 'true'
        run: |
          echo "Supabase deploy SKIPPED (no SUPABASE_ACCESS_TOKEN configured)."
          echo "This is expected on forks that don't ship to a Supabase project."
          echo "See docs/operations/supabase-ci-deploy.md to enable."
