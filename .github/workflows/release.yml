# Release workflow — multi-OS shipping.
#
# Triggers:
#   - Tag push matching v*.*.* (e.g. v0.1.0) → cuts a GitHub Release.
#   - Manual workflow_dispatch → useful for dry-runs / re-cutting artifacts.
#
# What we ship per OS (v0.1.5 matrix):
#   - Linux x64 (ubuntu-latest):    vct-launcher          + .metadata.json
#   - Windows x64 (windows-latest): vct-launcher.exe      + .metadata.json
#   - macOS arm64 (macos-latest):   vct-launcher          + .metadata.json
#   - macOS x64 (macos-13):         vct-launcher          + .metadata.json
#
# macOS UNSIGNED — Apple Developer ID + notarization deferred
# (Tier-2 alpha, see QuickStart). First-launch users will see a
# Gatekeeper "unidentified developer" dialog; right-click → Open
# bypasses it. README + QuickStart already disclose this. Code
# signing tracked separately for v0.2.x.
#
# Build is driven by `bash scripts/build-bundled-launcher.sh` — the
# SAME script maintainers run locally. It does:
#   1. npm/pnpm install + run build (SvelteKit frontend) — explicit, NOT
#      relying on Tauri's beforeBuildCommand which has silently no-op'd
#      under mismatched package managers.
#   2. tauri build --no-bundle (we ship the raw binary, not installers).
#   3. POST-BUILD asset-ref check — refuses to stage a binary with <5
#      `_app/immutable/` refs (catches the "Could not connect to
#      localhost" empty-frontend regression class).
#   4. Stage to launcher/dist/<host_target>/<binary> + .metadata.json
#      (source_sha, source_hash, built_at, launcher_version, etc.).
# Reusing the script keeps CI and local builds bit-identical and means
# the embedded-frontend safety check ALSO runs in CI — not just locally.
#
# Code signing (Windows AuthentiCode + Apple Developer ID) is OUT OF
# SCOPE for v0.1.0. Tracked separately for v0.1.1.

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write       # needed to attach artifacts to the release
  id-token: write       # needed to mint Sigstore OIDC token for attestation
  attestations: write   # needed to publish the SLSA provenance attestation

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            binary: vct-launcher
          - os: windows-latest
            target: windows-x64
            binary: vct-launcher.exe
          # macOS Apple Silicon (M1/M2/M3). `macos-latest` defaults to ARM
          # since the GitHub-hosted runner image transition (Sept 2024+).
          - os: macos-latest
            target: macos-arm64
            binary: vct-launcher
          # macOS Intel. macos-13 is the last x86_64 runner image — newer
          # macos-14/-15 are ARM-only. Drop this entry once Intel users
          # are below a usable cohort threshold.
          - os: macos-13
            target: macos-x64
            binary: vct-launcher

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri

      # Tauri 2 Linux build deps. Mirror the set in scripts/build-bundled-launcher.sh
      # docs and ci.yml so a CI failure here matches what a contributor would
      # hit running the script on a fresh Ubuntu box. `build-essential`,
      # `curl`, `wget`, `file` are required by Tauri's bundler chain even
      # under --no-bundle (file is used for ELF detection).
      - name: Install Tauri Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file

      # Single source of truth: same script maintainers run locally.
      # Bash is the shell on all runners — Git Bash on windows-latest is
      # preinstalled. The script auto-detects host arch but accepts a
      # `BUILD_TARGET` override so CI can pin the canonical dist subdir
      # name (matters for macOS where local builds use the legacy
      # `experimental_macOS` slot but CI ships `macos-arm64`/`macos-x64`).
      - name: Build launcher (bundled script)
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: bash scripts/build-bundled-launcher.sh

      # Sanity-check that the staged artifacts exist before upload, so a
      # silent build-script change can't produce a release with empty
      # assets. Listing also surfaces sizes in the run log.
      - name: Verify staged artifacts
        shell: bash
        run: |
          set -euo pipefail
          dist="launcher/dist/${{ matrix.target }}"
          if [ ! -f "$dist/${{ matrix.binary }}" ]; then
            echo "::error::Expected $dist/${{ matrix.binary }} not found"
            ls -la "$dist" || true
            exit 1
          fi
          if [ ! -f "$dist/${{ matrix.binary }}.metadata.json" ]; then
            echo "::error::Expected $dist/${{ matrix.binary }}.metadata.json not found"
            ls -la "$dist" || true
            exit 1
          fi
          ls -lh "$dist"

      # macOS artifacts are flagged with the `-experimental` suffix in their
      # filename so users browsing the GitHub Release sidebar see the tier
      # marker before downloading. Apple Developer ID code-signing +
      # notarization are deferred to v0.2.x; until then macOS users will
      # hit Gatekeeper. Done BEFORE attestation so SLSA provenance binds
      # to the user-visible filename (so `gh attestation verify
      # vct-launcher-macos-arm64-experimental` works).
      - name: Stage release artifact (rename macOS to -experimental)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          dist="launcher/dist/${{ matrix.target }}"
          stage="$dist/_release"
          mkdir -p "$stage"
          case "${{ matrix.target }}" in
            macos-arm64|macos-x64)
              cp "$dist/${{ matrix.binary }}" "$stage/vct-launcher-${{ matrix.target }}-experimental"
              cp "$dist/${{ matrix.binary }}.metadata.json" "$stage/vct-launcher-${{ matrix.target }}-experimental.metadata.json"
              ;;
            *)
              cp "$dist/${{ matrix.binary }}" "$stage/${{ matrix.binary }}"
              cp "$dist/${{ matrix.binary }}.metadata.json" "$stage/${{ matrix.binary }}.metadata.json"
              ;;
          esac
          ls -lh "$stage"

      # SLSA build provenance attestation. Generates a Sigstore-signed
      # in-toto provenance predicate (SLSA Build Level 2 by default on
      # GitHub-hosted runners) for the launcher binary. End users can
      # verify the binary really came from this workflow on this commit
      # with `gh attestation verify <binary> --repo hotak92/vibecoded-orchestrator`.
      # Runs only on tagged releases — workflow_dispatch dry-runs skip
      # attestation since there's nothing to publish provenance for.
      # Subject path resolution: macOS jobs attest the renamed
      # `-experimental` binary, others attest the canonical filename.
      - name: Generate build provenance attestation
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: launcher/dist/${{ matrix.target }}/_release/${{ (startsWith(matrix.target, 'macos-')) && format('vct-launcher-{0}-experimental', matrix.target) || matrix.binary }}

      # Upload the binary + metadata as Release assets. softprops/action-gh-release@v3
      # auto-creates the release on tag push if it doesn't exist yet, and
      # is a no-op for workflow_dispatch runs without a tag (files still
      # show up as workflow artifacts via the separate upload-artifact
      # step below — useful for dry-runs).
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            launcher/dist/${{ matrix.target }}/_release/*

      # Always upload as workflow artifacts too — lets workflow_dispatch
      # runs (no tag) still produce downloadable binaries for QA.
      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: vct-launcher-${{ matrix.target }}
          path: |
            launcher/dist/${{ matrix.target }}/${{ matrix.binary }}
            launcher/dist/${{ matrix.target }}/${{ matrix.binary }}.metadata.json
          if-no-files-found: error
