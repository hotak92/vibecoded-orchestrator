# Intentionally minimal CI. Three independent matrices:
#   - rust:     library tests for the Tauri backend (no full bundle build —
#               that needs platform-specific deps and is slow; we add it
#               later when releases need a per-OS matrix).
#   - python:   the trust-critical helpers (license validator, telemetry
#               PII scrub + consent gating, install-flow detection) —
#               73+ tests.
#   - frontend: svelte-check (type-check) + vitest unit tests (v0.2.67:
#               wired in so the frontend store / status-display tests
#               actually gate). tauri:dev / tauri:build are heavy and will
#               graduate to a separate workflow when the launcher gets
#               release tags.
#
# v0.2.30: skip CI on PURE-DOCS changes only (paths-ignore below).
# Pre-v0.2.30 policy was "always run CI" with this comment: "tests are
# fast and the false-confidence risk of 'I only changed README'
# outweighs the minutes saved". That held when CI ran in ~3 min total.
# Post-v0.2.21 the matrix grew (Rust + Python + Frontend + leak-check +
# managed-paths) and a docs-only push now burns ~10-12 min of runner
# time for zero signal value. paths-ignore restores the cost/benefit
# for genuinely doc-only paths.
#
# CRITICAL — what's NOT in the ignore list (and why):
#   - `**.md` globally → NO. Many .md files are functional, not docs:
#     * `templates/agents/**/*.md` + `templates/skills/**/SKILL.md` —
#       their YAML frontmatter is PARSED by the keyword-suggest hook
#       and validated by `tests/test_keyword_match.py`. A keyword
#       rollout (e.g. PR #259) must trigger CI.
#     * `CLAUDE.md` — affects Claude Code behavior in every install.
#     * `launcher/**/*.md` — sometimes contains subtree migration notes
#       that touch the launcher binary path.
#     * `internal/**/*.md` — release notes that may reference packaging
#       details still under test.
#   - `templates/**` globally → NO. Templates are SHIPPED CODE
#     (hooks, scripts, settings.json, agents, skills). Every change
#     needs CI.
#   - `.claude/agents/` or `.claude/skills/` or `.claude/hooks/` → NO.
#     Same as templates/.
#
# Pure-docs paths that ARE ignored:
#   - `knowledge/**` — per-project KG nodes (orchestrator's own
#     knowledge graph; not consumed by tests)
#   - `docs/**` — user-facing markdown documentation
#   - `.claude/context/**` — plans, handoffs, scratch notes
#   - `README.md` — repo-level README only (top-level)
#   - `CHANGELOG.md` — narrative release notes
#   - `LICENSE`, `LICENSE.*`, `CODE_OF_CONDUCT.md`, `CONTRIBUTING.md`,
#     `SECURITY.md`, `CLA.md`, `BOOTSTRAP.md`, `KNOWN_ISSUES.md` —
#     governance / community docs at repo root
#   - `.github/ISSUE_TEMPLATE/**`, `.github/PULL_REQUEST_TEMPLATE.md`,
#     `.github/FUNDING.yml`, `.github/CODEOWNERS` — meta-config that
#     never affects test outcomes
#
# CodeQL and Hook-Parity workflows mirror this exact ignore list. The
# Release workflow runs on tag push — no paths optimization possible.
#
# If a future test exercises any path currently in the ignore list,
# REMOVE that specific entry — don't remove paths-ignore wholesale.

name: CI

on:
  push:
    # v0.2.42: include release/** so the pre-release-gate (CI-6, W7)
    # can verify CI on the release branch BEFORE merging to main. Branch
    # protection requires CI green on the target SHA; without this filter,
    # release/v0.2.x → main merges are blocked because CI never ran on
    # the branch.
    branches: [main, "release/**"]
    paths-ignore:
      - 'knowledge/**'
      - 'docs/**'
      - '.claude/context/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'LICENSE.*'
      - 'CODE_OF_CONDUCT.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'CLA.md'
      - 'BOOTSTRAP.md'
      - 'KNOWN_ISSUES.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/FUNDING.yml'
      - '.github/CODEOWNERS'
      # CI-7 (v0.2.42): the release.yml binary-refresh commit touches only
      # launcher/dist/ — no source code changed, no test value in running CI.
      # Adding the path here is cleaner than appending [skip ci] to every
      # release binary-commit message (which would require touching release.yml
      # and is harder to audit).
      - 'launcher/dist/**'
  pull_request:
    paths-ignore:
      - 'knowledge/**'
      - 'docs/**'
      - '.claude/context/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'LICENSE.*'
      - 'CODE_OF_CONDUCT.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'CLA.md'
      - 'BOOTSTRAP.md'
      - 'KNOWN_ISSUES.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/FUNDING.yml'
      - '.github/CODEOWNERS'
      # CI-7 (v0.2.42): binary-dist-only changes don't need CI.
      - 'launcher/dist/**'

permissions:
  contents: read

# Cancel previous runs on the same branch when a new commit is pushed.
# Saves CI minutes on iteration-heavy PRs (typical: 3-4 commits in 5 min →
# 3 redundant runs canceled). Only cancel on pull_request events; pushes
# to main run to completion. Pre-fork audit item #4 (2026-05-08).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust (cargo test --lib)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri
      # Tauri 2 dev deps for cargo build/test on Linux runners.
      - name: Install Tauri Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev
      # 2026-05-13 (post-SIGTRAP audit): run launcher tests
      # single-threaded. The launcher's keychain-touching tests
      # overwhelmed gnome-keyring-daemon under parallel execution on
      # local workstations (observed crashes 2026-05-08, 2026-05-13).
      # GitHub's ubuntu-latest runner uses an ephemeral keychain that
      # didn't reproduce the crash, but the underlying contention is
      # the same — single-threaded execution is cheap insurance and
      # eliminates the entire class of "keychain-induced flake" CI
      # failures. See scripts/test-keychain-safe.sh for the threat
      # model and crate::secrets's module-level docs.
      #
      # v0.2.54 Track E (P0-1): the script now runs
      # `cargo test --workspace --tests`, covering all 4 workspace
      # members (vct-launcher-temp, vct-launcher-core, vct-hub,
      # vct-updater) — pre-Track-E this was `--lib` against the root
      # crate only, so 3 of 4 crates' tests never ran in CI. See the
      # script header for the retry-policy decision on adopt_populated.
      - name: cargo test --workspace --tests (keychain-safe wrapper)
        run: bash scripts/test-keychain-safe.sh

      # v0.2.54 Track E (P0-1): vct-cli is a SEPARATE Cargo workspace
      # at launcher/tools/vct-cli/Cargo.toml (not a member of the main
      # workspace, per its package = "vct-cli" line). Its tests would
      # not be picked up by the --workspace run above. Run them
      # explicitly here. Single-threaded for parity with the main run
      # (the CLI doesn't touch the keychain, but consistency is cheap).
      - name: cargo test (vct-cli sub-workspace)
        run: |
          cargo test --tests \
            --manifest-path launcher/tools/vct-cli/Cargo.toml \
            -- --test-threads=1

  managed-paths-cross-language:
    name: Managed-paths cross-language consistency
    runs-on: ubuntu-latest
    needs: rust
    # Closes follow-up #5. The third edge of the consistency triangle:
    # parses `orchestrator-managed-paths.txt` from BOTH a standalone
    # Python re-implementation AND the Rust binary, then diffs the
    # outputs. Catches the failure mode where each language's per-test
    # EXPECTED literal is wrong but matches its own parser
    # (separate per-language tests don't catch that — they only check
    # parser-vs-EXPECTED, not parser-vs-parser).
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Tauri Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev
      - name: Run cross-language parse + diff
        run: bash .github/scripts/check_managed_paths_cross_language.sh

  python:
    name: Python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest
      - name: pytest
        run: pytest tests/ -q

  python-typecheck:
    name: Python (pyright)
    runs-on: ubuntu-latest
    # Pre-fork audit item #18: pyright was already pinned in
    # requirements-dev.txt + run by the postToolUse hook locally, but no
    # CI gate caught type regressions slipping in via PR. This job
    # closes that gap.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: pyright
        # v0.2.54 Track E (Theme 6): removed the `|| true` swallow that
        # made this job always-green. `--warnings` mode already reports
        # WITHOUT exit-1 on warnings (only errors fail), so the swallow
        # was redundant for warnings AND was actively hiding genuine
        # type errors.
        #
        # v0.2.54 Track E amendment: scope comes from the repo-root
        # `pyrightconfig.json` — vco_lib/ + claude_mcp_servers/
        # {weaviate_mcp,search_mcp}/ are gated at ZERO errors (repo-wide
        # had 813 pre-existing errors across 429 files, which is why the
        # old swallow existed). Two backlog files are out of scope until
        # v0.2.55: weaviate_mcp/server.py (93 errors) and install.py
        # (34 errors) — counts + rationale in pyrightconfig.json and
        # CHANGELOG. If your PR adds a NEW type error in scope, fix it
        # or annotate the line with `# pyright: ignore[<rule>]` plus a
        # rationale comment. Do NOT re-add `|| true`.
        run: |
          pyright --warnings

  frontend:
    name: Frontend (svelte-check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - name: npm ci
        run: npm ci
      - name: npm run check
        run: npm run check
      - name: npm test (vitest)
        run: npm test

  # PR-4 (2026-05-06): regression guard for the audit class
  # "developer machine paths leak into shipped launcher binary".
  # Builds the launcher in release mode (no bundle, just the
  # raw binary — same `cargo build --release --bin` invocation
  # the bundle script ultimately runs), then `strings`-greps
  # the result for personal-username-shaped paths.
  #
  # Allowed paths in the binary:
  #   /home/runner/...      ← GitHub-hosted Linux runners
  #   /Users/runner/...     ← GitHub-hosted macOS runners
  #   C:\Users\runneradmin\... ← GitHub-hosted Windows runners
  #     (we don't run this job on Windows yet — Linux suffices
  #     for the leak class because Cargo.toml + .cargo/config.toml
  #     apply uniformly across hosts; Windows leak surface is
  #     covered by the same flags + `strip`.)
  #
  # Disallowed: any /home/<other-username>/... or /Users/... or
  # C:\Users\... that references a real developer's name.
  #
  # The grep is intentionally conservative: it triggers only on
  # path-shaped strings starting with the exact user-directory
  # prefix and containing a username segment that ISN'T `runner`.
  # If a future GH-hosted runner image starts using a different
  # generic username, add it to the allowlist below.
  launcher-leak-check:
    name: Launcher binary leak-check
    runs-on: ubuntu-latest
    needs: rust    # don't waste minutes if cargo test failed
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri

      - name: Install Tauri Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      # Build the binary directly via cargo (no tauri bundle, no
      # frontend embedding). Skipping the bundle skips the
      # SvelteKit frontend build — that's intentional for this
      # job because the leak class is in the Rust binary's path
      # rodata, not in the embedded frontend assets.
      #
      # We DO export RUSTFLAGS to add the host-specific
      # username remap on top of the .cargo/config.toml
      # generic-prefix remaps. On GH-hosted runners $HOME =
      # /home/runner so the remap rewrites it to <home>; on a
      # contributor's local cargo run the same env-var pattern
      # rewrites their personal home dir. See
      # `launcher/src-tauri/.cargo/config.toml` for the
      # full two-layer strategy.
      #
      # v0.2.54 Track E (Theme 6): the previous `${{ env.HOME }}`
      # GitHub-expression resolved to the workflow's top-level `env:`
      # block (none defined → empty string), NOT to the runner's
      # shell `$HOME`. The result was a silent no-op remap like
      # `--remap-path-prefix==<home>` that effectively did nothing.
      # Fixed by computing the remap arguments in a shell step that
      # reads `$HOME` from the runtime environment, then exporting
      # RUSTFLAGS into the next step via GITHUB_ENV. Reference:
      # https://docs.github.com/en/actions/learn-github-actions/variables#default-environment-variables
      - name: Resolve RUSTFLAGS for path remapping
        run: |
          set -euo pipefail
          # $HOME is /home/runner on GitHub-hosted Linux runners.
          # The remap rewrites both the home root AND .cargo subdir,
          # matching the two-layer strategy in
          # launcher/src-tauri/.cargo/config.toml.
          remap_flags="--remap-path-prefix=${HOME}=<home> --remap-path-prefix=${HOME}/.cargo=<cargo>"
          echo "RUSTFLAGS=${remap_flags}" >> "$GITHUB_ENV"
          echo "Resolved RUSTFLAGS: ${remap_flags}"

      - name: cargo build --release (no bundle)
        run: |
          cargo build --release \
            --bin vct-launcher-temp \
            --manifest-path launcher/src-tauri/Cargo.toml

      # The actual leak-check. Three independent greps, each
      # with its own allowlist. Anything matched outside the
      # allowlist fails the job.
      #
      # Why three greps not one regex: easier to read in CI
      # logs (failures point at one OS class), and easier to
      # extend without nested-group escaping nightmares.
      - name: Verify no developer paths in release binary
        run: |
          set -euo pipefail
          BIN=launcher/src-tauri/target/release/vct-launcher-temp
          if [ ! -f "$BIN" ]; then
            echo "::error::Expected $BIN not found"
            exit 1
          fi

          fail=0

          echo "::group::Linux home paths"
          # /home/<user>/... where <user> != runner.
          if strings "$BIN" \
              | grep -E '^/home/[^/]+/' \
              | grep -vE '^/home/runner(/|$)' \
              | head -10
          then
            echo "::error::Found /home/<user>/... paths in $BIN (not /home/runner)."
            echo "         strip = \"symbols\" + .cargo/config.toml remaps should have caught these."
            echo "         If a new GH-runner username is in use, add it to the allowlist in this job."
            fail=1
          else
            echo "OK — no leaking /home/<user>/ paths"
          fi
          echo "::endgroup::"

          echo "::group::macOS home paths"
          if strings "$BIN" \
              | grep -E '^/Users/[^/]+/' \
              | grep -vE '^/Users/runner(/|$)' \
              | head -10
          then
            echo "::error::Found /Users/<user>/... paths in $BIN (not /Users/runner)."
            fail=1
          else
            echo "OK — no leaking /Users/<user>/ paths"
          fi
          echo "::endgroup::"

          echo "::group::Windows home paths"
          # `strings` finds backslash-pathed strings on a Linux
          # binary too (rustc embeds Windows-flavored paths
          # whenever a Windows-targeted dep ships pre-baked
          # debug info in its source crate). Grep both forms.
          if strings "$BIN" \
              | grep -E '(^|[[:space:]])C:\\Users\\[^\\]+\\' \
              | grep -vE 'C:\\Users\\runneradmin\\' \
              | head -10
          then
            echo "::error::Found C:\\Users\\<user>\\... paths in $BIN (not runneradmin)."
            fail=1
          else
            echo "OK — no leaking C:\\Users\\<user>\\ paths"
          fi
          echo "::endgroup::"

          if [ "$fail" -ne 0 ]; then
            echo "::error::Launcher leak-check FAILED. See groups above for the leaking paths."
            echo "         Fix: ensure RUSTFLAGS in this job and"
            echo "         launcher/src-tauri/.cargo/config.toml are still applied."
            echo "         See docs/REPO_CLEANLINESS.md §5."
            exit 1
          fi
          echo "Launcher leak-check passed."

  # v0.2.54 Track E (Theme 6 + P0-8): tree-scanning leak gates.
  #
  # Pre-Track-E, the secrets-scan + pre-tag-privacy scripts existed but
  # were registered in ZERO workflows — they only ran when invoked
  # manually (git pre-commit hook, or scripts/pre-ship-check.sh). That
  # meant a PR could land with a leaked token or personal-machine path
  # reference and nothing in CI would catch it.
  #
  # This job runs both scripts on every push/PR so the tree is gated
  # against the patterns documented inside each script (see the
  # `BLOCKLIST` array + Track C/D pattern lists in the script sources).
  # Categories covered: historical-leak tokens, personal-project name
  # references, hostname + author-machine path leaks.
  #
  # No needs:[] dependency — leak detection is cheap and parallelizable
  # with the heavier rust/python/frontend jobs above.
  leak-gates:
    name: Repo-tree leak gates (no-secrets + pre-tag-privacy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Privacy gate uses `git ls-tree` against HEAD; full history
          # not needed. The leak grep scans tracked files only.
          fetch-depth: 1

      # The secrets gate (--all scans the full tracked tree, including
      # docs + tests, against the historical-leak blocklist). Self-
      # excludes the script itself + CHANGELOG.md (historical narrative
      # may legitimately name past tokens for documentation).
      - name: check-no-secrets.sh (--all)
        run: bash scripts/check-no-secrets.sh --all

      # The pre-tag privacy gate exits 1 on any pattern hit outside the
      # documented sentinels (tests/test_launcher_leak_grep.py +
      # scripts/check-install.sh + docs/REPO_CLEANLINESS.md + pyproject).
      # Per Track C / D pattern docs in the script itself.
      - name: check-pre-tag-privacy.sh
        run: bash scripts/check-pre-tag-privacy.sh

  version-pins:
    name: Version-pin consistency (no cross-file drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Pin check reads tracked manifests only; no history needed.
          fetch-depth: 1

      # v0.2.57: enforce the single-version-source guarantee on EVERY
      # push/PR, not just at release time. Before v0.2.57 the orchestrator
      # version was hand-maintained in ~9 files; they silently drifted
      # (the vct-hub crate sat at 0.2.54 while the launcher shipped 0.2.56,
      # so the hub's /health reported the wrong version). This fast (~1s,
      # no build/test) gate asserts every literal pin agrees with
      # pyproject.toml AND that the workspace-inheriting Rust crates still
      # use `version.workspace = true` (no resurrected per-crate literal).
      # Fix on failure: `scripts/bump-version.sh <X.Y.Z>` bumps all pins
      # from one command. (`pre-ship-check.sh` runs the same logic at
      # release time via the shared `vcheck_run_pins` helper.)
      - name: check-version-pins.sh
        run: bash scripts/check-version-pins.sh
