# Intentionally minimal CI. Three independent matrices:
#   - rust:     library tests for the Tauri backend (no full bundle build —
#               that needs platform-specific deps and is slow; we add it
#               later when releases need a per-OS matrix).
#   - python:   the trust-critical helpers (license validator, telemetry
#               PII scrub + consent gating, install-flow detection) —
#               73+ tests.
#   - frontend: svelte-check (type-check) only. Frontend has no runtime
#               unit tests yet; tauri:dev / tauri:build are heavy and will
#               graduate to a separate workflow when the launcher gets
#               release tags.
#
# We intentionally do NOT skip CI on docs-only PRs; tests are fast and
# the false-confidence risk of "I only changed README" outweighs the
# minutes saved.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (cargo test --lib)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri
      # Tauri 2 dev deps for cargo build/test on Linux runners.
      - name: Install Tauri Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev
      - name: cargo test --lib
        run: cargo test --lib --manifest-path launcher/src-tauri/Cargo.toml

  python:
    name: Python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest
      - name: pytest
        run: pytest tests/ -q

  frontend:
    name: Frontend (svelte-check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - name: npm ci
        run: npm ci
      - name: npm run check
        run: npm run check
