# v0.2.75 RL-13 — live image-variant smoke for the RL Reranker container.
#
# WHY THIS EXISTS
# The v0.2.72 supervisor fix made image resolution variant-aware
# (`resolve_variant_tag`: `{version}-cpu` / `-cuda` / `-rocm` per the
# manifest's `gpu_image_variants`), but no live smoke ever started a
# variant-resolved image and confirmed the container can reach the hub
# (RL audit item RL-13; the v0.2.75 Part-4 supervisor-conditional
# bind-widen — `resolve_hub_bind_ip` / `VCT_HUB_BIND_ALL` — is what makes
# container→hub reach passable on default installs).
#
# v0.2.106: the RL reranker ships IN this repository
# (`claude_mcp_servers/rl_reranker`) and its image is BUILT LOCALLY by the
# launcher (`install.method = "container_build"`) — there is no private
# registry image and no credential any more. So this smoke now builds the
# CPU variant from the checkout exactly as the launcher does (same
# Dockerfile, same `VARIANT` build arg, same `localhost/vco-rl-reranker:
# <version>-cpu` tag), starts it, checks it reports its weights state on
# /health, and checks container→hub reach. GitHub runners have no GPU, so
# the variant a real supervisor would resolve here IS `-cpu`.
#
# Trigger: manual (workflow_dispatch) only — the build downloads the CPU
# PyTorch wheel; there is no point burning minutes per push.

name: RL Image Variant Smoke

on:
  workflow_dispatch:

jobs:
  variant-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri

      - name: Resolve the image tag from the shipped manifest
        run: |
          set -euo pipefail
          VERSION="$(python3 -c "import json; print(json.load(open('claude_mcp_servers/rl_reranker/vct-module.json'))['version'])")"
          IMAGE="$(python3 -c "import json; print(json.load(open('claude_mcp_servers/rl_reranker/vct-module.json'))['install']['container']['image'])")"
          echo "IMAGE_REF=${IMAGE}:${VERSION}-cpu" >> "$GITHUB_ENV"

      - name: Build the CPU variant from the checkout (as the launcher does)
        run: |
          set -euo pipefail
          docker build --build-arg VARIANT=cpu \
            --file claude_mcp_servers/rl_reranker/Dockerfile --tag "$IMAGE_REF" .

      - name: Build vct-hub
        working-directory: launcher/src-tauri
        run: cargo build --release -p vct-hub

      - name: Start vct-hub (bind-widened for container reach)
        run: |
          set -euo pipefail
          export VCT_STATE_DIR="$RUNNER_TEMP/vct-smoke"
          mkdir -p "$VCT_STATE_DIR"
          echo "VCT_STATE_DIR=$VCT_STATE_DIR" >> "$GITHUB_ENV"
          # VCT_HUB_BIND_ALL=1: the explicit env opt-in half of the Part-4
          # bind decision (a real install widens automatically once a
          # hub-consuming module install row exists; CI has no launcher.db
          # module rows, so we opt in explicitly).
          VCT_HUB_BIND_ALL=1 nohup ./launcher/src-tauri/target/release/vct-hub --foreground \
            > "$RUNNER_TEMP/vct-hub.log" 2>&1 &
          # Wait for the discovery files (written after a successful bind).
          for i in $(seq 1 30); do
            [ -s "$VCT_STATE_DIR/hub.port" ] && [ -s "$VCT_STATE_DIR/hub.token" ] && break
            sleep 1
          done
          test -s "$VCT_STATE_DIR/hub.port" || { echo "hub failed to start"; cat "$RUNNER_TEMP/vct-hub.log"; exit 1; }
          HUB_PORT="$(cat "$VCT_STATE_DIR/hub.port")"
          echo "HUB_PORT=$HUB_PORT" >> "$GITHUB_ENV"
          # Host-side sanity before involving the container at all.
          curl -fsS "http://127.0.0.1:${HUB_PORT}/api/v1/health"

      - name: Start container + smoke /health and container→hub reach
        run: |
          set -euo pipefail
          # host-gateway maps host.containers.internal (the podman-style
          # name the supervisor injects into module env) onto the runner's
          # docker bridge gateway — same reachability shape a default
          # install has after the bind-widen.
          docker run -d --name rl-smoke \
            --add-host host.containers.internal:host-gateway \
            -e ACTIVE_EMBEDDING=qwen3 \
            -e PYTHONUNBUFFERED=1 \
            "$IMAGE_REF"
          # The image must actually boot (not crash-loop on defaults).
          for i in $(seq 1 30); do
            state="$(docker inspect -f '{{.State.Status}}' rl-smoke)"
            [ "$state" = "running" ] || { echo "container state=$state"; docker logs rl-smoke; exit 1; }
            sleep 1
          done

          # 0. The server reports its weights state: `trained` is a bool and
          #    `weights.bundled_version` matches the shipped manifest.
          docker exec rl-smoke python3 -c "
          import json, sys, urllib.request
          from rl_reranker.bundled_weights import resolve_bundled_weights
          with urllib.request.urlopen('http://127.0.0.1:11450/health', timeout=10) as r:
              h = json.load(r)
          shipped = resolve_bundled_weights('/app/weights', 'qwen3')
          assert isinstance(h['trained'], bool), h
          assert h['weights']['bundled_version'] == (shipped.version if shipped else None), h
          print('health:', h['model'], h['weights'])
          "

          HUB_TOKEN="$(cat "$VCT_STATE_DIR/hub.token")"
          # 1. Unauthenticated liveness: /api/v1/health.
          docker exec rl-smoke python3 -c "
          import urllib.request, sys
          url = 'http://host.containers.internal:${HUB_PORT}/api/v1/health'
          with urllib.request.urlopen(url, timeout=10) as r:
              sys.exit(0 if r.status == 200 else 1)
          "
          # 2. One bearer-authed route: /api/v1/services/status must be 200
          #    WITH the token and 401 WITHOUT it (proves auth is enforced
          #    across the widened bind, not just reachable).
          docker exec -e HUB_TOKEN="$HUB_TOKEN" rl-smoke python3 -c "
          import urllib.request, urllib.error, os, sys
          base = 'http://host.containers.internal:${HUB_PORT}/api/v1/services/status'
          req = urllib.request.Request(base, headers={'Authorization': 'Bearer ' + os.environ['HUB_TOKEN']})
          with urllib.request.urlopen(req, timeout=10) as r:
              assert r.status == 200, r.status
          try:
              urllib.request.urlopen(urllib.request.Request(base), timeout=10)
          except urllib.error.HTTPError as e:
              sys.exit(0 if e.code == 401 else 1)
          sys.exit(1)  # unauthenticated request must NOT succeed
          "
          echo "health + container→hub reach + auth gate: OK"

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "── vct-hub.log ──"; cat "$RUNNER_TEMP/vct-hub.log" || true
          echo "── container logs ──"; docker logs rl-smoke || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f rl-smoke >/dev/null 2>&1 || true
