name: Dependabot auto-merge

# Auto-merges Dependabot PRs that pass CI:
#   - patch & minor → auto-merge (squash)
#   - major         → leave open for human review
#
# SAFETY: triggers only on PRs authored by github-actions' dependabot[bot].
# PRs from human authors (hotak92, pb992, etc.) are never touched — the
# `if: github.actor == 'dependabot[bot]'` guard short-circuits before any
# step runs. Branch names alone aren't trusted; the actor check is what
# enforces the boundary.

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # v0.2.94: this step used to FAIL on every Dependabot PR because the
      # repository deliberately keeps `allow_auto_merge` OFF (owner ruling,
      # 2026-09-10: Dependabot PRs are suggestions, never obligations, and
      # nothing merges without a human). A workflow that is red by policy
      # is noise that hides real reds. So: ask the repository first; when
      # auto-merge is allowed, request it; when it is not, say so and
      # succeed. The step never blocks anything either way.
      - name: Request auto-merge for patch & minor (no-op when the repo disallows it)
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: |
          set -euo pipefail
          allowed="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.allow_auto_merge')"
          if [ "$allowed" = "true" ]; then
            gh pr merge --auto --squash "$PR_URL"
            echo "::notice::auto-merge requested for $PR_URL (merges when required checks pass)"
          else
            echo "::notice::allow_auto_merge is false on ${GITHUB_REPOSITORY} by owner policy — leaving $PR_URL for human review (this is not a failure)"
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
