# v0.2.38 A5 + v0.2.40 X2 — End-to-end install smoke test (cross-OS).
#
# Catches the F1-F5 class of install-pipeline regressions (identified in
# docs/audits/install-update-audit-2026-05-27.md Finding N7) automatically,
# before they reach users.
#
# Job layout:
#   1. install-smoke (ubuntu-latest):
#      install.py + install-bundle on Linux. Six file/env/wrapper assertions.
#   2. weaviate-smoke (ubuntu-latest, with Weaviate service):
#      Schema bootstrap + chunking-prop assertions against a real Weaviate.
#   3. install-smoke-no-container (matrix: windows-latest + macos-latest)
#      [v0.2.40 X2]: install.py + install-bundle on Windows/macOS WITHOUT a
#      container runtime. Exercises the install steps that don't need
#      Podman/Docker — Python venv setup, file materialization, .claude/
#      scaffold, wrapper-script presence (.ps1 on Windows, .sh on macOS).
#      Catches Windows + macOS install regressions in CI rather than
#      waiting for user reports. GitHub-hosted Windows/macOS runners don't
#      ship with Podman/Docker, so a `services:` block can't be used; we
#      structure the job to validate the no-container install path only.
#
# What is deliberately skipped (too heavy for CI, or unavailable on Win/Mac):
#   - Ollama model pulls (--skip-models flag).
#   - Docker/Podman container management (--no-containers flag); also not
#     installed on Windows/macOS GH runners by default.
#   - Actual embedding / KG sync passes (need Ollama + GPU).
#   - Full Weaviate collection bootstrapping via install.py — done in the
#     dedicated weaviate-smoke job (ubuntu-only).
#   - macOS .app notarization — release.yml handles ad-hoc codesign per X1.
#
# Weaviate service (weaviate-smoke job only):
#   - semitechnologies/weaviate:1.28.4 on port 8081
#   - Used only to verify `/v1/.well-known/ready` + collection bootstrap
#   - No embedding model configured (text2vec-none); queries work but
#     semantic search returns random order. Fine for schema-level assertions.
#
# Triggers: push/PR touching the install pipeline or template files.
# Does NOT trigger on release tags (release.yml handles that).

name: Installer Smoke Test

on:
  push:
    paths:
      - "install.py"
      - "vco_lib/project_init.py"
      - "vco_lib/config_projection.py"
      - "templates/**"
      - ".github/workflows/installer-smoke.yml"
      # v0.2.40 X1: macOS best-effort smoke triggers
      - "launcher/src-tauri/vct-hub/templates/**"
      - "docs/macos-install.md"
  pull_request:
    paths:
      - "install.py"
      - "vco_lib/project_init.py"
      - "vco_lib/config_projection.py"
      - "templates/**"
      - ".github/workflows/installer-smoke.yml"
      # v0.2.40 X1: macOS best-effort smoke triggers
      - "launcher/src-tauri/vct-hub/templates/**"
      - "docs/macos-install.md"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ------------------------------------------------------------------ #
  # Job 1: install.py + install-bundle (no Weaviate service needed)     #
  # Assertions 1-5: env file contents + wrapper script --help exits     #
  # ------------------------------------------------------------------ #
  install-smoke:
    name: install.py + install-bundle smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # v0.2.42 CI-3: pip cache — saves ~2-4 min on repeated runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-smoke-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-smoke-

      # Install orchestrator Python deps into CI venv. We skip container
      # and model setup entirely — install.py --no-containers --skip-models
      # does the venv/package work only.
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          # Install the orchestrator's own deps so install.py can complete
          # the venv-setup phase without error.  We only need the Python
          # side; Rust/npm/containers are out of scope.
          pip install -r requirements.txt 2>/dev/null || true
          # vco_lib itself (editable, so imports resolve from the checkout).
          # [mcp] extras pull weaviate-client, pyyaml, and mcp SDK together.
          # No || true: packaging regressions must surface, not be silenced.
          pip install -e ".[mcp]"
          # weaviate-client included in [mcp]; kept explicit as belt-and-suspenders.
          pip install weaviate-client 2>/dev/null || true

      # Step 1: Run install.py against a fresh temporary directory.
      #
      # --no-containers  Skip Docker/Podman service management.
      # --skip-models    Skip Ollama model pulls.
      #
      # Both flags exist in install.py (verified: lines 2006 + 2031).
      # The script will still create the orchestrator venv and write
      # .env / .claude/settings.json at the install root.
      - name: Run install.py (no containers, no models)
        env:
          VCO_CI_FIXTURE: "1"
          # Point at a temp state dir so we never touch ~/.vct on the runner
          VCT_STATE_DIR: "${{ runner.temp }}/.vct-smoke-${{ github.run_id }}"
        run: |
          set -euo pipefail
          INSTALL_ROOT="${{ runner.temp }}/vco_smoke_install_${{ github.run_id }}"
          mkdir -p "$INSTALL_ROOT"
          # Copy repo contents into the install root so install.py has
          # access to templates/, vco_lib/, etc.
          cp -r . "$INSTALL_ROOT/"
          cd "$INSTALL_ROOT"
          python install.py --no-containers --skip-models || {
            echo "::warning::install.py exited non-zero; continuing to check what was written"
          }
          echo "INSTALL_ROOT=$INSTALL_ROOT" >> "$GITHUB_ENV"

      # Step 2: Run install-bundle into a fresh project directory.
      #
      # This exercises the per-project bundle path (agents/skills/hooks/
      # scripts/settings copied into project .claude/).
      #
      # --write-env: emit per-project .claude/env carrying VCT_ORCHESTRATOR_ROOT
      # and VCT_INFRASTRUCTURE_DIR (the A2 path, 2026-05-28). These keys are
      # EXCLUDED from install-root .env by design — see vco_lib/env_template.py
      # lines 71-91: they are launcher-installation-local paths that the launcher
      # refreshes via the three Phase 0.B surfaces; .env is NOT one of them.
      # CLI users keep these in their shell rc. --write-env is the CI-reachable
      # path to assert them without a running launcher.
      - name: Run install-bundle into tmp project dir
        run: |
          set -euo pipefail
          PROJECT_DIR="${{ runner.temp }}/vco_smoke_project_${{ github.run_id }}"
          mkdir -p "$PROJECT_DIR"
          python -m vco_lib.project_init install-bundle \
            --folder "$PROJECT_DIR" \
            --orchestrator-root "$INSTALL_ROOT" \
            --write-env \
            || {
              echo "::warning::install-bundle exited non-zero; continuing assertions"
            }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # Assertions 1-3: per-project .claude/env carries orchestrator-root keys.
      #
      # CI-1 (v0.2.42 W1): re-targeted from install-root .env → per-project
      # .claude/env. Rationale: VCT_ORCHESTRATOR_ROOT / VCT_INFRASTRUCTURE_DIR
      # are DELIBERATELY EXCLUDED from install-root .env per vco_lib/env_template.py
      # lines 71-91 (launcher-local paths; the launcher refreshes the three
      # Phase 0.B surfaces; .env is NOT one of them; CLI users keep these in
      # their shell rc). The correct assertion target is $PROJECT_DIR/.claude/env,
      # which --write-env (above) writes via the A2 path.
      - name: Assert per-project .claude/env contains orchestrator-root keys
        run: |
          set -euo pipefail
          PROJECT_ENV="$PROJECT_DIR/.claude/env"
          if [ ! -f "$PROJECT_ENV" ]; then
            echo "::error::per-project .claude/env not written by install-bundle --write-env at $PROJECT_ENV"
            exit 1
          fi
          echo "Contents of per-project .claude/env (first 40 lines):"
          head -40 "$PROJECT_ENV"

          # Assertion 1: VCT_ORCHESTRATOR_ROOT present in per-project .claude/env
          if grep -q "VCT_ORCHESTRATOR_ROOT" "$PROJECT_ENV"; then
            echo "✓ Assertion 1 PASS: VCT_ORCHESTRATOR_ROOT found in .claude/env"
          else
            echo "::error::Assertion 1 FAIL: VCT_ORCHESTRATOR_ROOT missing from .claude/env (CI-1 / Finding F1)"
            exit 1
          fi

          # Assertion 2: VCT_INFRASTRUCTURE_DIR present in per-project .claude/env
          if grep -q "VCT_INFRASTRUCTURE_DIR" "$PROJECT_ENV"; then
            echo "✓ Assertion 2 PASS: VCT_INFRASTRUCTURE_DIR found in .claude/env"
          else
            echo "::error::Assertion 2 FAIL: VCT_INFRASTRUCTURE_DIR missing from .claude/env (CI-1 / Finding F1)"
            exit 1
          fi

          # Assertion 3: install-root .env present (sanity check only;
          # we do NOT assert orchestrator-root keys there — they don't
          # belong in .env per vco_lib/env_template.py:71-91).
          ROOT_ENV="$INSTALL_ROOT/.env"
          if [ -f "$ROOT_ENV" ]; then
            echo "✓ Assertion 3 PASS: install-root .env present"
          else
            echo "::warning::Assertion 3 WARN: install-root .env missing entirely (install.py may have exited early)"
          fi

      # Assertion 4: kg-sync --help exits 0 from the install root.
      #
      # The wrapper resolves its venv from VCT_INSTALL_ROOT or script-relative
      # paths. If venv resolution fails, --help itself exits non-zero.
      # Finding F4: wrapper scripts failed with "weaviate-client not installed"
      # on fresh installs.
      - name: Assert kg-sync --help exits 0
        run: |
          set -euo pipefail
          KG_SYNC="$INSTALL_ROOT/.claude/scripts/kg-sync"
          if [ ! -f "$KG_SYNC" ]; then
            # Fallback: templates location (pre-bundle-copy path)
            KG_SYNC="$INSTALL_ROOT/templates/scripts/kg-sync"
          fi
          if [ ! -f "$KG_SYNC" ]; then
            echo "::error::kg-sync wrapper not found at expected locations"
            exit 1
          fi
          export VCT_INSTALL_ROOT="$INSTALL_ROOT"
          export VCT_ORCHESTRATOR_ROOT="$INSTALL_ROOT"
          bash "$KG_SYNC" --help && echo "✓ Assertion 4 PASS: kg-sync --help exits 0" || {
            echo "::error::Assertion 4 FAIL: kg-sync --help exited non-zero (Finding F4)"
            exit 1
          }

      # Assertion 5: code-graph-analyze --help exits 0.
      #
      # Same venv-resolution check as kg-sync. Uses the canonical
      # VCT_INSTALL_ROOT probe order introduced in v0.2.37 Gap 6b.
      - name: Assert code-graph-analyze --help exits 0
        run: |
          set -euo pipefail
          CGA="$INSTALL_ROOT/.claude/scripts/code-graph-analyze"
          if [ ! -f "$CGA" ]; then
            CGA="$INSTALL_ROOT/templates/scripts/code-graph-analyze"
          fi
          if [ ! -f "$CGA" ]; then
            echo "::error::code-graph-analyze wrapper not found at expected locations"
            exit 1
          fi
          export VCT_INSTALL_ROOT="$INSTALL_ROOT"
          export VCT_ORCHESTRATOR_ROOT="$INSTALL_ROOT"
          bash "$CGA" --help && echo "✓ Assertion 5 PASS: code-graph-analyze --help exits 0" || {
            echo "::error::Assertion 5 FAIL: code-graph-analyze --help exited non-zero (Finding F4)"
            exit 1
          }

  # ------------------------------------------------------------------ #
  # Job 2: Weaviate schema bootstrap + chunking-prop assertions         #
  # Assertions 6: chunking props present on bootstrapped KG collection  #
  # ------------------------------------------------------------------ #
  weaviate-smoke:
    name: Weaviate bootstrap smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      weaviate:
        # Pin to 1.28.4 — the version targeted by the v0.2.38 schema tests.
        # No API key required; default-mode (no auth) matches dev installs.
        image: semitechnologies/weaviate:1.28.4
        ports:
          - "8081:8080"
          - "50052:50051"
        env:
          # No embedding module — we only test schema creation, not vectors.
          # Using text2vec-contextionary would require a second service.
          ENABLE_MODULES: ""
          DEFAULT_VECTORIZER_MODULE: "none"
          AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
          PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
          QUERY_DEFAULTS_LIMIT: "25"
          CLUSTER_HOSTNAME: "node1"
        options: >-
          --health-cmd "wget -qO- http://localhost:8080/v1/.well-known/ready || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # v0.2.42 CI-3: pip cache.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-smoke-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-smoke-

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          # [mcp] extras include weaviate-client, pyyaml, mcp SDK.
          # No || true: packaging regressions must surface.
          pip install -e ".[mcp]"
          # weaviate-client included in [mcp]; kept explicit for clarity.
          pip install weaviate-client

      # Assertion 6: Weaviate /v1/.well-known/ready responds.
      #
      # The service health-check above guarantees it's up before this step
      # runs. This step is an explicit smoke-test that our client code can
      # reach Weaviate at the expected URL.
      - name: Assert Weaviate ready
        run: |
          set -euo pipefail
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/v1/.well-known/ready)
          if [ "$STATUS" = "200" ]; then
            echo "✓ Assertion 6a PASS: Weaviate /v1/.well-known/ready → 200"
          else
            echo "::error::Assertion 6a FAIL: Weaviate ready endpoint returned $STATUS"
            exit 1
          fi

      # Assertion 6b: Bootstrap the KG collection via sync_knowledge_graph.py
      # and assert that the 5 chunking-related properties exist on the schema.
      #
      # This is the CI equivalent of the manual verification described in the
      # A5 spec: "the 5 chunking-related properties exist on the bootstrapped
      # KG collection".  We use 3 chunking props + 2 temporal props as the
      # representative set (same as test_canonical_scalar_props_includes_*).
      - name: Bootstrap KG collection + assert chunking props on schema
        env:
          WEAVIATE_URL: "http://localhost:8081"
          KG_COLLECTION: "SmokeTest_KnowledgeGraph"
          VCT_ORCHESTRATOR_ROOT: "${{ github.workspace }}"
          GRPC_PORT: "50052"
        run: |
          set -euo pipefail

          # Bootstrap: run ensure_collection_exists via a tiny inline script
          # that imports sync_knowledge_graph directly (same pattern as the
          # unit tests — avoids needing a real server instance).
          python - <<'PYEOF'
          import os
          import sys
          _root = os.environ.get("VCT_ORCHESTRATOR_ROOT", ".")
          sys.path.insert(0, _root)
          # v0.2.42 (post-W1-CI2 fix): sync_knowledge_graph.py imports
          # `weaviate_mcp.chunking` (TokenCounter + Chunker). The
          # `weaviate_mcp` package lives one level deeper at
          # `<root>/claude_mcp_servers/weaviate_mcp/`, so
          # `claude_mcp_servers/` must also be on sys.path or the import
          # fails with ModuleNotFoundError. Mirrors how vct-hub spawns
          # the MCP subprocess with PYTHONPATH=<root>/claude_mcp_servers.
          sys.path.insert(0, os.path.join(_root, "claude_mcp_servers"))

          import weaviate

          url = os.environ["WEAVIATE_URL"]
          grpc_port = int(os.environ.get("GRPC_PORT", "50051"))
          collection_name = os.environ["KG_COLLECTION"]

          client = weaviate.connect_to_local(
              host=url.replace("http://", "").split(":")[0],
              port=int(url.split(":")[-1]),
              grpc_port=grpc_port,
          )

          # Import the module-level constant and ensure_collection_exists
          import importlib.util
          from pathlib import Path

          repo_root = Path(os.environ.get("VCT_ORCHESTRATOR_ROOT", "."))
          script_path = repo_root / "templates" / "scripts" / "sync_knowledge_graph.py"
          spec = importlib.util.spec_from_file_location("_sg_smoke", script_path)
          mod = importlib.util.module_from_spec(spec)
          mod.COLLECTION_NAME = collection_name
          spec.loader.exec_module(mod)
          mod.COLLECTION_NAME = collection_name  # override after exec

          # Build a minimal server stand-in pointing at the real Weaviate
          class _Server:
              pass
          srv = _Server()
          srv.client = client

          ok = mod.ensure_collection_exists(srv)
          assert ok, "ensure_collection_exists returned False — collection bootstrap failed"
          print(f"✓ Collection '{collection_name}' bootstrapped successfully")

          # Assert the 5 load-bearing properties exist on the schema.
          # Covers chunking props (chunk_num/total_chunks/source_node_id)
          # + core temporal (status/content_hash) — same set verified by
          # test_kg_schema_consistency.py in unit tests.
          required_props = {
              "chunk_num", "total_chunks", "source_node_id",
              "status", "content_hash",
          }
          coll = client.collections.get(collection_name)
          config = coll.config.get()
          present = {p.name for p in config.properties}
          missing = required_props - present
          if missing:
              print(f"FAIL: missing props on bootstrapped schema: {sorted(missing)}", file=sys.stderr)
              client.close()  # Con004: close before exit to suppress ResourceWarning
              sys.exit(1)
          print(f"✓ Assertion 6b PASS: all 5 chunking/temporal props present: {sorted(required_props)}")
          client.close()  # Con004: explicit close suppresses ResourceWarning on GC
          PYEOF
          echo "✓ Weaviate schema assertions complete"

  # ------------------------------------------------------------------ #
  # Job 3: macOS best-effort smoke (v0.2.40 X1)                        #
  #                                                                    #
  # Verifies the macOS-specific support pieces parse + install cleanly #
  # on a real macos-latest runner WITHOUT triggering a full Tauri      #
  # launcher build (which costs ~10-15 min and is already exercised    #
  # by the release.yml matrix on every tag).                           #
  # ------------------------------------------------------------------ #
  macos-smoke:
    name: macOS best-effort smoke (v0.2.40 X1)
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      # Assertion M1: codesign + plutil are available on the runner.
      # If either tool disappears from the runner image, the X1 ad-hoc
      # codesign step in release.yml would silently regress. Fail loudly
      # here so the regression is caught at PR time, not release time.
      - name: Assert codesign + plutil tooling available
        run: |
          set -euo pipefail
          for tool in codesign plutil; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::Required tool $tool not on PATH on macos-latest"
              exit 1
            fi
          done
          codesign --version || true
          plutil -help 2>&1 | head -3 || true
          echo "✓ Assertion M1 PASS: codesign + plutil available"

      # Assertion M2: the manual-fallback plist template parses after
      # placeholder substitution. We sub with fake but well-formed paths
      # and run `plutil -lint` which is strict about plist XML validity.
      - name: Assert templates/scripts/launchctl-plist.template parses
        run: |
          set -euo pipefail
          src="templates/scripts/launchctl-plist.template"
          if [ ! -f "$src" ]; then
            echo "::error::Expected manual-fallback template at $src (v0.2.40 X1 deliverable)"
            exit 1
          fi
          tmp="$(mktemp -d)/com.vibecodedtools.vct-hub.plist"
          sed -e "s|__VCT_HUB_BIN__|/usr/local/bin/vct-hub|g" \
              -e "s|__VCT_STATE_DIR__|/tmp/vct-smoke-state|g" \
              "$src" > "$tmp"
          plutil -lint "$tmp"
          echo "✓ Assertion M2 PASS: $src parses as valid plist after substitution"

      # Assertion M3: the canonical plist template (rendered by
      # `vct-hub --register-boot`) also parses. Same substitution, same
      # plutil check — catches accidental edits to the canonical
      # template that would break the launcher-driven install path.
      - name: Assert canonical vct-hub plist template parses
        run: |
          set -euo pipefail
          src="launcher/src-tauri/vct-hub/templates/com.vibecodedtools.vct-hub.plist.template"
          if [ ! -f "$src" ]; then
            echo "::error::Expected canonical plist template at $src"
            exit 1
          fi
          tmp="$(mktemp -d)/com.vibecodedtools.vct-hub.plist"
          sed -e "s|__VCT_HUB_BIN__|/usr/local/bin/vct-hub|g" \
              -e "s|__VCT_STATE_DIR__|/tmp/vct-smoke-state|g" \
              "$src" > "$tmp"
          plutil -lint "$tmp"
          echo "✓ Assertion M3 PASS: canonical plist template parses after substitution"

      # Assertion M4: ad-hoc codesign tooling works end-to-end against
      # a tiny test binary. If `codesign --sign -` regresses on a runner
      # image bump (or hardened-runtime defaults change), the release
      # would ship an unsigned binary silently — this assertion fails
      # loudly instead.
      - name: Assert ad-hoc codesign + verify round-trip succeeds
        run: |
          set -euo pipefail
          # Build a minimal Mach-O via clang — `/bin/echo` is a system
          # binary so we can't sign it (Apple owns the entitlements).
          # Build our own.
          tmp="$(mktemp -d)"
          cat > "$tmp/hello.c" <<'CEOF'
          #include <stdio.h>
          int main(void) { puts("hello from x1 smoke"); return 0; }
          CEOF
          clang -O0 -o "$tmp/hello" "$tmp/hello.c"
          codesign --force --deep --sign - "$tmp/hello"
          codesign --verify --verbose=2 "$tmp/hello"
          # The verify output should include "valid on disk" — check it.
          out="$(codesign --verify --verbose=2 "$tmp/hello" 2>&1 || true)"
          echo "$out"
          if echo "$out" | grep -q "valid on disk"; then
            echo "✓ Assertion M4 PASS: ad-hoc codesign + verify works on macos-latest"
          else
            echo "::error::Assertion M4 FAIL: codesign verify output unexpected"
            exit 1
          fi

      # Assertion M5: docs/macos-install.md references paths that exist.
      # Avoids drift between the doc's "see X for the canonical Y" links
      # and the actual on-disk paths.
      - name: Assert docs/macos-install.md references resolve
        run: |
          set -euo pipefail
          doc="docs/macos-install.md"
          if [ ! -f "$doc" ]; then
            echo "::error::Expected $doc (v0.2.40 X1 deliverable)"
            exit 1
          fi
          # Paths the doc claims exist — verify each one.
          referenced_paths=(
            "templates/scripts/launchctl-plist.template"
            "launcher/src-tauri/vct-hub/templates/com.vibecodedtools.vct-hub.plist.template"
            "launcher/src-tauri/vct-hub/templates/vct-hub.service.template"
            "launcher/src-tauri/vct-hub/templates/vct-hub-task.xml.template"
            "launcher/src-tauri/vct-hub/src/boot.rs"
            "scripts/build-bundled-launcher.sh"
            ".github/workflows/release.yml"
          )
          missing_count=0
          for p in "${referenced_paths[@]}"; do
            if [ ! -e "$p" ]; then
              echo "::error::docs/macos-install.md references $p but it doesn't exist"
              missing_count=$((missing_count + 1))
            fi
          done
          if [ "$missing_count" -gt 0 ]; then
            exit 1
          fi
          echo "✓ Assertion M5 PASS: all ${#referenced_paths[@]} doc-referenced paths exist"

  # ------------------------------------------------------------------ #
  # Job 4: install.py + install-bundle on Windows + macOS (v0.2.40 X2)  #
  # Matrix: [windows-latest, macos-latest].                             #
  #                                                                    #
  # GitHub-hosted Windows/macOS runners don't ship Podman/Docker and    #
  # `services:` blocks don't run on non-Linux runners, so we exercise   #
  # only the no-container install path: Python venv setup, file         #
  # materialization, .claude/ scaffold, wrapper-script presence.        #
  #                                                                    #
  # `fail-fast: false` so a Windows-only bug doesn't kill the macOS run #
  # (and vice versa). Note: macos-latest is ALSO exercised by Job 3     #
  # (macos-smoke) with macOS-specific assertions — Job 4 runs general   #
  # install.py smoke; the two are complementary, not duplicated.        #
  # ------------------------------------------------------------------ #
  install-smoke-no-container:
    name: install.py smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            wrapper_ext: ".ps1"
            kind: windows
          - os: macos-latest
            wrapper_ext: ""
            kind: macos
    runs-on: ${{ matrix.os }}
    # v0.2.42 CI-3: raised from 20 → 30 min. Windows pip install on cold
    # runner images (no cache) + install.py venv bootstrap can take 18-22 min.
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # v0.2.42 CI-3: pip cache — saves ~3-5 min on repeated windows-latest runs.
      # Both Linux and Windows cache paths included; macOS uses ~/.cache/pip too.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/AppData/Local/pip/Cache
          key: ${{ runner.os }}-pip-smoke-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-smoke-

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || true
          # [mcp] extras pull weaviate-client, pyyaml, mcp SDK.
          # No || true: packaging regressions must surface.
          pip install -e ".[mcp]"
          # weaviate-client included in [mcp]; kept explicit as belt-and-suspenders.
          pip install weaviate-client 2>/dev/null || true

      # Run install.py with no containers + no models. This exercises:
      #   - Python venv bootstrap
      #   - .env materialization at the install root (Finding F1 surface)
      #   - .claude/ scaffold (settings.json + hooks/scripts/agents/skills)
      #   - Cross-OS path handling in vco_lib.config_projection / env_template
      #     (the actual content of the F5 path-consolidation review item —
      #     a Windows branch in vct_root_dir resolver is a follow-up.)
      #
      # --no-hub (CI-3-nohub, v0.2.42): skip Step 8 (vct-hub deployment +
      # start). GitHub-hosted Windows + macOS runners don't have a pre-built
      # vct-hub binary on PATH, no GitHub release download is available from
      # inside the CI sandbox, and no `cargo build` is available without the
      # Rust toolchain step. --no-hub leaves any already-running hub untouched;
      # only the launch step is skipped. Auto-start fallback: hub starts when
      # the launcher is next opened, or when the first Claude Code session
      # begins in any installed project (session-start-ensure-hub hook).
      - name: Run install.py (no containers, no models)
        env:
          VCO_CI_FIXTURE: "1"
          VCT_STATE_DIR: "${{ runner.temp }}/.vct-smoke-${{ matrix.kind }}-${{ github.run_id }}"
        run: |
          set -euo pipefail
          INSTALL_ROOT="${{ runner.temp }}/vco_smoke_install_${{ matrix.kind }}_${{ github.run_id }}"
          mkdir -p "$INSTALL_ROOT"
          # Copy repo into the install root. `cp -r .` works under Git Bash
          # on Windows and macOS bash alike.
          cp -r . "$INSTALL_ROOT/"
          cd "$INSTALL_ROOT"
          python install.py --no-containers --skip-models --no-hub || {
            echo "::warning::install.py exited non-zero on ${{ matrix.kind }}; continuing to check what was written"
          }
          echo "INSTALL_ROOT=$INSTALL_ROOT" >> "$GITHUB_ENV"

      # --write-env: emit per-project .claude/env (same as Job 1 above).
      # See the Job 1 install-bundle comment for full rationale.
      - name: Run install-bundle into tmp project dir
        run: |
          set -euo pipefail
          PROJECT_DIR="${{ runner.temp }}/vco_smoke_project_${{ matrix.kind }}_${{ github.run_id }}"
          mkdir -p "$PROJECT_DIR"
          python -m vco_lib.project_init install-bundle \
            --folder "$PROJECT_DIR" \
            --orchestrator-root "$INSTALL_ROOT" \
            --write-env \
            || {
              echo "::warning::install-bundle exited non-zero on ${{ matrix.kind }}; continuing assertions"
            }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # Assertion X2-1: per-project .claude/env carries orchestrator-root keys.
      #
      # CI-1 (v0.2.42 W1): re-targeted from install-root .env → per-project
      # .claude/env. VCT_ORCHESTRATOR_ROOT / VCT_INFRASTRUCTURE_DIR are
      # DELIBERATELY EXCLUDED from install-root .env per vco_lib/env_template.py
      # lines 71-91. The correct assertion target is $PROJECT_DIR/.claude/env.
      - name: Assert per-project .claude/env contains orchestrator-root keys
        run: |
          set -euo pipefail
          PROJECT_ENV="$PROJECT_DIR/.claude/env"
          if [ ! -f "$PROJECT_ENV" ]; then
            echo "::error::per-project .claude/env not written at $PROJECT_ENV (${{ matrix.kind }})"
            exit 1
          fi
          if grep -q "VCT_ORCHESTRATOR_ROOT" "$PROJECT_ENV"; then
            echo "✓ X2-1 PASS (${{ matrix.kind }}): VCT_ORCHESTRATOR_ROOT in .claude/env"
          else
            echo "::error::X2-1 FAIL (${{ matrix.kind }}): VCT_ORCHESTRATOR_ROOT missing from .claude/env (CI-1 / Finding F1)"
            exit 1
          fi
          if grep -q "VCT_INFRASTRUCTURE_DIR" "$PROJECT_ENV"; then
            echo "✓ X2-1b PASS (${{ matrix.kind }}): VCT_INFRASTRUCTURE_DIR in .claude/env"
          else
            echo "::error::X2-1b FAIL (${{ matrix.kind }}): VCT_INFRASTRUCTURE_DIR missing from .claude/env (CI-1 / Finding F1)"
            exit 1
          fi

      # Assertion X2-2: wrapper scripts present in templates/scripts/.
      #
      # Windows: assert .ps1 sibling exists (PowerShell wrappers ship for
      # native Windows usage; Git Bash users can also call the bash
      # wrappers, but the .ps1 surface is what end-users hit).
      # macOS: assert the bash wrapper exists and is readable.
      - name: Assert wrapper scripts present
        run: |
          set -euo pipefail
          if [ "${{ matrix.kind }}" = "windows" ]; then
            KG_SYNC="$INSTALL_ROOT/templates/scripts/kg-sync.ps1"
            CGA="$INSTALL_ROOT/templates/scripts/code-graph-analyze.ps1"
            label=".ps1"
          else
            KG_SYNC="$INSTALL_ROOT/templates/scripts/kg-sync"
            CGA="$INSTALL_ROOT/templates/scripts/code-graph-analyze"
            label="bash"
          fi
          if [ -f "$KG_SYNC" ]; then
            echo "✓ X2-2a PASS (${{ matrix.kind }}): $label kg-sync wrapper present"
          else
            echo "::error::X2-2a FAIL (${{ matrix.kind }}): $label kg-sync wrapper missing at $KG_SYNC"
            exit 1
          fi
          if [ -f "$CGA" ]; then
            echo "✓ X2-2b PASS (${{ matrix.kind }}): $label code-graph-analyze wrapper present"
          else
            echo "::error::X2-2b FAIL (${{ matrix.kind }}): $label code-graph-analyze wrapper missing at $CGA"
            exit 1
          fi

      # Assertion X2-3: project .claude/ scaffold materialized by
      # install-bundle. Mirrors what install-smoke would catch indirectly
      # via wrapper-help; here we make the file-presence check explicit so
      # a regression in install-bundle's cross-OS file copy can't hide.
      - name: Assert project .claude scaffold present
        run: |
          set -euo pipefail
          if [ ! -d "$PROJECT_DIR/.claude" ]; then
            echo "::error::X2-3 FAIL (${{ matrix.kind }}): $PROJECT_DIR/.claude missing"
            exit 1
          fi
          # Minimum scaffold the bundle is supposed to write. Don't enumerate
          # every file (volatile); just check the directories exist.
          missing=0
          for sub in agents skills hooks scripts; do
            if [ ! -d "$PROJECT_DIR/.claude/$sub" ]; then
              echo "::warning::X2-3 WARN (${{ matrix.kind }}): .claude/$sub missing"
              missing=$((missing+1))
            fi
          done
          if [ "$missing" -ge 3 ]; then
            echo "::error::X2-3 FAIL (${{ matrix.kind }}): $missing/4 expected .claude/ subdirs missing — bundle materialization broken"
            exit 1
          fi
          echo "✓ X2-3 PASS (${{ matrix.kind }}): .claude/ scaffold materialized ($((4-missing))/4 expected subdirs present)"
