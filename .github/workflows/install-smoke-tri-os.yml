# v0.2.53 Track D — Tri-OS install smoke gate (M-P0-9).
#
# Exercises the third-party-user experience end-to-end on every supported
# operating system. Performs a fresh `git clone` (NOT actions/checkout) so
# the smoke walks the same code path the macOS fresh-clone report hit:
# `git clone && ./first-install.command`. The earlier `installer-smoke.yml`
# only covered the `install.py` Python entry point with a shallow Linux
# probe — it was structurally incapable of catching:
#   - macOS-specific bash 3.2 / `experimental_macOS` path drift (M-P0-*).
#   - Windows `first-install.bat` cmd.exe-specific bugs (W-P1-1/2/3) —
#     the existing Job 4 uses `shell: bash`, never exercising the BAT
#     entry point.
#   - Fedora SELinux `:Z` mount flag handling (L-P0-3).
#   - Linuxbrew + dnf parity gaps (L-P0-1).
#
# Per docs/INSTALL_ARCHITECTURE_v2.md §9.
#
# Triggers: PRs touching install surfaces, push to main, daily 06:00 UTC.
# Caching: pip + pnpm caches keyed by lockfile hashes to stay under 15 min
#          per OS. Fresh clone happens INSIDE the runner — the workspace
#          /__w/<repo>/ checkout is unused for the install probe.
#
# Owner: Track D.
# Pre-ship gate 22 reads `gh run list --workflow=install-smoke-tri-os.yml`
# and asserts success on main before allowing a release tag.

name: Install Smoke (tri-OS)

on:
  pull_request:
    paths:
      - "install.py"
      - "install.sh"
      - "install.ps1"
      - "first-install.*"
      - "start-launcher.*"
      - "scripts/post-install-launcher.*"
      - "launcher/src-tauri/src/commands/installer.rs"
      - "vco_lib/project_init.py"
      - ".github/workflows/install-smoke-tri-os.yml"
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel in-progress PR runs to save CI minutes — but NEVER cancel a
  # push-to-main or scheduled run, those are load-bearing for gate 22.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  install-smoke:
    name: install smoke (${{ matrix.target }})
    strategy:
      # One OS failure must NOT mask the others — gate 22 reads per-matrix
      # conclusions.
      fail-fast: false
      matrix:
        # v0.2.54 Track E (Theme 6): use a synthetic `target` matrix key
        # so the Fedora leg gets its own distinct job slot. Pre-Track-E
        # the matrix had a bare `os:` list; trying to add Fedora via
        # `include` MERGED into the existing ubuntu-22.04 leg instead of
        # creating a fifth job (GitHub Actions `include` semantics:
        # entries whose keys match an existing matrix combo merge into
        # it). With `target` as the primary axis and explicit `os:` /
        # `container:` per row, each row produces its own job and the
        # ubuntu-22.04 libwebkit2gtk-4.0-dev fallback coverage stays
        # intact alongside the new fedora-40 leg.
        #
        # See §9.2 for OS rationale.
        target:
          - ubuntu-22.04   # Tests L-P0-2 (libwebkit2gtk-4.0-dev fallback)
          - ubuntu-24.04   # Tests L-P0-2 (libwebkit2gtk-4.1-dev primary)
          - macos-14       # Tests M-P0-* (bash 3.2, /opt/homebrew, arm64)
          - windows-latest # Tests W-P1-* + first-install.bat (cmd.exe)
          - fedora-40      # Tests L-P0-3 (SELinux :Z mount flag) + L-P0-1 (dnf parity)
        include:
          - target: ubuntu-22.04
            os: ubuntu-22.04
          - target: ubuntu-24.04
            os: ubuntu-24.04
          - target: macos-14
            os: macos-14
          - target: windows-latest
            os: windows-latest
          - target: fedora-40
            os: ubuntu-22.04
            container: fedora:40

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || null }}
    timeout-minutes: 25

    env:
      # Single source of truth for the per-OS dist subdir name — must
      # match `paths.launcher_dist_subdir` from install.py --bootstrap
      # and Track A's `metadata.json` writer + reader.
      LAUNCHER_DIST_SUBDIR: >-
        ${{
          (matrix.os == 'macos-14' && 'macos-arm64') ||
          (matrix.os == 'windows-latest' && 'windows-x64') ||
          'linux-x64'
        }}

    steps:
      # v0.2.54 Track E (Theme 6): Fedora container prep. The fedora-40
      # row in the matrix sets `container: fedora:40` (see matrix above),
      # so this step only runs on that leg. dnf installs git + python +
      # the system libraries needed for the libwebkit2gtk + dbus build
      # path that actions/setup-python's manylinux wheels can't cover.
      # SELinux :Z mount-flag coverage (L-P0-3) and dnf-vs-apt parity
      # coverage (L-P0-1) ride on this leg.
      - name: Fedora container prep (dnf install)
        if: matrix.target == 'fedora-40'
        shell: bash
        run: |
          set -euo pipefail
          dnf install -y \
            git \
            python3 \
            python3-pip \
            python3-devel \
            nodejs \
            npm \
            curl \
            tar \
            gzip \
            findutils \
            which \
            shadow-utils
          python3 --version
          git --version
          node --version || true

      # ----------------------------------------------------------------
      # 1. Fresh git clone (NOT actions/checkout).
      #
      #    Reason: actions/checkout does a shallow clone via the GitHub
      #    Actions auth helper, which is NOT what a third-party user
      #    does. We need to exercise the public-clone code path that
      #    a third-party user would hit on their macOS install. The
      #    `vco-fresh-clone/` subdir keeps the install root isolated
      #    from the workspace `__w/<repo>/` directory that earlier
      #    checkout actions would leave behind.
      # ----------------------------------------------------------------
      - name: Clone fresh (third-party-user experience)
        shell: bash
        run: |
          set -euo pipefail
          # On PRs, github.sha is the PR-merge commit, not the head of
          # the source branch. For pull_request triggers we want the
          # commit Actions resolved (github.event.pull_request.head.sha)
          # so the smoke tests THIS PR's code, not main+merge.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            target_sha="${{ github.event.pull_request.head.sha }}"
          else
            target_sha="${{ github.sha }}"
          fi
          echo "Cloning ${{ github.repository }} @ $target_sha"
          git clone --no-tags "https://github.com/${{ github.repository }}.git" vco-fresh-clone
          cd vco-fresh-clone
          git fetch --depth=1 origin "$target_sha"
          git checkout "$target_sha"
          git log -1 --oneline

      # ----------------------------------------------------------------
      # 2. Python setup via actions/setup-python on bare runners; on
      #    fedora-40 (container leg) actions/setup-python's downloaded
      #    Python lacks libdbus + libwebkit2gtk symbols, so we use the
      #    distro python installed by the Fedora container prep step
      #    above. Skip the action on that leg.
      # ----------------------------------------------------------------
      - name: Set up Python (host runners)
        if: matrix.target != 'fedora-40'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ----------------------------------------------------------------
      # 3. pip cache — keyed by lockfile hashes. Cross-OS cache hits
      #    are intentional: pip wheels are platform-tagged so cache
      #    misses on different OSes are by design.
      # ----------------------------------------------------------------
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~/AppData/Local/pip/Cache
          key: tri-os-pip-${{ runner.os }}-${{ hashFiles('vco-fresh-clone/requirements.txt', 'vco-fresh-clone/pyproject.toml') }}
          restore-keys: |
            tri-os-pip-${{ runner.os }}-

      # ----------------------------------------------------------------
      # 4. Bootstrap probe (read-only) — exercises install.py
      #    --bootstrap --json. Track B owns the implementation. Until
      #    Track B's PR lands, the bootstrap mode may not exist; we
      #    treat a missing-flag exit as a SKIP rather than fail, so
      #    this workflow can land before Track B. After Phase 2
      #    integration, both flags are required; tighten this then.
      # ----------------------------------------------------------------
      - name: Bootstrap probe (read-only) — POSIX
        if: matrix.os != 'windows-latest'
        working-directory: vco-fresh-clone
        shell: bash
        run: |
          set -uo pipefail
          if python3 install.py --bootstrap --json > bootstrap-pre.json 2>bootstrap-pre.stderr; then
            python3 -m json.tool bootstrap-pre.json | head -60
            echo "::notice::Bootstrap probe (pre-install) succeeded"
          else
            ec=$?
            if grep -qiE 'unrecognized|no such option|unknown' bootstrap-pre.stderr 2>/dev/null; then
              echo "::warning::install.py --bootstrap not yet implemented (Track B pending); skipping pre-probe"
            else
              echo "::error::install.py --bootstrap exited $ec for non-flag reason:"
              cat bootstrap-pre.stderr
              exit 1
            fi
          fi

      # v0.2.54 G-1: the warning echo previously contained the literal
      # text "(Track B pending)" INSIDE the `&& ( ... )` block. cmd.exe
      # parses the whole `if` compound before executing it, the unescaped
      # `)` after "pending" closed the block mid-echo, and the entire
      # step aborted at parse time with `"; was unexpected at this time."`
      # exit 255 — THE failure that kept this workflow red since it
      # landed. Rule: no unescaped parens (and no `;` workarounds) in
      # echo text inside ( ) blocks. Gated by
      # tests/test_workflow_cmd_paren_safety.py.
      - name: Bootstrap probe (read-only) — Windows
        if: matrix.os == 'windows-latest'
        working-directory: vco-fresh-clone
        shell: cmd
        run: |
          py -3 install.py --bootstrap --json > bootstrap-pre.json 2> bootstrap-pre.stderr
          if errorlevel 1 (
            findstr /I "unrecognized unknown" bootstrap-pre.stderr >NUL && (
              echo ::warning::install.py --bootstrap not yet implemented - Track B pending - skipping pre-probe
              exit /b 0
            ) || (
              echo ::error::install.py --bootstrap failed for non-flag reason
              type bootstrap-pre.stderr
              exit /b 1
            )
          )
          type bootstrap-pre.json

      # ----------------------------------------------------------------
      # 5. Run actual first-install.{sh,command,bat} end-to-end.
      #
      #    Each shim is invoked the SAME way a user would invoke it.
      #    The `--yes` flag suppresses interactive prompts. The
      #    `--no-auto-launch` flag prevents the launcher from spawning
      #    a GUI window after install (CI has no display).
      #
      #    The Track A shim rewrite for v0.2.53 must accept these flags.
      #    Until then, the existing wrappers may not — we treat a
      #    flag-rejection error as a SKIP for the first-install step
      #    only; the verify-artifacts step below still asserts the
      #    install fully landed via the legacy `install.py` invocation.
      # ----------------------------------------------------------------
      # v0.2.54 G-1: all three first-install steps now pass
      # `--no-containers --skip-models`, mirroring the flags the (green)
      # installer-smoke.yml jobs use. Rationale, from the never-green
      # initial runs of this workflow (e.g. run 27340118156):
      #   - ubuntu: install.py picked podman but the rootless
      #     podman.socket isn't active on GH runners → `compose up`
      #     failed with "Cannot connect to the Docker daemon at
      #     unix:///run/user/1001/podman/podman.sock".
      #   - macos-14: runners ship NO container runtime at all →
      #     install.py exits 1 with "re-run with --no-containers".
      #   - models: Ollama isn't running in CI; pulls would be slow+flaky.
      # The container/compose path keeps real coverage via
      # installer-smoke.yml's weaviate-smoke job (service container).
      # Full-stack container e2e on runners (podman.socket activation)
      # is Track G scope (v0.2.54 Wave 3).
      - name: first-install.sh (Linux + Fedora)
        if: matrix.target == 'ubuntu-22.04' || matrix.target == 'ubuntu-24.04' || matrix.target == 'fedora-40'
        working-directory: vco-fresh-clone
        shell: bash
        # Some Linux distros mark first-install.sh non-executable when
        # cloned over HTTPS via cgi (umask). Run via explicit `bash`.
        #
        # v0.2.54 Track E: fedora-40 now runs the same first-install.sh
        # step (matrix.target gating, not matrix.os, since fedora-40's
        # `os:` is ubuntu-22.04 the host runner). Exercises L-P0-1 (dnf
        # parity) + L-P0-3 (SELinux :Z mount flag handling).
        run: |
          set -uo pipefail
          if bash first-install.sh --yes --no-auto-launch --no-containers --skip-models; then
            echo "::notice::first-install.sh exited 0"
          else
            ec=$?
            echo "::error::first-install.sh exited $ec"
            # Dump the install log to aid debugging.
            test -f state/logs/install.jsonl && tail -50 state/logs/install.jsonl || true
            exit $ec
          fi

      - name: first-install.command (macOS)
        if: matrix.os == 'macos-14'
        working-directory: vco-fresh-clone
        shell: bash
        run: |
          set -uo pipefail
          # Finder-launched .command files run with PWD=$HOME; we
          # simulate by invoking from a separate dir to verify the shim
          # cd's to SCRIPT_DIR (M-P1-4).
          if (cd "$RUNNER_TEMP" && bash "$GITHUB_WORKSPACE/vco-fresh-clone/first-install.command" --yes --no-auto-launch --no-containers --skip-models); then
            echo "::notice::first-install.command exited 0"
          else
            ec=$?
            echo "::error::first-install.command exited $ec"
            test -f state/logs/install.jsonl && tail -50 state/logs/install.jsonl || true
            exit $ec
          fi

      - name: first-install.bat (Windows, cmd.exe)
        if: matrix.os == 'windows-latest'
        working-directory: vco-fresh-clone
        shell: cmd
        # CRITICAL: shell MUST be `cmd` here, not `bash`. The whole
        # point of this step is to exercise the cmd.exe-only batch
        # parser (W-P1-3). Git Bash on windows-latest masks bugs that
        # only manifest under cmd.exe (e.g. `%~dp0` quoting, the
        # `:_log_event` label parsing, refreshenv fallback).
        #
        # v0.2.54 G-1: `call` is REQUIRED — without it cmd.exe chains to
        # the .bat and never returns, so the errorlevel guard below never
        # ran. `--no-auto-launch` now (G-1 .bat parity fix) skips the
        # whole launcher-acquisition phase, matching first-install.sh —
        # previously a stale bundled binary sent CI into a multi-minute
        # `pnpm tauri build` fallback that blew the 25-minute job cap.
        run: |
          call first-install.bat --yes --no-auto-launch --no-containers --skip-models
          if errorlevel 1 (
            echo ::error::first-install.bat exited non-zero
            if exist state\logs\install.jsonl type state\logs\install.jsonl
            exit /b 1
          )
          echo first-install.bat exited 0

      # ----------------------------------------------------------------
      # 6. Verify install artifacts.
      #
      #    Asserts the install fully landed by checking presence of the
      #    four contract directories + the .env file with KG_COLLECTION
      #    set. These checks mirror what install.py --bootstrap would
      #    report as `paths.state_dir_exists` / `paths.install_root_kind
      #    == "completed_install"`, but expressed directly so this
      #    workflow does not depend on Track B's bootstrap-envelope
      #    shape being final.
      # ----------------------------------------------------------------
      - name: Verify install artifacts (POSIX)
        if: matrix.os != 'windows-latest'
        working-directory: vco-fresh-clone
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          # NOTE: claude_mcp_servers/.venv is a STALE LEGACY PATH; the
          # canonical venv lives at PROJECT_ROOT/.venv (see install.py
          # step 4 + the comment block around line 15462). Asserting on
          # the legacy path was failing this gate on every push despite
          # successful installs.
          for d in .venv state; do
            if [ ! -d "$d" ]; then
              echo "::error::MISSING directory: $d"
              missing=$((missing + 1))
            else
              echo "  [ok] $d/"
            fi
          done
          if [ ! -f .env ]; then
            echo "::error::MISSING .env"
            missing=$((missing + 1))
          else
            if grep -q "^KG_COLLECTION=" .env; then
              kg="$(grep -m1 '^KG_COLLECTION=' .env | cut -d= -f2-)"
              if [ -z "$kg" ]; then
                echo "::error::.env KG_COLLECTION is set but empty"
                missing=$((missing + 1))
              else
                echo "  [ok] .env has KG_COLLECTION=$kg"
              fi
            else
              echo "::error::.env does not contain KG_COLLECTION="
              missing=$((missing + 1))
            fi
          fi
          if [ "$missing" -gt 0 ]; then
            echo "::error::$missing install artifact(s) missing — install incomplete"
            exit 1
          fi
          echo "Install artifacts OK"

      - name: Verify install artifacts (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: vco-fresh-clone
        shell: cmd
        run: |
          REM G-1: directory existence uses the trailing-backslash idiom
          REM rather than the legacy `dir\NUL` device trick, which is not
          REM reliable on NTFS on modern Windows.
          set MISSING=0
          if not exist .venv\ (
            echo ::error::MISSING directory: .venv
            set /a MISSING+=1
          ) else (
            echo   [ok] .venv\
          )
          if not exist state\ (
            echo ::error::MISSING directory: state
            set /a MISSING+=1
          ) else (
            echo   [ok] state\
          )
          REM NOTE: claude_mcp_servers\.venv is a STALE LEGACY PATH; the canonical
          REM venv lives at PROJECT_ROOT\.venv -- see install.py step 4 and the
          REM comment block around line 15462. Asserting on the legacy path
          REM was failing this gate on every push despite successful installs.
          if not exist .env (
            echo ::error::MISSING .env
            set /a MISSING+=1
          ) else (
            findstr /B /C:"KG_COLLECTION=" .env >NUL
            if errorlevel 1 (
              echo ::error::.env does not contain KG_COLLECTION=
              set /a MISSING+=1
            ) else (
              echo   [ok] .env has KG_COLLECTION=
            )
          )
          REM G-1: echo text below must stay paren-free. The earlier
          REM "artifact(s)" wording aborted this whole step at parse time
          REM under cmd.exe -- see the bootstrap-pre step comment.
          if %MISSING% gtr 0 (
            echo ::error::%MISSING% install artifacts missing
            exit /b 1
          )
          echo Install artifacts OK

      # ----------------------------------------------------------------
      # 7. Launcher headless boot via --check-only — EXPLICITLY SKIPPED
      #    until Track C lands the flag (v0.2.54).
      #
      #    v0.2.54 G-1: the previous live invocation could NEVER work
      #    against v0.2.53 binaries and was a guaranteed red/hang once
      #    the install steps passed:
      #      - `handle_cli_args()` in launcher/src-tauri/src/lib.rs only
      #        recognises --set-storage-config and --register-default-mcps;
      #        any other argv falls through to GUI startup.
      #      - On headless Linux runners that dies with a GTK/display
      #        error which does NOT match the step's
      #        'unrecognized|unknown|no such option|invalid' skip filter
      #        → hard step failure.
      #      - On Windows it opens a real window that never exits →
      #        25-minute job timeout.
      #    The Windows variant also carried the "(Track C pending)^;"
      #    cmd.exe paren parse bomb (same class as the bootstrap-pre bug).
      #
      #    Track C: when --check-only lands in handle_cli_args(), replace
      #    this skip with a live invocation asserting exit 0 + JSON on
      #    stdout, and gate the "pending" tolerance on a deterministic
      #    probe (e.g. `vct-launcher --check-only` exits 2 for
      #    unknown-flag), NOT on stderr text matching.
      # ----------------------------------------------------------------
      - name: Launcher --check-only (skipped - Track C pending)
        shell: bash
        run: |
          echo "::warning::launcher --check-only not implemented in v0.2.53 binaries (Track C, v0.2.54). Step is an explicit no-op; see workflow comment for the re-enable contract."

      # ----------------------------------------------------------------
      # 8. Post-install bootstrap probe — assert ready_to_install=true.
      #    Same Track-B-pending tolerance as the pre-probe.
      # ----------------------------------------------------------------
      - name: Bootstrap probe (post-install) + InstallHealthGate assertion
        if: matrix.os != 'windows-latest'
        working-directory: vco-fresh-clone
        shell: bash
        run: |
          set -uo pipefail
          if ! python3 install.py --bootstrap --json > bootstrap-post.json 2>bootstrap-post.stderr; then
            if grep -qiE 'unrecognized|no such option|unknown' bootstrap-post.stderr 2>/dev/null; then
              echo "::warning::install.py --bootstrap not yet implemented; skipping post-probe assertions"
              exit 0
            fi
            echo "::error::install.py --bootstrap (post-install) failed:"
            cat bootstrap-post.stderr
            exit 1
          fi
          python3 -c "
          import json, sys
          d = json.load(open('bootstrap-post.json'))
          paths = d.get('paths', {})
          assert paths.get('install_root_kind') == 'completed_install', f'install_root_kind={paths.get(\"install_root_kind\")} expected completed_install'
          assert paths.get('state_dir_exists') is True, 'state_dir_exists should be True after install'
          assert paths.get('launcher_binary_exists') is True, 'launcher_binary_exists should be True after install'
          # v0.2.54 G-1: this smoke installs with --no-containers (GH
          # runners have no usable compose stack; macos-14 ships no
          # container runtime at all), and the bootstrap envelope marks a
          # missing container runtime as a BLOCKING prereq regardless of
          # install flags. A container-runtime blocker is therefore
          # EXPECTED here; any OTHER blocker is a real failure.
          blockers = d.get('blocker_messages') or []
          non_container = [b for b in blockers
                           if not any(k in b.lower() for k in ('podman', 'docker', 'container'))]
          assert not non_container, f'non-container blockers present: {non_container}'
          if blockers:
              print(f'Tolerated container-runtime blockers (--no-containers smoke): {blockers}')
          print('Bootstrap envelope confirms install complete; InstallHealthGate would NOT fire.')
          "

      # ----------------------------------------------------------------
      # 9. Upload diagnostic artifacts on failure.
      # ----------------------------------------------------------------
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: install-smoke-diagnostics-${{ matrix.target }}
          path: |
            vco-fresh-clone/bootstrap-pre.json
            vco-fresh-clone/bootstrap-pre.stderr
            vco-fresh-clone/bootstrap-post.json
            vco-fresh-clone/bootstrap-post.stderr
            vco-fresh-clone/launcher-check.json
            vco-fresh-clone/launcher-check.stderr
            vco-fresh-clone/state/logs/install.jsonl
          if-no-files-found: ignore
          retention-days: 14
