name: Hook OS-Parity & Template Drift Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

# Cancel previous parity-gate runs on the same branch when a new commit
# is pushed. Pre-fork audit item #4 (2026-05-08).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hook-parity:
    name: Check .sh / .ps1 hook parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run parity check
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          python3 .github/scripts/check_hook_parity.py

  template-drift:
    name: Check .claude/ ↔ templates/ drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run drift check
        run: |
          python3 .github/scripts/check_template_drift.py

  hook-set-discipline:
    name: Check `set -e` always paired with `pipefail`
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run set-discipline check
        run: |
          python3 .github/scripts/check_hook_set_directives.py

  settings-template-drift:
    # Catches the failure mode where .claude/settings.json wires a hook (e.g.
    # kg-update-nudge) but the install templates ship without it — fresh
    # installs then get a dead hook script. Rooted by the 2026-05-08
    # install-flow audit (3 missing kg-update-nudge wirings).
    name: Check .claude/settings.json ↔ install-templates drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run settings-template drift check
        run: |
          python3 .github/scripts/check_settings_template_drift.py
