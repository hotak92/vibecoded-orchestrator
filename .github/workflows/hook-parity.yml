name: Hook OS-Parity Gate

# PR-39 (v0.2.12, 2026-05-16): the public repo no longer ships
# .claude/{hooks,scripts,settings.json} — those are rendered from templates/
# at install time. The two former drift gates (check_template_drift.py and
# check_settings_template_drift.py) compared .claude/ ↔ templates/, which is
# now meaningless (templates are the single source of truth). Both gates +
# their workflow jobs were removed alongside the shipped duplicates.
#
# The remaining gates are STILL valuable:
#  - hook-parity: .sh ↔ .ps1 logical equivalence on the TEMPLATE side.
#  - hook-set-discipline: `set -e` + `pipefail` pairing on template hooks.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

# Cancel previous parity-gate runs on the same branch when a new commit
# is pushed. Pre-fork audit item #4 (2026-05-08).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hook-parity:
    name: Check .sh / .ps1 hook parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run parity check
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          python3 .github/scripts/check_hook_parity.py

  hook-set-discipline:
    name: Check `set -e` always paired with `pipefail`
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run set-discipline check
        run: |
          python3 .github/scripts/check_hook_set_directives.py
