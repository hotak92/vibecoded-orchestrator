name: Hook OS-Parity & Template Drift Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hook-parity:
    name: Check .sh / .ps1 hook parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run parity check
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          python3 .github/scripts/check_hook_parity.py

  template-drift:
    name: Check .claude/ ↔ templates/ drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run drift check
        run: |
          python3 .github/scripts/check_template_drift.py
