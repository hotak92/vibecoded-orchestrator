# Step 22 — multi-project access-matrix regression test.
#
# Asserts v0.2.21's acceptance criterion properties (1–9) across 3
# projects with distinct access-matrix configurations:
#
#   * Project A reads B's KG; B does NOT read A's KG.
#   * Project A grants B codegraph read; no other grants.
#   * Project C is the negative control — own collections only.
#
# Runs on Linux / macOS / Windows because the resolver client is
# bash on Unix and PowerShell on Windows; we want both surfaces
# under regression. The fixture itself (launcher.db seeding) is
# pure Python and runs identically on all three OSes.
#
# v0.2.22 Item #8 — 2 × 3 matrix (Podman/Docker × OS, 6 cells).
# Each cell exports VCT_CONTAINER_RUNTIME so any incidental runtime
# code path in the hub or resolver is exercised against the pinned
# runtime. The access-matrix contract is HTTP/DB-only today, so a
# missing container binary on the runner does NOT fail the test —
# the env var still pins downstream code paths (e.g. for the
# acceptance Property-12 follow-up in plan Item #10).
#
# Distinct from .github/workflows/release.yml (Step 7's release
# pipeline) — that ships binaries on tag; this asserts correctness
# on every PR. The two never share a job.
#
# Sandbox-isolation contract: see tests/common/sandbox.py docstring.
# Briefly:
#   * VCT_STATE_DIR scoped to $RUNNER_TEMP/.vct-step22-<run_id>/
#   * Weaviate collection names prefixed STEP22_<run_id>_*
#   * Keychain prefixed step22-<run_id>-
#   * Refuses to run without VCO_CI_FIXTURE=1.
# Real ~/.vct/ is never touched.

name: Step 22 — Multi-Project Access Matrix

on:
  pull_request:
    paths:
      - "launcher/src-tauri/vct-hub/**"
      - "launcher/src-tauri/vct-launcher-core/src/db/**"
      - "templates/scripts/vct_project_config.*"
      - "templates/scripts/vct_secrets_resolve.*"
      - "tests/common/sandbox.py"
      - "tests/integration/step22_multi_project/**"
      - ".github/workflows/step22-multi-project-access-matrix.yml"
  # v0.2.75 P2b: also run on pushes to main touching the same paths, so
  # the pre-ship workflow-green gate (scripts/pre-ship-check.sh Gate 24)
  # has a main-branch run to assert against. The path list MUST stay in
  # sync with the pull_request block above.
  push:
    branches: [main]
    paths:
      - "launcher/src-tauri/vct-hub/**"
      - "launcher/src-tauri/vct-launcher-core/src/db/**"
      - "templates/scripts/vct_project_config.*"
      - "templates/scripts/vct_secrets_resolve.*"
      - "tests/common/sandbox.py"
      - "tests/integration/step22_multi_project/**"
      - ".github/workflows/step22-multi-project-access-matrix.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  multi-project-access-matrix:
    name: ${{ matrix.os }} / ${{ matrix.runtime }} access-matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      # fail-fast: false ensures one matrix-cell failure doesn't cancel
      # the other 5. Property (12) of v0.2.21's acceptance criterion
      # (Podman/Docker runtime parity) is asserted by running the SAME
      # access-matrix correctness contract under each container runtime
      # via VCT_CONTAINER_RUNTIME — see "Runtime parity" comment below.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        runtime: [podman, docker]
    env:
      # Runtime parity (v0.2.22 Item #8): VCT_CONTAINER_RUNTIME is
      # honoured by install.py, every templates/hooks/*.{sh,ps1}, and
      # the launcher's services/runtime.rs::resolve_runtime() (PR-43,
      # v0.2.12). Setting it per matrix axis pins both the hub binary's
      # incidental runtime probes AND any future runtime-aware code path
      # in the resolver/fixture to the axis under test. Today the Step
      # 22 fixture invokes the hub binary directly without spinning up
      # containers (the access-matrix contract is HTTP/DB-only), so a
      # missing container binary on the runner does NOT fail the test —
      # it just means no runtime-dependent path is exercised. Future
      # Property (12) field-coverage work (deferred plan Item #10) will
      # add end-to-end assertions that turn the runtime axis from
      # smoke-only into a hard requirement.
      VCT_CONTAINER_RUNTIME: ${{ matrix.runtime }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri
          # The hub binary alone doesn't need full Tauri caching, but
          # sharing the cache key with the main CI job means we re-use
          # warm artifacts when the same commit ran the rust job first.
          shared-key: vct-hub-step22

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # vct-hub links keyring with sync-secret-service on Linux, which
      # requires libdbus-1.  This was the root cause of the 2/6 ubuntu
      # cell failures on PR #274 (run 26480314750): cargo build exited 101
      # with "pkg_config: dbus-1 not found".  The comment above ("pure-axum
      # binary — no GTK/webkit deps") was correct about WebKit but missed
      # the dbus transitive dep.  Minimal apt install mirrors the fix
      # already applied to manifest-validate.yml in v0.2.41 (CI-8, W7).
      # macOS + Windows runners do not have this step (if: ubuntu guard).
      - name: Install libdbus-1-dev (Linux only — keyring dep)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Build vct-hub (release)
        shell: bash
        working-directory: launcher/src-tauri
        run: cargo build --release -p vct-hub

      - name: Resolve hub binary path
        shell: bash
        id: hub-bin
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            bin="launcher/src-tauri/target/release/vct-hub.exe"
          else
            bin="launcher/src-tauri/target/release/vct-hub"
          fi
          full="$(pwd)/$bin"
          ls -l "$full"
          echo "path=$full" >> "$GITHUB_OUTPUT"

      # Build-time fixture-only smoke test (validates the Python
      # fixture builds cleanly + the access-matrix rows go into the
      # DB correctly). Cheap defense against accidentally landing a
      # broken fixture even if the pytest step is gated on a binary
      # that ends up missing on one OS.
      - name: Fixture build smoke
        shell: bash
        env:
          VCO_CI_FIXTURE: "1"
          # Use a deterministic per-(os, runtime) RUN_ID so the build-
          # smoke + the pytest run + the two runtime-axis cells on the
          # same OS land in separate scratch dirs and can't collide.
          VCO_TEST_RUN_ID: smokebuild${{ matrix.os }}-${{ matrix.runtime }}-${{ github.run_id }}
        run: |
          python -m tests.integration.step22_multi_project.fixture build > "$RUNNER_TEMP/fixture-output.json"
          python -m tests.integration.step22_multi_project.fixture info --run-id "$VCO_TEST_RUN_ID"
          python -m tests.integration.step22_multi_project.fixture teardown --run-id "$VCO_TEST_RUN_ID"

      - name: Run Step 22 pytest
        shell: bash
        env:
          VCO_CI_FIXTURE: "1"
          VCT_HUB_BINARY: ${{ steps.hub-bin.outputs.path }}
        run: |
          python -m pytest tests/integration/step22_multi_project/ -v --tb=short

      # Always-run teardown sweep. The pytest fixture's teardown
      # callback handles the common path; this is a belt-and-braces
      # cleanup for the case where pytest crashed before its yield
      # finalizer ran.
      - name: Teardown (always)
        if: always()
        shell: bash
        env:
          VCO_CI_FIXTURE: "1"
        run: |
          # Best-effort: list every step22 sandbox dir under
          # $RUNNER_TEMP and tear each one down. We're not interested
          # in surface-level errors here — pytest already passed/
          # failed, this is hygiene.
          if [ -n "${RUNNER_TEMP:-}" ] && [ -d "${RUNNER_TEMP}" ]; then
            for d in "${RUNNER_TEMP}"/.vct-step22-*; do
              [ -d "$d" ] || continue
              rid="$(basename "$d" | sed 's/^.vct-step22-//')"
              echo "[step22-teardown] cleaning $d (run_id=$rid)"
              python -m tests.integration.step22_multi_project.fixture teardown --run-id "$rid" || true
            done
          fi

      # Cell-failure summary (CI-8, v0.2.42 W7).
      # fail-fast: false means a failing cell doesn't cancel the others, but
      # it also means the overall run summary shows a single red icon without
      # identifying WHICH cells failed.  This step writes a GitHub Step
      # Summary entry so the run's "Summary" tab surfaces the exact cell that
      # regressed (OS / runtime pair) without requiring the operator to click
      # into every matrix-leg log.
      - name: Report matrix cell outcome
        if: always()
        shell: bash
        run: |
          CELL="${{ matrix.os }} / ${{ matrix.runtime }}"
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            echo "### Step 22 cell: $CELL — PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Step 22 cell: $CELL — FAIL (exit status: $STATUS)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Likely causes:" >> "$GITHUB_STEP_SUMMARY"
            echo "- Linux: missing libdbus-1-dev (now installed above; if still failing, check pkg-config output)" >> "$GITHUB_STEP_SUMMARY"
            echo "- Any OS: Cargo.lock windows-sys version conflict (check PR that triggered this run)" >> "$GITHUB_STEP_SUMMARY"
            echo "- Any OS: pytest regression in tests/integration/step22_multi_project/" >> "$GITHUB_STEP_SUMMARY"
          fi
