name: CodeQL

on:
  # v0.2.30: skip on PURE-DOCS changes only (paths-ignore). CodeQL
  # analyzes source code; a knowledge/ or docs/ touch never changes
  # the analysis result. The weekly schedule (below) still runs CodeQL
  # on a clean cadence even if every push during the week happened to
  # be docs-only. See `.github/workflows/ci.yml` for the canonical
  # exclude list + the rationale on why `**.md` and `templates/**` are
  # NOT in the ignore list.
  push:
    # v0.2.42: include release/** so CodeQL runs on release branches
    # (pre-release-gate verification + branch-protection requires CodeQL
    # green on the target SHA before release → main merge).
    branches: [ "main", "release/**" ]
    paths-ignore:
      - 'knowledge/**'
      - 'docs/**'
      - '.claude/context/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'LICENSE.*'
      - 'CODE_OF_CONDUCT.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'CLA.md'
      - 'BOOTSTRAP.md'
      - 'KNOWN_ISSUES.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/FUNDING.yml'
      - '.github/CODEOWNERS'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'knowledge/**'
      - 'docs/**'
      - '.claude/context/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'LICENSE.*'
      - 'CODE_OF_CONDUCT.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'CLA.md'
      - 'BOOTSTRAP.md'
      - 'KNOWN_ISSUES.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/FUNDING.yml'
      - '.github/CODEOWNERS'
  schedule:
    # Weekly Monday 06:00 UTC, matches Dependabot's schedule.
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write
  packages: read
  actions: read

# Cancel previous CodeQL runs on the same branch when a new commit is
# pushed. Pre-fork audit item #4 (2026-05-08).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          # Rust intentionally omitted: CodeQL has no native Rust support
          # in 2026. Cargo deps are covered by Dependabot security updates;
          # Rust binary surface area is small (Tauri commands).

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-extended catches more security-relevant patterns at
          # roughly 2x the runtime of the default suite. Negligible cost
          # at this repo size and worth the broader coverage on a fresh
          # public release.
          queries: security-extended
          # v0.2.42 W6 (SEC-1): suppress alerts on vendored third-party
          # dist bundles (excalidraw, mermaid) and false-positive
          # py/clear-text-logging-sensitive-data in config_projection.py.
          # See .github/codeql-config.yml for the full rationale.
          config-file: ./.github/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
