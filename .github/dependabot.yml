# Dependabot configuration for hotak92/vibecoded-orchestrator.
#
# Grouping policy
# ---------------
# Each ecosystem rolls minor + patch bumps into a single weekly PR.
# Major bumps still fire individually because they often need targeted
# runtime validation (e.g. transformers v4→v5 vs CodeSage-Large-v2's
# trust_remote_code modeling file — see knowledge/concepts notes for
# the post_init() incompatibility we discovered 2026-05-04).
#
# History
# -------
# Pre-grouping (until 2026-05-04): one Monday could spawn 19 individual
# PRs across the 5 ecosystems below. Most were patch-level and green;
# the noise obscured the few that needed real review.
#
# First grouping pass (2026-05-04, PR #120): added `applies-to:
# version-updates + update-types` but omitted `patterns: ["*"]`.
# The npm and Cargo groups worked on the next Monday batch (#125, #128
# rolled up), but all 5 pip PRs (#122 #123 #124 #126 #127) fired
# individually — Dependabot needs an explicit `patterns:` to match
# unnamed dependencies into a group.
#
# Current pass (2026-05-04 followup): added `patterns: ["*"]` to every
# group + tightened `update-types` semantics. Expect ~3-5 PRs/week
# total (1 per ecosystem with non-major activity, plus one per major
# bump that fires through the ungrouped path).

version: 2
updates:
  # ─── Python (root requirements files) ────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"
    ignore:
      # transformers >=4.50 breaks the CodeSage-Large-v2 code-embedding
      # container — rationale: the transformers pin block in requirements.txt.
      - dependency-name: "transformers"
        versions: [">=4.50.0"]
    groups:
      python-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ─── Python (MCP server requirements) ────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/claude_mcp_servers"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
      - "mcp"
    commit-message:
      prefix: "deps(mcp)"
      include: "scope"
    ignore:
      # transformers >=4.50 breaks the CodeSage-Large-v2 code-embedding
      # container — rationale: the transformers pin block in
      # claude_mcp_servers/code_embedding_service/requirements.txt.
      - dependency-name: "transformers"
        versions: [">=4.50.0"]
    groups:
      mcp-python-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ─── GitHub Actions ──────────────────────────────────────────────────
  # GHA version aliases are typically non-breaking even at major (e.g.
  # actions/checkout@v4 → @v6 was a transparent upgrade for our usage).
  # Group ALL update-types here — that batch on 2026-05-04 (#101 #102
  # #103) merged with no behavioural change.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions-all:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"

  # ─── npm (launcher GUI: Tauri + Svelte) ──────────────────────────────
  - package-ecosystem: "npm"
    directory: "/launcher"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
      - "launcher"
    commit-message:
      prefix: "deps(launcher)"
      include: "scope"
    groups:
      launcher-npm-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ─── Cargo (launcher Tauri Rust backend) ─────────────────────────────
  # Note on Rust 0.x crates: per Cargo semver, 0.X → 0.Y is technically
  # major (breaking). Cargo bumps for 0.x crates classified as `major`
  # by Dependabot will fire individually — that's appropriate here
  # because our launcher uses several load-bearing 0.x crates (rusqlite,
  # toml, sha2, axum) and each major bump deserves a runtime smoke-test.
  - package-ecosystem: "cargo"
    directory: "/launcher/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "cargo"
      - "launcher"
    commit-message:
      prefix: "deps(launcher)"
      include: "scope"
    groups:
      launcher-cargo-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
