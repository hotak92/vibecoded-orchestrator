# NVIDIA CUDA overlay — PODMAN-SPECIFIC.
#
# Apply with:
#   podman-compose -f docker-compose.yml -f podman-compose.gpu.yml --profile gpu up -d
#
# Why a separate file from docker-compose.gpu.yml:
#   - Podman ≥ 4.6 reads the standard `deploy.resources.reservations.devices`
#     block but only when the NVIDIA CDI spec has been generated on the
#     host (see prerequisites below).
#   - On older Podman releases or when CDI is unavailable, the canonical
#     form is `--device nvidia.com/gpu=all` (CDI form). podman-compose
#     translates this from a `devices: [nvidia.com/gpu=all]` entry, NOT
#     from a `deploy.resources.reservations.devices` block.
#   - Docker compose can't parse the `nvidia.com/gpu=all` device spec —
#     that's why we keep two files.
#
# Prerequisites (Podman, run ONCE on the host BEFORE compose-up):
#
#   1. Install NVIDIA Container Toolkit ≥ 1.18.0:
#      https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
#
#   2. Container Toolkit ≥ 1.18.0 ships `nvidia-cdi-refresh.path` +
#      `.service` systemd units that AUTO-write the CDI spec to
#      /var/run/cdi/nvidia.yaml on every driver install/upgrade. install.py
#      verifies these units are enabled. **DO NOT** write
#      /etc/cdi/nvidia.yaml manually — Podman reads /etc/cdi/ before
#      /var/run/cdi/, so a manual file shadows the auto-refreshed one and
#      goes stale on the next driver upgrade. Symptom of a stale spec:
#      every GPU container fails with `runc: failed to fulfil mount
#      request: ... libEGL_nvidia.so.<old-version>: no such file`.
#
#      Verify auto-refresh active:
#        systemctl is-enabled nvidia-cdi-refresh.path   # → enabled
#
#      If you (or an old install of this project) wrote /etc/cdi/nvidia.yaml,
#      remove it: `sudo rm /etc/cdi/nvidia.yaml`. /var/run/cdi/ takes over.
#
#   3. Configure podman runtime once:
#        sudo nvidia-ctk runtime configure --runtime=podman
#
#   4. Verify with:  podman run --rm --device nvidia.com/gpu=all \
#                      ubuntu nvidia-smi
#
# References:
#   - Podman GPU access:           https://podman-desktop.io/docs/podman/gpu
#   - NVIDIA Container Toolkit:    https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html

services:
  ollama:
    devices:
      - nvidia.com/gpu=all

  code_embed:
    devices:
      - nvidia.com/gpu=all
