services:
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.28.4
    # Explicit prefixed name keeps us out of the way of any bare `weaviate`
    # container the user might already be running. The compose project name
    # already prefixes generated names, but pinning it makes lifecycle CLI
    # output self-describing.
    container_name: vco_weaviate
    ports:
      - "${WEAVIATE_PORT:-8081}:8080"
      - "${WEAVIATE_GRPC_PORT:-50052}:50051"
    volumes:
      - weaviate_data:/var/lib/weaviate
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1
      # --- WRITE-AMPLIFICATION REDUCTION (v0.2.61) ---
      # The KG/code-graph sync hooks issue MANY small upserts (one per edited
      # node/file + re-embeds). On Weaviate defaults each dirty memtable
      # flushes on a 60s timer, and with thousands of LSM stores that's a
      # continuous flush+compaction drumbeat → ~57x write amplification (a 5GB
      # dataset rewrote ~290GB in 12h on a real install). These knobs (all
      # verified against the v1.28.4 source, safe 8-64GB, podman+docker) cut
      # steady-state writes by roughly an order of magnitude.
      #
      # Flush a dirty memtable after 3600s (1h) instead of 60s — THE primary
      # lever. Paired with the 500MB size-trigger below, a memtable flushes on
      # 500MB OR 1h, whichever fires first: on the hook trickle workload the
      # SIZE trigger almost always wins (bounding the backlog), while quiet
      # periods coast up to an hour with far fewer flushes. Data stays
      # WAL-durable throughout; an unclean kill replays the in-memory delta
      # from the WAL (bounded to ~500MB by the size cap, NOT by this timer).
      PERSISTENCE_MEMTABLES_FLUSH_DIRTY_AFTER_SECONDS: 3600
      # Raise the memtable SIZE-trigger flush from the implicit 200MB default to
      # 500MB. NOTE: this cap is PER ACTIVE MEMTABLE = per LSM store, NOT global
      # and NOT per-collection — there are thousands of stores (objects +
      # per-property stores across all collections), each with its own active
      # memtable. So we keep 500MB (not 1GB): a hot store holds up to 500MB, and
      # during a multi-collection bulk op several hot stores sum up — 500MB
      # stays safe on an 8GB host, whereas 1GB-per-store could balloon RAM.
      # It (a) cuts write amplification (fewer, larger flushes → fewer sidecar
      # rewrites + compactions) and (b) BOUNDS durability: a memtable flushes on
      # 500MB OR 1h, so the WAL+memtable replay backlog is capped at ~500MB
      # regardless of the 1h timer. It's a CAP not a reservation (a store only
      # holds 500MB if it accrues that much before the timer); LIMIT_RESOURCES
      # bounds total Go heap to 80% RAM. Every write is WAL-durable on upsert —
      # this changes flush CADENCE, never the WAL/fsync path, so write-drop risk
      # is equal-or-lower than the default.
      PERSISTENCE_MEMTABLES_MAX_SIZE_MB: 500
      # LSM max segment size. RAISED 500MiB -> 2GiB in v0.2.73 (FIX-D1).
      # WHY THE RAISE: the old 500MiB cap was NET-HARMFUL for a large,
      # update-heavy collection. Weaviate objects are immutable — every
      # `replace()` writes a new version + tombstones the old; a big
      # CodeFunction collection accumulated ~42k DEAD versions across 251
      # un-mergeable segments because the 500MiB cap PREVENTS compaction from
      # collapsing them into a few large segments. So the dead versions were
      # re-written on every compaction cycle and never reclaimed — ongoing
      # write I/O that this raise ENDS (compaction now converges once, then
      # stays collapsed = fewer total re-writes over a long session).
      # TRADEOFF: a larger cap means a single merge can rewrite up to ~2x the
      # cap (~4GB) as a transient spike. Keep it CONSERVATIVE at 2GiB (not 4)
      # so 2x cap stays well under free disk; a spike bigger than free headroom
      # could trip DISK_USE_READONLY_PERCENTAGE (default 90%) and flip the
      # collection read-only. Existing TOMBSTONE_DELETION_* brakes (below) still
      # bound the cleanup work. Env name + "2GiB" format confirmed valid
      # (weaviate-doc-verification-1.37 C9; applies on the pinned 1.28.4 too).
      PERSISTENCE_LSM_MAX_SEGMENT_SIZE: 2GiB
      # v0.2.73 FIX-D1 companion: make the read-only guard EXPLICIT (was the
      # Weaviate default 90% on this canonical file, while the legacy
      # claude_mcp_servers/compose.yaml already pinned 98). Both wire into the
      # SAME shared volume, so they must AGREE — pin 98 here for parity. 98 also
      # gives the raised 2GiB cap a little more headroom before a big merge spike
      # trips read-only. NOTE: this raises the read-only threshold, not the
      # disk-FULL guarantee — the operator still needs free disk >~2x the cap;
      # the value trades a slightly later read-only trip for a slightly smaller
      # last-resort safety margin. Documented, deliberate.
      DISK_USE_READONLY_PERCENTAGE: "98"
      # Auto-size the Go heap + CPU to the host (or to a container mem_limit if
      # one is set): GOMEMLIMIT ~= 80% of available RAM, GOMAXPROCS = cores-1.
      # Reduces heap-pressure-driven flushing and removes the OOM tail risk on
      # small hosts. Self-scaling = safe to ship to unknown hardware (an 8GB
      # box gets ~6.4GB, a 64GB box ~51GB). To pin instead: unset this and set
      # GOMEMLIMIT=<N>MiB explicitly.
      LIMIT_RESOURCES: "true"
      # --- HNSW TOMBSTONE-CLEANUP CHURN REDUCTION (v0.2.61) ---
      # SECOND disk-leak source, distinct from the memtable write-amp above.
      # The code-graph collections accumulate large tombstone counts (a
      # re-analyze deletes+re-inserts every changed row → one tombstone per
      # deleted vector). Weaviate runs a per-(class × named-vector × shard)
      # HNSW tombstone-cleanup cycle on a FIXED 300s ticker
      # (entities/vectorindex/hnsw/config.go DefaultCleanupIntervalSeconds =
      # 5*60; the FixedTicker never backs off — ticker.go fixedIntervals
      # Advance()/Reset() are no-ops). On this install ~300 such HNSW indexes
      # exist (many projects × 5 Code* classes × 2-6 embedding slots), so the
      # 300s cycles INTERLEAVE into roughly one cleanup firing every second in
      # aggregate. Each fire that finds work walks the graph and reassigns
      # neighbor edges IN PLACE — GB/hour of writes that are invisible to
      # mtime (commitlog/index rewrites), distinct from the LSM flush path.
      #
      # The spin: with the default TOMBSTONE_DELETION_MIN_PER_CYCLE=0, the
      # cleanup runs a full graph walk on ANY non-zero tombstone count
      # (delete.go copyTombstonesToAllowList only short-circuits at EXACTLY 0
      # tombstones). A collection sitting at thousands of tombstones therefore
      # re-walks its graph every single 300s tick forever, churning even when
      # `tombstones_in_cycle` is ~0 relative to `tombstones_total`.
      #
      # The brake: raise the MIN threshold so a cleanup is a cheap no-op
      # (returns "did nothing", costs one map-length read) until enough
      # tombstones accumulate to justify the full graph walk. This is a GLOBAL
      # env read directly via os.Getenv in delete.go (NOT registered in
      # environment.go), verified present verbatim at the v1.28.4 tag. It
      # applies to ALL existing collections immediately — unlike the per-class
      # `cleanupIntervalSeconds`, which config_update.go marks IMMUTABLE (can
      # only be set at class-creation, so it can't retro-fix the 300 live
      # indexes without a destructive recreate).
      #
      # SAFE / NO DATA LOSS: tombstone cleanup is pure garbage-collection of
      # vectors that were ALREADY deleted. Deferring it only delays reclaiming
      # the disk those dead vectors occupy (a few MB until the next qualifying
      # cycle); it NEVER touches, drops, or corrupts live vectors, and searches
      # already skip tombstoned nodes via the deny-list. The complementary
      # analyzer-side content-hash skip (separate change) slashes tombstone
      # GENERATION, so a higher threshold means tombstones rarely reach it
      # anyway. 10000 is conservative for 8-64GB hosts (one tombstone ≈ one
      # dead vector; 10k un-reclaimed vectors is a few tens of MB worst case).
      TOMBSTONE_DELETION_MIN_PER_CYCLE: "10000"
      # Bound the per-cycle cost so that when a cleanup DOES fire on a large
      # backlog it processes at most this many tombstones, then exits and lets
      # the next cycle take the rest (delete.go maxTombstonesPerCycle, default
      # math.MaxInt64 = "process everything in one cycle" = a multi-GB write
      # spike on a huge backlog). Capping it spreads a big reclaim across
      # several short cycles instead of one long stall. Verified at v1.28.4.
      TOMBSTONE_DELETION_MAX_PER_CYCLE: "10000"
      # Bound the PARALLELISM of neighbor-reassignment within a cleanup cycle
      # (delete.go tombstoneDeletionConcurrency, default GOMAXPROCS/2). Pinning
      # to 1 keeps a cleanup that does fire from saturating disk/CPU on small
      # hosts; the cleanup is off the hot path so single-threaded is fine.
      # Verified at v1.28.4. (Does NOT change cleanup frequency — that's the
      # MIN/interval levers above; this only caps the intra-cycle cost.)
      TOMBSTONE_DELETION_CONCURRENCY: "1"
    restart: unless-stopped
    healthcheck:
      # Use /v1/meta, NOT /v1/.well-known/ready. Root cause of the
      # 2026-05-08 weaviate restart-loop / port-mapping desync was that
      # /v1/.well-known/ready returns 503 during legitimate operations
      # (vector-cache prefill, shard load, compactions). The strict
      # endpoint produced healthcheck flap → restart:unless-stopped → race
      # between podman restart N+1 and restart N's teardown → conmon /
      # rootlessport / state-DB desync that left the container in a
      # zombie "running but port dead" state. /v1/meta returns 200 as
      # long as the HTTP server itself is up, which is the right signal
      # for "container is functional". Same fix already applied in the
      # launcher's Rust health probe (PR #141) — compose was missed.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/v1/meta"]
      interval: 30s
      timeout: 5s
      retries: 5
      # Boot can take 20-40s on a multi-GB KG (raft init + shard load +
      # vector-cache prefill). Don't count failures during this window.
      start_period: 60s

  ollama:
    # Pinned for supply-chain trust + reproducibility. Bump deliberately when
    # validating a new ollama release; do NOT use `:latest` in production —
    # users should know what daemon they're running, and CI should be able
    # to reproduce builds. Ollama Linux releases: https://github.com/ollama/ollama/releases
    #
    # GPU overlays (mutually exclusive — install.py picks based on detection):
    #   NVIDIA   → docker-compose.gpu.yml       (driver: nvidia reservation)
    #   AMD ROCm → docker-compose.amd-rocm.yml  (ollama:rocm image + /dev/kfd)
    # Without an overlay this image runs CPU-only even on a GPU host.
    image: docker.io/ollama/ollama:0.20.2
    # See vco_weaviate note above — same anti-collision rationale.
    container_name: vco_ollama
    ports:
      - "${OLLAMA_PORT:-11435}:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_ORIGINS: "*"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
    restart: unless-stopped

  # Code embedding service (GPU — only started with --gpu flag or GPU compose overlay)
  # CPU users: set CODE_EMBED_BACKEND=ollama in .env to use Ollama fallback instead
  #
  # PR-2 portability fix 2026-05-06: build context is env-var-overridable so
  # the compose file works both in the orchestrator clone (where the source
  # tree sits at ../claude_mcp_servers/code_embedding_service) AND in user
  # projects, where the source tree is NOT bundled. The `gpu` profile gate
  # below means CPU users never trigger this build at all; GPU users in a
  # per-project layout must either:
  #   (a) point VCT_CODE_EMBED_BUILD_CONTEXT at the orchestrator clone's
  #       claude_mcp_servers/code_embedding_service path, OR
  #   (b) keep the service orchestrator-only (don't enable the gpu profile
  #       on user-project compose runs), OR
  #   (c) switch to CODE_EMBED_BACKEND=ollama and skip this service.
  code_embed:
    build:
      context: ${VCT_CODE_EMBED_BUILD_CONTEXT:-../claude_mcp_servers/code_embedding_service}
      # v0.2.50 portability fix (audit F1): the default `Dockerfile` is now
      # CPU multi-arch (linux/amd64 + linux/arm64); NVIDIA hosts opt into
      # the CUDA build via `CODE_EMBED_DOCKERFILE=Dockerfile.cuda` in their
      # `.env`. install.py writes that variable automatically when
      # nvidia-smi succeeds. Apple Silicon + AMD ROCm + CPU-only hosts
      # leave the variable unset and get the multi-arch CPU image.
      dockerfile: ${CODE_EMBED_DOCKERFILE:-Dockerfile}
    # Renamed `vct_code_embed` → `vco_code_embed` in v0.2.15 for naming
    # consistency with the rest of the vco_* stack. `vct_code_embed` is
    # kept in `vco_lib.containers.HISTORICAL_ALIASES["code_embed"]` so
    # existing installs migrate cleanly (find_existing_container probes
    # the legacy name as a fallback). When renaming this field again,
    # update in lockstep:
    #   - vco_lib/containers.py (CANONICAL_CONTAINERS + HISTORICAL_ALIASES)
    #   - templates/hooks/_lib/container-names.{sh,ps1}
    #   - templates/hooks/ensure-containers.{sh,ps1} fallback list
    #   - launcher/src-tauri/src/types.rs (ServiceConfig::command)
    #   - launcher/src-tauri/src/commands/volumes.rs (volume_role)
    container_name: vco_code_embed
    restart: unless-stopped
    ports:
      - "${CODE_EMBED_PORT:-11440}:11440"
    environment:
      CODE_EMBED_BACKEND: "${CODE_EMBED_BACKEND:-gpu}"
      CODE_EMBED_MODEL: "codesage/codesage-large-v2"
      CODE_EMBED_DEVICE: "auto"
      CODE_EMBED_DTYPE: "bfloat16"
      CODE_EMBED_PORT: "11440"
      # v0.2.77 F2: honour the host-derived concurrency cap install.py wrote
      # to the orchestrator-root `.env` (producer:
      # vco_lib/install_embed_concurrency.py). Pre-fix this was hardcoded
      # "4" — so the derived cap never reached the containerized service and
      # it kept shedding 503s at 4 regardless of host capacity (5c incident).
      # Compose auto-reads `.env` from its --env-file / project directory;
      # ensure-containers passes the root `.env` (see ensure-containers.sh).
      CODE_EMBED_MAX_CONCURRENT: "${CODE_EMBED_MAX_CONCURRENT:-4}"
      # CPU-fallback (CODE_EMBED_BACKEND=ollama) Ollama endpoint.
      # server.py defaults OLLAMA_URL to http://localhost:11435, but inside
      # this container `localhost` is the container ITSELF, not the Ollama
      # container — so the ollama backend's /health probe fails with
      # "Connection refused localhost:11435/api/embeddings". code_embed and
      # vco_ollama share the default compose network (infrastructure_default),
      # so we reach Ollama by its in-network DNS name on its IN-CONTAINER port
      # (11434, NOT the host-mapped 11435). The gpu/codesage default backend
      # never reads OLLAMA_URL, so this is a no-op there. Power users can
      # override (e.g. an Ollama running on the host) via CODE_EMBED_OLLAMA_URL.
      OLLAMA_URL: "${CODE_EMBED_OLLAMA_URL:-http://vco_ollama:11434}"
      HF_HOME: "/cache"
      HF_HUB_CACHE: "/cache"
      TRANSFORMERS_CACHE: "/cache"
    # Start after Ollama so its in-network DNS name resolves when the ollama
    # backend probes it. Short-form (start-order only) — the ollama service
    # has no healthcheck to gate on, and this must not change the gpu profile
    # gating (the gpu overlay only merges a `deploy.resources` block here).
    depends_on:
      - ollama
    volumes:
      - code_embed_cache:/cache
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:11440/health')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    profiles:
      - gpu  # Only started when `--profile gpu` is passed

# Named volumes — explicit `name:` declarations are required so
# Bug-31-style overrides in docker-compose.override.yml can alias them
# to external pre-existing volumes (otherwise podman-compose 1.5.x
# crashes with "can't merge value of [<vol>] of type NoneType and dict"
# when the override tries to add `external: true` to a null-valued
# entry here). Override pattern:
#
#   volumes:
#     <name_above>:
#       external: true
#       name: <pre-existing-volume-name>
volumes:
  weaviate_data:
    name: vco_weaviate_data
  ollama_data:
    name: vco_ollama_data
  code_embed_cache:
    name: vco_code_embed_cache
