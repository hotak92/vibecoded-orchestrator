# AMD ROCm overlay — PODMAN-SPECIFIC (v0.2.54 canonical short name).
#
# Apply with:
#   podman-compose -f docker-compose.yml -f podman-compose.rocm.yml --profile gpu up -d
#
# Why this file exists (v0.2.54, container-scout C-RT-4 / gpu-scout C-6):
# install.py's overlay picker has preferred `podman-compose.rocm.yml`
# since v0.2.20 — but the file never shipped, so podman+AMD hosts (the
# project's RECOMMENDED engine) always fell through to the legacy
# `podman-compose.amd-rocm.yml`, which lacks BOTH workarounds the
# canonical docker overlay (docker-compose.rocm.yml, v0.2.20) calls
# necessary:
#   * `cap_add: [SYS_PTRACE]` — some ROCm internals (clinfo / rocBLAS
#     introspection) walk other processes' /proc; without it the
#     container starts but rocBLAS may fail to detect the device →
#     silent CPU inference.
#   * `HSA_OVERRIDE_GFX_VERSION: "10.3.0"` — conservative compatibility
#     override for RX 6000-class cards.
# This file = the podman-specific group handling of the legacy overlay
# + those two fixes. The legacy `podman-compose.amd-rocm.yml` stays on
# disk for back-compat (install.py probes this short name first).
#
# AMD users with newer cards (RX 7000+, MI300+) may need to UNSET
# HSA_OVERRIDE_GFX_VERSION. If Ollama logs "rocBLAS error: Could not
# find symbol" or "no kernel image for device", remove the env line and
# re-up.
#
# Prerequisites (Podman, run ONCE on the host BEFORE compose-up):
#
#   1. ROCm kernel driver loaded (`rocm-smi` returns 0).
#
#   2. /dev/kfd and /dev/dri readable from the user account that runs
#      Podman. Two paths:
#      (a) Add the user to the `video` and `render` host groups:
#            sudo usermod -aG video,render $USER
#          Then log out/in.
#      (b) OR rely on the built-in `group_add: [keep-groups]` below
#          (Podman-only; preserves host supplementary groups inside the
#          rootless container).
#
#   3. Verify with:  podman run --rm --device /dev/kfd --device /dev/dri \
#                      --group-add keep-groups docker.io/rocm/dev-ubuntu-22.04 \
#                      rocm-smi
#
# References:
#   - AMD ROCm container guide: https://rocm.docs.amd.com/projects/install-on-linux/en/latest/how-to/docker.html
#   - Podman GPU access:        https://podman-desktop.io/docs/podman/gpu

services:
  ollama:
    # Pinned to the ROCm-tagged Ollama image. Bump deliberately when the
    # base compose file's CPU/CUDA image family is bumped (keep in sync
    # with docker-compose.rocm.yml).
    image: docker.io/ollama/ollama:0.20.2-rocm
    devices:
      - /dev/kfd
      - /dev/dri
    # `keep-groups` is Podman-specific; preserves host supplementary
    # groups (video, render) inside the rootless container without
    # needing to know their numeric GIDs.
    group_add:
      - keep-groups
    # CAP_SYS_PTRACE is needed by some ROCm internals (clinfo / rocBLAS
    # introspection paths) to walk other processes' /proc. Without it
    # the container starts but rocBLAS may fail to detect the device.
    cap_add:
      - SYS_PTRACE
    environment:
      # Conservative override for broader RX 6000-class compatibility.
      # Newer hardware (RX 7000+) may need this unset — see header.
      HSA_OVERRIDE_GFX_VERSION: "10.3.0"

  # code_embed: intentionally NOT defined in this ROCm overlay.
  # CodeSage has no ROCm build path (CUDA or CPU only); AMD hosts get
  # the Ollama-served code embedding model instead — and Ollama itself
  # is ROCm-accelerated via the block above. Mirrors the v0.2.50
  # audit-F7 rationale in docker-compose.rocm.yml.
