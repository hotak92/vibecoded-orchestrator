// Catalog service for the golden-fixture repo (Protobuf, regex-parsed).
// Exercises: package, import, message types → CodeClass, service rpcs → CodeAPI.

syntax = "proto3";

package catalog.v1;

import "common.proto";

message ProductRequest {
  string id = 1;
}

message Product {
  string id = 1;
  string name = 2;
  double price = 3;
}

message ProductList {
  repeated Product products = 1;
}

service CatalogService {
  rpc GetProduct(ProductRequest) returns (Product);
  rpc ListProducts(ProductRequest) returns (ProductList);
}
